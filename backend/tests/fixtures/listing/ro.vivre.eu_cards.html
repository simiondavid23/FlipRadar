 de Vivre in valoare de \u003cstrong\u003e{freeShippingCost}\u003c/strong\u003e achita in avans si beneficiezi de \u003cstrong\u003elivrare gratuita\u003c/strong\u003e.\",\"views_cart_loyalty_points\":\"Vei primi \u003cstrong\u003e{loyaltyPoints} Punct\u003c/strong\u003e dupa finalizarea livrarii | Vei primi \u003cstrong\u003e{loyaltyPoints} Puncte\u003c/strong\u003e dupa finalizarea livrarii.\",\"views_cart_company_bill_not_allowed\":\"Configuratia cosului de cumparaturi nu permite eliberarea facturii pentru persoane juridice.\",\"views_cart_company_bill_not_allowed_notification\":\"Oops! Configuratia cosului de cumparaturi nu permite eliberarea facturii pentru persoane juridice.\",\"views_cart_loyalty_points_plural\":\"\",\"views_cart_vivrepoints_0001\":\"Discount Neuro\",\"views_cart_vivrepoints_0002\":\"Poti adauga maximum {max_points_to_use} puncte.\",\"temp_pod_warning\":\"Va sugeram sa evitati in aceasta perioada utilizarea bancnotelor.\",\"temp_pod_warning_accept\":\"Inteleg riscurile si aleg plata ramburs\",\"cart_email_greeting\":\"Salut!\",\"cart_email_message\":\"Introdu adresa de email \u003cbr\u003e pentru a te loga sau crea un cont nou\",\"notifications_cart_expiresoon\":\"Cosul tau de cumparaturi te asteapta cu cateva produse. Grabeste-te sa le achizitionezi, acestea sunt rezervate o perioada limitata.\",\"cart_points_title\":\"Discount Neuro\",\"cart_points_edit\":\"Modifica\",\"cart_points_currency\":\"neuro\",\"cart_points_form_title\":\"Discount Neuro\",\"cart_points_form_max\":\"Maximum aplicabil\",\"cart_points_form_cta\":\"Aplica\",\"cart_points_info_not_logged_in\":\"Pentru a folosi un discount (Neuro), este nevoie sa\",\"cart_points_info_not_logged_in_action\":\"intri în cont\",\"cart_points_info_wallet_not_confirmed\":\"Pentru a folosi un discount (Neuro), este nevoie sa\",\"cart_points_info_wallet_not_confirmed_action\":\"confirmi numarul de telefon\",\"cart_points_error_max\":\"Poti aplica maxim {points_to_use} neuro!\",\"cart_points_error_integer\":\"Valoarea trebuie sa fie un numar intreg!\",\"cart_wallet_activation_info_title\":\"Ai castigat 1 Neuro\",\"cart_wallet_activation_info_description\":\"Activează portofelul azi pentru a beneficia de neuro câștigați.\",\"cart_wallet_activation_info_cta\":\"Activeaza Wallet\",\"cart_validate_phone_number_description\":\"Pentru a confirma comanda, te rugăm să introduci codul de verificare trimis pe numărul de telefon.\",\"cart_validate_phone_number_warning\":\"Comenzile neconfirmate vor fi anulate automat în 48 de ore.\",\"cart_validate_phone_number_title\":\"Confirmă numărul de telefon și comanda\",\"cart_validation_message\":\"Codul de confirmare comanda Vivre:\",\"cart_validate_phone_number_description_resend\":\"Cod expirat. Apasă butonul de mai jos pentru a primi un cod nou prin SMS de confirmare comanda.\",\"cart_validate_phone_number_description_already_confirmed\":\"Comanda este deja confirmată și transmisă către vânzător.\",\"views_cart_cartindex_valuebaseddiscount\":\"Discount vanzator\",\"views_cart_ckeckout_total_changed\":\"Coșul tău s-a modificat între timp. Noul total este \u003cstrong\u003e{total}\u003c/strong\u003e. Verifică comanda și apasă din nou pe „Plasează comanda” pentru a confirma.\",\"categories_001\":\"Lenjerii de pat\",\"categories_002\":\"Prosoape\",\"categories_003\":\"Covoare\",\"categories_004\":\"Servirea mesei\",\"categories_005\":\"Baie si Accesorii\",\"categories_006\":\"Mobilier\",\"categories_007\":\"Decoratiuni\",\"categories_008\":\"Electrocasnice \u0026 Accesorii\",\"categories_009\":\"Gradina si Accesorii exterior\",\"categories_010\":\"Copii\",\"categories_011\":\"Lifestyle\",\"categories_012\":\"Accesorii pentru gatit\",\"categories_013\":\"Textile bucatarie\",\"categories_014\":\"Obiecte iluminat\",\"categories_015\":\"Esentiale pentru dormit\",\"categories_016\":\"Textile decorative\",\"categories_017\":\"Draperii si perdele\",\"categories_018\":\"Depozitare si Curatare\",\"categories_019\":\"Accesorii de bucatarie\",\"categories_020\":\"Lobby\",\"categories_021\":\"Concepte\",\"categories_022\":\"Animale\",\"categories_023\":\"Sezonier\",\"categories_024\":\"Imbracaminte\",\"categories_025\":\"Incaltaminte\",\"categories_026\":\"Decoratiuni\",\"categories_027\":\"Textile CASA\",\"categories_028\":\"Servire\",\"categories_029\":\"Mobilier\",\"categories_030\":\"Covoare\",\"categories_031\":\"Lumini \u0026 electrocasnice\",\"categories_032\":\"Jucarii\",\"categories_033\":\"Sport\",\"categories_034\":\"Brand-uri\",\"categories_035\":\"Ingrijire personala si bijuterii\",\"categories_036\":\"La scoala\",\"categories_037\":\"Gadget-uri\",\"categories_038\":\"Maternitate\",\"categories_039\":\"Educativ\",\"categories_other\":\"Alte categorii\",\"categories_keywords_1\":\"\",\"categories_keywords_148\":\"\",\"categories_keywords_149\":\"\",\"categories_keywords_206\":\"\",\"categories_keywords_243\":\"\",\"categories_keywords_268\":\"\",\"categories_keywords_373\":\"\",\"categories_keywords_407\":\"\",\"categories_keywords_512\":\"\",\"categories_keywords_612\":\"\",\"categories_keywords_716\":\"\",\"categories_keywords_752\":\"\",\"categories_keywords_771\":\"\",\"categories_title_883\":\"Mobila Depozitare\",\"categories_description_883\":\"mobila si depozitare\",\"categories_keywords_883\":\"mobila\",\"views_staticpage_despre_0001\":\"Despre Vivre\",\"views_staticpage_despre_0002\":\"Ne plac lucrurile frumoase. Ne-am gandit sa cladim o companie plecand de la asta. Vivre este un start-up lansat in Romania in Aprilie 2012 cu scopul de a crea o destinatie  online pentru calitate si bun gust. Cautam in toata lumea produse care ne inspira si vi le punem la dispozitie la preturi accesibile.\",\"views_staticpage_despre_0003\":\"Suntem tineri, dar nu ne lipseste experienta. Vivre are in spate o echipa care lucreaza de peste 10 ani in retail, logistica si e-commerce. Si promitem sa aplicam tot ce am invatat ca sa schimbam modul si conditiile in care romanii consuma design. Scopul Vivre este de a da clientului din ce in ce mai mult, mai bine, mai frumos.\",\"views_staticpage_despre_0004\":\"Monica Cadogan - CEO Vivre Homes\",\"views_staticpage_despre_0005\":\"\\\"De fiecare data cand ma gandesc la Vivre, imi salta inima de bucurie: este arta, zambet si totusi serios. Idei si obiecte care vorbesc, asa as defini designul.\\\"\",\"views_staticpage_despre_0006\":\"Monica Cadogan\",\"views_staticpage_despre_0007\":\"CEO Vivre Homes\",\"views_staticpage_despre_0008\":\"Hai sa ne cunoastem mai bine!\",\"views_staticpage_despre_0009\":\"Ne plac lucrurile frumoase - aceasta este ideea de la care a pornit Vivre, un e-commerce lansat in Romania, in Aprilie 2012, cu scopul de a crea o destinatie online pentru calitate si bun gust. Cum facem asta? Cautam in intreaga lume produse care ne inspira si le punem la dispozitia ta, la preturi accesibile.\",\"views_staticpage_despre_00010\":\"Am implinit 6 ani si suntem unul dintre cele mai importante e-commerce-uri din Europa.\",\"views_staticpage_despre_00011\":\"Ne gasesti in 9 tari, asta inseamna ca… suntem disponibili pentru aproximativ 100 000 000 de cetateni europeni.\",\"views_staticpage_despre_00012\":\"Am livrat in jur de 3 000 000 de comenzi.\",\"views_staticpage_despre_00013\":\"Avem 50 000 de produse in portofoliu si multe dintre ele sunt gata sa sara in cosul tau de cumparaturi.\",\"views_staticpage_despre_00014\":\"Abia asteptam sa te cunoastem!\",\"views_staticpage_despre_00015\":\"PS: Pentru ca ne place sa te tinem la curent cu tot ce-i nou si frumos, lansam in fiecare zi colectii noi din care sa te inspiri. Fii cu ochii pe homepage-ul nostru!\",\"views_staticpage_despre_00016\":\"Ce am facut pana acum?\",\"views_staticpage_faq_0001\":\"Ce este Vivre, cum functioneaza?\",\"views_staticpage_new_faq_0001\":\"Vivre este un magazin online cu mobilier, decoratiuni si accesorii pentru casa si lifestyle. Vivre imbina selectii noi zilnice cu produse aflate permanent pe site, pentru a crea cea mai buna experienta de shopping.\",\"views_staticpage_faq_0002\":\"Vivre este un magazin online dedicat casei si gradinii. Cautam in toata lumea produse de calitate si pregatim colectii zilnice, cu valabilitate limitata. Pentru a comanda un produs este necesara crearea unui cont Vivre.\",\"views_staticpage_faq_0003\":\"\",\"views_staticpage_faq_0004\":\"\",\"views_staticpage_faq_0005\":\"Cum se face plata?\",\"views_staticpage_faq_0006\":\"Plata se poate face atat online, cu cardul, cat si la livrare catre curier. Vivre foloseste serviciile celui mai important procesator de plati online din Romania - PayU.\",\"views_staticpage_faq_0007\":\"Cum se face livrarea?\",\"views_staticpage_faq_0008\":\"Livrarea se face printr-o firma de curierat, in perioada specificata pe pagina fiecarui produs. Perioada de livrare poate varia de la 24 de ore la 4 saptamani.\",\"views_staticpage_faq_0009\":\"Cum se calculeaza pretul final?\",\"views_staticpage_faq_0010\":\"Pretul final se calculeaza dupa cum urmeaza: pretul produselor comandate (afisat la fiecare produs), la care se adauga pretul transportului si, dupa caz, o taxa pentru plata ramburs.\",\"views_staticpage_faq_0011\":\"Pot sa cumpar si sa primesc factura si chitanta pe firma?\",\"views_staticpage_faq_0012\":\"Da. Tot ce trebuie sa faci este sa alegi optiunea \\\"Da\\\" la intrebarea \\\"Doresti factura pe firma?\\\" din pasul 2 al procesului de comanda. (dreapta sus). Daca doresti chitanta pe firma, specifica acest lucru curierului care livreaza comanda, atunci cand achiti rambursul.\",\"views_staticpage_faq_0013\":\"Am uitat parola, ce pot sa fac?\",\"views_staticpage_faq_0014\":\"Mergi pe pagina de \\\"login\\\", introdu adresa de e-mail si apasa \\\"Ai uitat parola?\\\". Verifica-ti inbox-ul si bucura-te din nou de produsele preferate!\",\"views_staticpage_faq_0015\":\"Cum pot renunta la o comanda?\",\"views_staticpage_faq_0016\":\"Pentru a renunta la o comanda te rugam sa ne scrii pe adresa \u003ca href=\\\"mailto:contact@vivre.eu\\\"\u003econtact@vivre.eu\u003c/a\u003e.\",\"views_staticpage_faq_0017\":\"Cum pot returna un produs?\",\"views_staticpage_faq_0018\":\"Poti returna orice produs in termen de14 de zile de la data livrarii coletului. Acceseaza pagina \\\"Comenzile mele\\\", sectiunea \\\"Retur\\\", si urmeaza instructiunile. Un curier va prelua produsele in cel mai scurt timp.\u003cbr/\u003e\u003cbr/\u003eCosturile de retur sunt suportate integral de Vivre, iar contravaloarea produselor va fi virata in contul bancar specificat de tine in maximum 14 zile.\u003cbr/\u003e\u003cbr/\u003eIn cazul in care nu ai completat formularul de retur, trebuie sa te asiguri ca produsele sunt livrate la adresa Soseaua Giurgiului, nr 321, cod postal 040667 si totodata sa trimiti datele de identificare ale returului printr-un email la contact@vivre.eu.\",\"views_staticpage_faq_0019\":\"Am alte intrebari, cum pot sa aflu raspunsurile?\",\"views_staticpage_faq_0020\":\"Pentru orice nelamurire te rugam sa ne contactezi pe \u003ca href=\\\"mailto:contact@vivre.eu\\\"\u003econtact@vivre.eu\u003c/a\u003e\",\"views_staticpage_new_faq_003\":\"Cum se calculeaza pretul final al unei comenzi?\",\"views_staticpage_new_faq_0004\":\"Valoarea comenzii este suma dintre pretul produselor si costul transportului. Daca ai optat pentru plata la livrare se percepe o taxa suplimentara.\",\"views_staticpage_new_faq_0005\":\"Cum se face plata?\",\"views_staticpage_new_faq_0006\":\"Poti plati la livrare (cash sau POS, in lei), online cu cardul (prin intermediul PayU), plata prin ordin de plata. \u003cbr/\u003e\u003cbr/\u003ePlata la livrare este insotita de o taxa suplimentara, iar daca alegi ordinul de plata, ai la dispozitie 48 de ore de la plasarea comenzii pentru efectuarea platii, iar noi avem nevoie de confirmarea acesteia pe email la adresa contact@vivre.eu.\",\"views_staticpage_new_faq_0007\":\"Cand si cum se face livrarea?\",\"views_staticpage_new_faq_0008\":\"Perioada de livrare a produselor difera in functie de disponibilitatea acestora si este precizata pe pagina aferenta fiecarui produs. Livrarea se face prin firma de curierat in intervalul specificat la plasarea comenzii, acesta fiind influentat de produsul cu cea mai indelungata perioada de livrare.\",\"views_staticpage_new_faq_0009\":\"In cat timp se livreaza coletul dupa expedierea din depozitul Vivre?\",\"views_staticpage_new_faq_0010\":\"In momentul in care coletul a fost expediat din depozitul Vivre vei primi un email de instiintare, iar in decurs de cateva zile vei fi contactat de curier (telefon/SMS) pentru livrarea coletului.\",\"views_staticpage_new_faq_0011\":\"Pot sa cumpar si sa primesc factura si chitanta pe firma?\",\"views_staticpage_new_faq_0012\":\"Da. Tot ce trebuie sa faci este sa alegi optiunea 'Da' la intrebarea 'Doresti factura pe firma?' inainte de plasarea comenzii. Daca doresti chitanta pe firma, specifica acest lucru curierului care livreaza comanda in momentul emiterii chitantei.\",\"views_staticpage_new_faq_0013\":\"\",\"views_staticpage_new_faq_0014\":\"\",\"views_staticpage_new_faq_0015\":\"\",\"views_staticpage_new_faq_0016\":\"\",\"views_staticpage_new_faq_0017\":\"\",\"views_staticpage_new_faq_0018\":\"\",\"views_staticpage_new_faq_0019\":\"Cum pot renunta la o comanda?\",\"views_staticpage_new_faq_0020\":\"Poti anula comanda direct din contul tau apasand butonul 'Anuleaza comanda', atata timp cat produsele inca se afla in depozitul Vivre. O alta modalitate de a renunta la comanda este sa ne scrii la adresa contact@vivre.eu precizand numarul comenzii.\",\"views_staticpage_new_faq_0021\":\"Cum pot anula un produs din comanda mea?\",\"views_staticpage_new_faq_0022\":\"Pentru anularea unui produs dintr-o comanda este necesar sa trimiti un email pe adresa contact@vivre.eu cu numarul comenzii, denumirea produsului si cantitatea pe care doresti sa o elimini din comanda. Produsul se poate anula atata timp cat acesta inca se afla in depozitul Vivre.\",\"views_staticpage_new_faq_0023\":\"Cum pot returna un produs?\",\"views_staticpage_new_faq_0024\":\"Poti returna orice produs in termen de 14 de zile de la data livrarii coletului. Returul este gratuit (trasportul este platit de Vivre) si se efectueaza prin curier, completand formularul de retur.\u003cbr/\u003e\u003cbr/\u003ePentru a initia un retur te rugam sa accesezi sectiunea \\\"Retur\\\" aflata in partea de sus, sub link-ul \\\"Comenzile mele\\\"  din cadrul contului de utilizator. Link-ul se afiseaza numai daca esti logat.\u003cbr/\u003e\u003cbr/\u003eContravaloarea produselor returnate va fi virata in contul bancar specificat, in termen de 14 zile. In cazul in care nu ai completat formularul de retur, trebuie sa te asiguri ca produsele sunt livrate la adresa Soseaua Giurgiului, nr 321, cod postal 040667 si totodata sa trimiti datele de identificare ale returului printr-un email la contact@vivre.eu.\",\"views_staticpage_new_faq_0025\":\"In cat timp primesc banii inapoi de la retur?\",\"views_staticpage_new_faq_0026\":\"Suma aferenta returului se va rambursa in termen de maximum 14 zile de la data la care am fost informati cu privire la returnarea produselor.\",\"views_staticpage_new_faq_0027\":\"Pot schimba un produs din comanda plasata cu altul?\",\"views_staticpage_new_faq_0028\":\"O comanda deja plasata nu se poate modifica. \\nEste necesar sa anulezi comanda actuala si sa plasezi o noua comanda daca doresti un alt tip de produs, alt model sau alta culoare, dar nu inainte de a verifica stocul si disponibilitatea produsului pe site-ul Vivre.\",\"views_staticpage_new_faq_0029\":\"Pot adauga mai multe produse in comanda existenta?\",\"views_staticpage_new_faq_0030\":\"La o comanda deja plasata nu se mai pot adauga alte produse. Este necesar sa plasezi o noua comanda pe site, iar daca termenul de livrare corespunde (ultimul termen este identic sau la o zi diferenta) atunci le putem cumula.\",\"views_staticpage_new_faq_0031\":\"Cum procedez in cazul in care am primit un produs deteriorat?\",\"views_staticpage_new_faq_0032\":\"In cazul in care ai primit un produs deteriorat te rugam sa ne trimiteti un email pe adresa contact@vivre.eu cu poze care demonstreaza gradul de deteriorare. Solicitarea va fi preluata de echipa Vivre.\",\"views_staticpage_new_faq_0033\":\"Cum pot modifica datele de livrare?\",\"views_staticpage_new_faq_0034\":\"Pentru modificarea adresei de livrare sau a numarului de telefon este necesar sa ne trimiti un email pe adresa contact@vivre.eu cu numarul comenzii si noile date de livrare.\",\"views_staticpage_new_faq_0035\":\"Am uitat parola, ce pot sa fac?\",\"views_staticpage_new_faq_0036\":\"Click pe link-ul ‘Login’ si ‘Ai uitat parola?’ sau acceseaza adresa \u003ca class=\\\"js-show-password\\\" href=\\\"#\\\"\u003ehttps://www.vivre.ro/?forgotPassword=true\u003c/a\u003e si introdu email-ul cu care te-ai inregistrat. O noua parola va fi generata de catre sistem si trimisa pe adresa de email specificata.\",\"views_staticpage_new_faq_0037\":\"Unde pot gasi documentele aferente comenzii?\",\"views_staticpage_new_faq_0038\":\"Factura fiscala precum si alte documente aferente comenzii (garantie, instructiuni de folosire și descrierea produselor, declaratii de conformitate) se pot descarca din contul de client Vivre. Intra pe pagina \\\"Comenzile mele\\\" din sectiunea ‘Contul meu’, click pe link-ul ‘Detalii’ de la fiecare comanda si vei gasi link-urile aferente documentelor respective.\",\"views_staticpage_new_faq_0039\":\"Cand pot gasi pe site un produs care in prezent are stoc epuizat?\",\"views_staticpage_new_faq_0040\":\"Ofertele sunt limitate in timp, insa incercam readucerea pe site a produselor in functie de disponibilitatea furnizorului. Pentru a verifica un anumit produs poti accesa sectiunea de cautare.\",\"views_staticpage_new_faq_0041\":\"\",\"views_staticpage_new_faq_0042\":\"\",\"views_staticpage_new_faq_0043\":\"Pot returna mai multe produse in acelasi colet ?\",\"views_staticpage_new_faq_0044\":\"Da, poti returna mai multe produse din aceeasi comanda sau din comenzi diferite, accesand link-ul \\\"Retur\\\" din contul tau. Dupa selectarea produselor si completarea integrala a formularului, curierul va ridica produsele returnabile (conform perioadei de retur maximum 14 zile) din una sau mai multe comenzi.\",\"views_staticpage_new_faq_0046\":\"\",\"views_staticpage_new_faq_0045\":\"\",\"contact_cards_orders_title\":\"Comenzi\",\"contact_cards_orders_text\":\"Află cum să plasezi o comandă, să o modifici sau anulezi, să urmărești statusul livrării, să contactezi vânzătorul și alte informații utile legate de achizițiile tale.\",\"contact_cards_orders_cta\":\"Contactează vânzătorul\",\"contact_cards_returns_title\":\"Retur\",\"contact_cards_returns_text\":\"Descoperă cum să inițiezi un retur, care sunt condițiile și termenele de returnare, și cum să obții rambursarea banilor.\",\"contact_cards_returns_cta\":\"Vreau să fac un retur\",\"contact_cards_products_title\":\"Produse\",\"contact_cards_products_text\":\"Află detalii despre disponibilitatea produselor, schimbul acestora, informații despre garanții și produse similare, precum și ce este RRP-ul.\",\"contact_cards_payments_title\":\"Plăți\",\"contact_cards_payments_text\":\"Află informații detaliate despre metodele de plată acceptate, securitatea plăților și cum să accesezi și să descarci facturile pe persoană fizică sau juridică.\",\"contact_cards_account_title\":\"Contul meu\",\"contact_cards_account_text\":\"Află cum să îți creezi un cont, să îți actualizezi informațiile personale, să resetezi parola și să gestionezi preferințele de comunicare și setările de securitate.\",\"contact_cards_experience_title\":\"Experiența Vivre\",\"contact_cards_experience_text\":\"Află despre newsletterul Vivre, colecțiile atent alese, importanța adăugării profilului casei și alte noutăți despre Vivre.\",\"contact_cards_experience_cta\":\"Adaugă profilul casei\",\"contact_cards_faq_url\":\"https://ro.vivre.eu/info/faq\",\"rights_form_title\":\"Trimite o cerere legata de drepturile tale conform GDPR\",\"rights_form_intro\":\"Daca doresti sa iti exerciti oricare din drepturile tale garantate de Regulamentul European pentru Protectia Datelor Personale te invitam sa ne trimiti o solicitare prin formularul de mai jos. Cererea ta va ajunge direct la Responsabilul cu Protectia Datelor (DPO) al Vivre.\",\"rights_form_a0\":\"alege o optiune\",\"rights_form_q1\":\"Esti o persoana fizica sau o juridica?\",\"rights_form_q1a1\":\"sunt o persoana fizica\",\"rights_form_q1a2\":\"sunt o persoana juridica\",\"rights_form_q2\":\"Cum te numesti?\",\"rights_form_q3\":\"Ce drept doresti sa iti exerciti?\",\"rights_form_q3a1\":\"vreau ca Vivre sa imi stearga datele personale\",\"rights_form_q3a2\":\"vreau ca Vivre sa imi transfere o copie a datelor mele personale\",\"rights_form_q3a3\":\"vreau sa stiu cum foloseste Vivre datele mele personale\",\"rights_form_q3a4\":\"vreau sa rectific informatii din dale personale pe care Vivre le are despre mine\",\"rights_form_q4\":\"Alte detalii despre cererea ta:\",\"gdpr_never\":\"\",\"gdpr_daily\":\"\",\"gdpr_weekly\":\"\",\"gdpr_unsubscribed\":\"dezabonat\",\"gdpr_subscribed\":\"abonat\",\"gdpr_prefs_subscribe_text\":\"Mai jos poți modifica modul în care primești „{pref_type}”. În acest moment, statusul tău este:\",\"gdpr_perms_cookies\":\"Folosirea de cookie-uri\",\"gdpr_perms_mk_email\":\"Folosirea email-ului pentru comunicare comerciala\",\"gdpr_perms_prefs\":\"Preferintele mele\",\"ggdpr_perms_cookie_settings\":\"\",\"gdpr_perms_cookie_settings\":\"Modifica setarile cookies\",\"gdpr_perms_cookies_measurement\":\"Folosire cookies tracking\",\"gdpr_perms_cookies_advanced\":\"Folosire cookies avansate\",\"gdpr_perms_stock_remainder_email\":\"Alerta stoc\",\"gdpr_perms_sms_notification\":\"Inscrie-ma la notificari pe sms\",\"gdpr_perms_legal_age\":\"Am peste 18 ani\",\"gdpr_perms_gtc_accept\":\"Accepta \u003ca href=\\\"{LINK}\\\" target=\\\"_blank\\\"\u003etermenii si conditiile\u003c/a\u003e\",\"gdpr_perms_electronic_papers\":\"Documente in format electronic\",\"gdpr_perms_export\":\"Export\",\"gdpr_perms_export_request\":\"Solicita exportul datelor\",\"gdpr_perms_export_requested\":\"Exportul datelor a fost solicitat!\",\"gdpr_perms_delete\":\"Sterge Cont\",\"gdpr_perms_delete_request\":\"Solicita stergerea contului\",\"gdpr_perms_delete_requested\":\"Stergerea contului a fost solicitata!\",\"gdpr_perms_delete_confirm\":\"Are you sure you want to delete your account?\",\"gdpr_perms_favorites_subscribe\":\"Alerta favorite la pret redus\",\"gdpr_perms_cart_expired_lower_price\":\"Alerta pret redus produse adaugate in cos\",\"gdpr_perms_nl_subscribe\":\"Newsletter Vivre\",\"cookies_notification\":\"In conformitate cu Noul Regulament al Uniunii Europene cu privire la Protectia Datelor Personale (GDPR), te rugam sa ne dai acordul pentru utilizarea fisierelor de tip cookie in urmatoarele scopuri: functionarea corecta a platformei, masurarea utilizarii platformei, functionalitati avansate precum produse recomandate si alte tipuri de functionalitati care sa ne permita sa iti aratam cele mai potrivite oferte prin diferite canale de marketing.\",\"cookies_notification_message\":\"Acest site utilizează cookie-uri.\",\"cookies_notification_platform\":\"Cookie-urile sunt necesare pentru functionarea corecta a platformei astfel incat sa putem salva produsele in cosul tau si apoi sa putem finaliza o comanda. De asemenea ele ne ajuta sa stim cand esti autentificat si alte setari pe care le-ai facut anterior.\",\"cookies_notification_measuring\":\"Prin masurarea utilizarii platformei cu ajutorul cookie-urilor putem optimiza experienta ta imbunatatind in permanenta functionalitatile si gradul de interactivitate.\",\"cookies_notification_advanced\":\"Cookie-urile ne ajuta sa iti oferim functionalitati avansate, cum ar fi recomandari precise de produse in functie de pret si categorii de interes pentru tine.\",\"cookies_notification_mk\":\"In final, cookie-urile ne ajuta sa iti afisam oferte si discounturi relevante pentru tine din domeniul nostru de activitate prin partenerii nostri.\",\"cookies_notification_more_details\":\"Click aici pentru mai multe detalii.\",\"landing_step2_heading\":\"Avem nevoie de acordul tau\",\"landing_step2_intro\":\"Conform legislatiei Europene pentru protectia datelor personale este necesar sa ne confirmi ca esti de acord sa iti trimitem pe email campaniile si ofertele speciale Vivre si informatii despre comanda si contul tau.\",\"landing_step3_heading\":\"Peste 3 milioane de utilizatori din intreaga lume au incredere in Vivre\",\"landing_step3_intro\":\"Ne angajam sa protejam datele tale dupa cele mai inalte standarde si sa nu le folosim in alte scopuri in afara celor pentru care ne-ai oferit in mod expres acordul tau.\",\"landing_step4_heading\":\"Contul tau nu a fost inregistrat\",\"landing_consent\":\"Prin inregistrarea acestui cont confirm ca am peste 18 ani. Imi exprim acordul ca Vivre SA sa imi foloseasca emailul si alte date personale in scopuri de comunicare comerciala si comunicare legata de starea comenzilor mele. Detalii despre colectarea si folosirea datelor personale gasesti in \u003cbr/\u003e\u003ca href=\\\"#\\\" class=\\\"js-open-modal\\\" rel=\\\"nofollow\\\"\u003epolitica de confidentialitate\u003c/a\u003e\",\"landing_yes\":\"Accept\",\"landing_no\":\"Nu accept\",\"landing_maybe\":\"mai multe detalii\",\"landing_restart\":\"Incearca din nou\",\"landing_tandc\":\"Termeni si conditii\",\"register_user_nl_signup\":\"Aboneaza-te la newsletterul nostru\",\"register_user_nl_subscribe_signup\":\"Doresc sa ma abonez la Newsletter.\",\"export_template_title\":\"Vivre GDPR export\",\"export_index_title\":\"Informatiile tale\",\"export_class_index\":\"Informatiile tale\",\"export_class_profile\":\"Profil\",\"export_class_profile_description\":\"Informatii despre profilul tau\",\"export_class_addresses\":\"Adrese de livrare\",\"export_class_addresses_description\":\"Lista adreselor de livrare din contul tau\",\"expor
