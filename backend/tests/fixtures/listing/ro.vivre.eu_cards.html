<script>self.__next_f.push([1,"\u003cp\u003ePrezenta Politică de confidențialitate descrie modul în care gestionăm datele cu caracter personal aferente comenzilor plasate pentru produsele comercializate de noi prin platforma Vivre.\u003c/p\u003e\n\u003cp\u003ePrin „date cu caracter personal” înțelegem orice informație care permite identificarea directă sau indirectă a unei persoane fizice, precum numele, adresa, numărul de telefon sau adresa de e-mail.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eColectarea și utilizarea datelor\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eDatele personale sunt prelucrate exclusiv în scopul procesării comenzilor, livrării produselor, gestionării retururilor și comunicării privind statusul comenzii.\u003c/p\u003e\n\u003cp\u003eDatele pot include:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enumele și prenumele;\u003c/li\u003e\n\u003cli\u003eadresa de livrare;\u003c/li\u003e\n\u003cli\u003eadresa de facturare;\u003c/li\u003e\n\u003cli\u003enumărul de telefon;\u003c/li\u003e\n\u003cli\u003ealte informații necesare executării contractului.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePlățile sunt procesate prin intermediul furnizorilor de servicii de plată securizate integrați în platforma Vivre. Nu avem acces și nu stocăm datele cardurilor bancare.\u003c/p\u003e\n\u003cp\u003eDatele pot fi transmise către parteneri implicați în executarea comenzii (ex. firme de curierat) sau în cazurile prevăzute de lege. Nu vindem și nu distribuim datele personale către terți în alte scopuri.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDrepturile dumneavoastră\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eBeneficiați de drepturile prevăzute de legislația aplicabilă privind protecția datelor, inclusiv dreptul de acces, rectificare sau ștergere a datelor, în condițiile legii. Pentru exercitarea acestor drepturi ne puteți contacta la adresa de e-mail indicată în pagina noastră de profil sau prin intermediul platformei Vivre.\u003c/p\u003e\n\u003cp\u003eNe rezervăm dreptul de a actualiza periodic această politică, în conformitate cu modificările legislative sau operaționale.\u003c/p\u003e"])</script>

<script>self.__next_f.push([1,"\u003cp\u003eProdusele comercializate de noi prin platforma Vivre sunt vândute în baza unui contract la distanță, conform legislației aplicabile.\u003c/p\u003e\n\u003cp\u003eDacă sunteți persoană fizică (consumator), aveți dreptul de a vă retrage din contract în termen de 14 zile calendaristice de la primirea produsului, fără a fi necesară indicarea unui motiv.\u003c/p\u003e\n\u003cp\u003ePentru inițierea returului este necesară completarea formularului de retur disponibil în contul de client Vivre, secțiunea „Retururi”. După transmiterea solicitării, vom organiza procesul de preluare prin curier.\u003c/p\u003e\n\u003cp\u003eÎn cazul exercitării dreptului legal de retragere în termen de 14 zile calendaristice, costul direct al returnării produselor este de \u003cstrong\u003e{return_fee} {currency}\u003c/strong\u003e și este suportat de client.\u003c/p\u003e\n\u003cp\u003eCostul nu se aplică în situația în care produsul este deteriorat la livrare, defect sau neconform, caz în care returnarea se realizează fără costuri pentru client.\u003c/p\u003e\n\u003cp\u003eProdusele trebuie returnate în aceeași stare în care au fost livrate, cu ambalaj adecvat pentru transport și fără urme de utilizare excesivă. Manipularea este permisă doar în măsura necesară verificării caracteristicilor produsului.\u003c/p\u003e\n\u003cp\u003eÎn cazul în care produsul returnat prezintă urme de utilizare sau deteriorări, ne rezervăm dreptul de a reduce suma rambursată proporțional cu diminuarea valorii constatate.\u003c/p\u003e\n\u003cp\u003eRambursarea sumelor se va efectua în termen de maximum 14 zile de la recepționarea și verificarea produsului returnat. Rambursarea se face prin aceeași metodă de plată utilizată la achiziție, cu excepția cazului în care se convine altfel.\u003c/p\u003e\n\u003cp\u003eAnumite categorii de produse nu pot fi returnate, conform legii (ex.: produse personalizate, produse sigilate desigilate din motive de igienă, produse perisabile etc.).\u003c/p\u003e\n\u003cp\u003eProdusele beneficiază de garanția legală de conformitate de 2 ani de la livrare, dacă nu este specificat alt termen. În caz de neconformitate, aveți dreptul la reparare, înlocuire sau rambursare, conform legislației aplicabile.\u003c/p\u003e\n\u003cp\u003eÎn cazul achizițiilor realizate de persoane juridice, dreptul legal de retragere nu se aplică.\u003c/p\u003e"])</script>

<script>self.__next_f.push([1,"\u003cdiv\u003e\n            \u003ch2\u003eREGULAMENTUL CAMPANIEI\u003c/h2\u003e\n            \u003ch2\u003e7 ani acasa\u003c/h2\u003e\n \u003c/div\u003e\n\n\u003cdiv\u003e\n            \u003cp\u003e\n                1. DENUMIRE. DURATA\n                \u003cbr /\u003e\n                1.1. Prezentul regulament („Regulamentul”) se aplica pentru Campania organizata de societatea VIVRE HOMES S.R.L., cu sediul in Romania, Bucuresti, Calea Șerban Vodă 286, Bl. 3A, Et. 6, Ap. 27, Sect. 4, Cod postal 040222, J2021015306408, CUI RO44853220 si stabileste regulile de participare.\n                \u003cbr /\u003e\n                1.2.Campania se desfasoara in perioada 07.05.2019, ora 08:00 pana la ora 00:20, pentru cumparaturi online pe site-ul \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e, in limita stocului disponibil, pe teritoriul Romaniei.\n                \u003cbr /\u003e\n                1.3. Regulamentul va fi publicat începând cu data începerii Campaniei pe site-ul \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e.\n            \u003c/p\u003e\n\n            \u003cp\u003e\n                2. CONTINUTUL CAMPANIEI\n                \u003cbr /\u003e\n                2.1. Face obiectul Campaniei orice comanda finalizata online pe www.vivre.ro in valoare de minimum 400 Lei, pe durata anuntata a Campaniei, la care se poate aplica un voucher  general de 15%  prin introducerea codului: BDAY15 si un voucher de 20% exclusiv pentru clientii premium, prin introducerea codului: BDAY20.  Voucherele pot fi utilizate o singura data de catre fiecare utilizator, astfel incat in cazul comenzilor duble (livrare rapida + standard), reducerea se va aplica doar uneia dintre cele doua.\n\n\n                \u003cbr /\u003e\n                2.2. Reducerile din Campanie se pot cumula cu alte beneficii acordate clientilor VIVRE la achizitia produselor din magazinul online. De asemenea, la achizitionarea produselor din Campanie se poate utiliza voucherul cadou in valoare de 25 de RON la inregistrare pe site-ul \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e.\n            \u003c/p\u003e\n\n            \u003cp\u003e\n                3. MODIFICARE REGULAMENT. INTRERUPERE SAU PRELUNGIRE CAMPANIE\n                \u003cbr /\u003e\n                3.1. VIVRE HOMES S.R.L. isi rezerva dreptul de a modifica oricand acest Regulament, informand participantii prin afisarea modificarilor pe site-ul \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e. \n                \u003cbr /\u003e\n                3.2. VIVRE HOMES S.R.L. isi rezerva dreptul de a suspenda sau de a intrerupe Campania oricand pe parcursul desfasurarii acesteia si de a o prelungi, informand participantii privind orice suspendare, intrerupere sau prelungire prin afisarea pe site-ul \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e. \n                \u003cbr /\u003e\n                3.3. Modificarile intervenite privind regulile sau valabilitatea Campaniei nu vor afecta comenzile deja plasate, dar inca nefinalizate la momentul intervenirii modificarii.\n            \u003c/p\u003e\n\n            \u003cp\u003e\n                4. DISPOZITII FINALE\n                \u003cbr /\u003e\n                4.1. Regulamentul Campaniei este afisat si disponibil pe site-ul \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e pe toata perioada de desfasurare. \n                \u003cbr /\u003e\n                4.2. Prin participarea la aceasta Campanie, participantii declara ca sunt de acord sa respecte si sa se conformeze tuturor regulilor din prezentul Regulament. \n                \u003cbr /\u003e\n                4.3. Regulamentul Campaniei se completeaza cu Termenii si Conditiile, Politica de Confidentialitate si Politica de utilizare Cookie-uri disponibile pe site-ul \u003ca class=\"js-navigate\" href=\"/legal\"\u003ewww.vivre.ro/legal\u003c/a\u003e.\n                \u003cbr /\u003e\n                4.4. Eventualele dispute aparute intre VIVRE HOMES S.R.L. si participantii la Campanie se vor rezolva pe cale amiabila. In cazul in care aceasta nu va fi posibila, conflictele vor fi solutionate de catre instanta competenta, conform prevederilor legale aplicabile. \n                \u003cbr /\u003e\n                4.5. VIVRE HOMES S.R.L. este indreptatita sa ia toate masurile necesare in caz de tentative de frauda a sistemului, abuz sau orice alte tentative care ar putea afecta imaginea acestei Campanii sau a site-ului \u003ca class=\"js-navigate\" href=\"/\"\u003ewww.vivre.ro\u003c/a\u003e.\n                \u003cbr /\u003e\n                4.6. Pentru orice informatii sau sesizari avand ca obiect Campania, orice persoana interesata poate contacta societatea VIVRE HOMES S.R.L., de Luni pana Vineri, program 09:00-18:00, sau prin e-mail la \u003ca href=\"mailto:contact@vivre.eu\"\u003econtact@vivre.eu\u003c/a\u003e.\n            \u003c/p\u003e\n        \u003c/div\u003e"])</script>

<script>self.__next_f.push([1,"\u003ch2\u003eTermeni și condiții Vivre\u003c/h2\u003e\n\n\u003ch3\u003e1. Definitii\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003eVivre Homes\u003c/strong\u003e – Societatea VIVRE HOMES S.R.L., cu sediul in Romania, Bucuresti, Bld. Tudor Vladimirescu, nr. 22, biroul 1, et. 11, Sector 5, Cod postal 050883, J2021015306408, CUI RO44853220, organizata in baza legii romane, in calitate de operator al platformei online Vivre si furnizor de servicii ale societatii informationale.\u003cbr\u003e\n    \u003cstrong\u003eSITE\u003c/strong\u003e – Domeniu vivre.eu si subdomeniile acestuia.\u003cbr\u003e\n    \u003cstrong\u003eCONTINUT\u003c/strong\u003e are urmatoarea definitie:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003etoate informatiile de pe SITE care pot fi vizitate, vizualizate sau altfel accesate prin utilizarea unui echipament numeric;\u003c/li\u003e\n    \u003cli\u003econtinutul oricarui e-mail trimis UTILIZATORILOR sau CLIENTILOR sai de catre Vivre Homes prin mijloace electronice si/sau orice alt mijloc de comunicare disponibil;\u003c/li\u003e\n    \u003cli\u003eorice informatie comunicata prin orice mijloc de catre un angajat sau colaborator al Vivre Homes UTILIZATORULUI sau CLIENTULUI, conform informatiilor de contactare, specificate sau nu de catre acesta;\u003c/li\u003e\n    \u003cli\u003einformatii legate de produsele, serviciile si/sau tarifele practicate de catre Vanzatori (Parteneri Marketplace) intr-o anumita perioada;\u003c/li\u003e\n    \u003cli\u003einformatii legate de produsele, serviciile si/sau tarifele practicate de catre un tert cu care Vivre Homes are incheiate contracte de parteneriat, intr-o anumita perioada;\u003c/li\u003e\n    \u003cli\u003edate referitoare la Vivre Homes sau alte date privilegiate ale acesteia.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003eSERVICIU\u003c/strong\u003e – Serviciul de comert electronic condus exclusiv pe portiunile public disponibile ale SITE-ului, in sensul acordarii posibilitatii CLIENTULUI sa contracteze produse si/sau servicii folosind mijloace exclusiv electronice, incluzand serviciile de intermediere specifice platformei marketplace, precum si alte servicii digitale puse la dispozitie de Vivre Homes.\u003cbr\u003e\n    \u003cstrong\u003eMEMBRU\u003c/strong\u003e – Persoana fizica care are sau obtine acces la CONTINUT, prin orice mijloc de comunicare (electronic, telefonic etc.) sau in baza unui acord de utilizare intre Vivre Homes si acesta si care necesita crearea si utilizarea unui CONT.\u003cbr\u003e\n    \u003cstrong\u003eCLIENT\u003c/strong\u003e – Persoana care are sau obtine acces la CONTINUT si SERVICIU, ulterior crearii CONTULUI de MEMBRU sau prin utilizarea optiunilor disponibile pe Site.\u003cbr\u003e\n    \u003cstrong\u003eVANZATOR / SELLER / PARTENER MARKETPLACE\u003c/strong\u003e – Persoana juridica sau persoana fizica autorizata care comercializeaza produse prin intermediul platformei Vivre, in baza unui contract incheiat cu Vivre Homes, si care este parte in Contractul de Vanzare-Cumparare incheiat cu Clientul.\u003cbr\u003e\n    \u003cstrong\u003eMESTER PARTENER\u003c/strong\u003e – Persoana fizica autorizata, intreprindere individuala sau persoana juridica ce furnizeaza servicii pentru locuinta prin intermediul platformei Vivre Services, in baza unei relatii contractuale cu Vivre Homes. \u003cbr\u003e\n    \u003cstrong\u003eVIVRE SERVICES\u003c/strong\u003e – Serviciu digital de intermediere pus la dispozitie de Vivre Homes prin intermediul platformei Vivre, care faciliteaza conectarea dintre Clienti si Mesteri Parteneri in vederea solicitarii si furnizarii de servicii pentru locuinta. \u003cbr\u003e\n    \u003cstrong\u003eCOMANDA\u003c/strong\u003e – Un document electronic ce intervine ca forma de comunicare intre Vanzator si Cumparator prin care Cumparatorul transmite Vanzatorului, prin intermediul Site-ului, intentia sa de a achizitiona Bunuri si Servicii de pe Site.\u003cbr\u003e\n    \u003cstrong\u003eDOCUMENT\u003c/strong\u003e – Prezentele Termeni si Conditii.\u003cbr\u003e\n    \u003cstrong\u003eCOMUNICARI COMERCIALE\u003c/strong\u003e – Orice tip de mesaj trimis (cum ar fi: e-mail / SMS / Viber / telefonic / mobile push / webpush etc.) continand informatii generale si tematice, informatii cu privire la produse similare sau complementare cu cele pe care le-ati achizitionat/vizualizat, informatii cu privire la oferte sau promotii, informatii referitoare la Bunuri si Servicii adaugate in sectiunea “Cont/Cosul meu”, precum si alte comunicari comerciale, cum ar fi cercetari de piata si/sau sondaje de opinie.\u003cbr\u003e\n    \u003cstrong\u003eCONTRACT la distanta\u003c/strong\u003e – Conform definitiei cuprinse in OUG 34 din 4 iunie 2014 privind drepturile consumatorilor in cadrul contractelor incheiate cu profesionistii, precum si pentru modificarea si completarea unor acte normative art. 2 punctul 7, astfel cum aceasta a transpus Directiva 2011/83/UE privind drepturile consumatorilor: orice contract incheiat intre profesionist si consumator in cadrul unui sistem de vanzari sau de prestare de servicii la distanta organizat, fara prezenta fizica simultana a profesionistului si a consumatorului, cu utilizarea exclusiva a unuia sau a mai multor mijloace de comunicare la distanta, pana la si inclusiv in momentul in care este incheiat contractul.\u003cbr\u003e\n    \u003cstrong\u003eCONTRACT DE UTILIZARE A SERVICIILOR\u003c/strong\u003e – Contractul incheiat la distanta intre Client sau Utilizator si Vivre Homes, avand ca obiect accesul la Site, crearea si utilizarea Contului, precum si utilizarea serviciilor si functionalitatilor oferite de Platforma.\u003cbr\u003e\n    \u003cstrong\u003eCONTRACT DE VANZARE-CUMPARARE\u003c/strong\u003e – Contractul incheiat la distanta intre Client si Vanzator, prin intermediul Platformei, avand ca obiect vanzarea produselor, transferul dreptului de proprietate, livrarea, facturarea, garantia legala si retururile, conform legislatiei aplicabile.\u003cbr\u003e\n    \u003cstrong\u003eDATE CU CARACTER PERSONAL\u003c/strong\u003e – Orice informatie privind o persoana fizica identificata sau identificabila (“persoana vizata”).\u003cbr\u003e\n    \u003cstrong\u003eOPERATOR DE DATE CU CARACTER PERSONAL\u003c/strong\u003e – Persoana fizica sau juridica, autoritatea publica, agentia sau alt organism care, singur sau impreuna cu altele, stabileste scopurile si mijloacele de prelucrare a datelor cu caracter personal.\u003cbr\u003e\n    \u003cstrong\u003eCONSIMTAMANT\u003c/strong\u003e – Orice manifestare de vointa libera, specifica, informata si lipsita de ambiguitate a persoanei vizate.\u003cbr\u003e\n    \u003cstrong\u003ePRELUCRARE\u003c/strong\u003e – Orice operatiune sau set de operatiuni efectuate asupra datelor cu caracter personal.\u003cbr\u003e\n    \u003cstrong\u003eNEWSLETTER / ALERTA\u003c/strong\u003e – Mijlocul de informare periodic, exclusiv electronic, asupra produselor, serviciilor si/sau promotiilor desfasurate de catre Vivre Homes intr-o anumita perioada.\u003cbr\u003e\n    \u003cstrong\u003eTRANZACTIE\u003c/strong\u003e – Incasare sau rambursare a unei sume rezultata din vanzarea unui produs de catre un Vanzator catre Client sau din furnizarea de servicii de catre Vivre Homes, prin utilizarea serviciilor procesatorului de plati agreat sau prin transfer bancar.\n\u003c/p\u003e\n\n\u003ch3\u003e2. General\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e2.1.\u003c/strong\u003e Documentul stabileste termenii si conditiile de utilizare ai Site-ului, Continutului si Serviciului de catre Membru sau Client, constituind Contractul de Utilizare a Serviciilor incheiat intre acestia si Vivre Homes. In ceea ce priveste achizitia de produse, prezentul Document completeaza Contractul de Vanzare-Cumparare incheiat direct intre Client si Vanzator. Va rugam sa parcurgeti cu atentie acest document pentru a preintampina eventuale consecinte nedorite sau neplacute.\u003cbr\u003e\n    \u003cstrong\u003e2.2.\u003c/strong\u003e Furnizarea serviciilor Platformei va incepe imediat dupa indeplinirea tuturor formalitatilor de inregistrare cerute. Optand pentru inregistrare, Membrul sau Clientul se obliga sa furnizeze corect numele, adresa si alte informatii necesare. Pentru corectarea sau actualizarea acestora, accesati meniul „Date personale” din cadrul aplicatiei „Contul meu”. Prin accesarea contului si utilizarea parolei personale sunteti responsabil pentru toate actiunile care decurg din folosirea acesteia.\u003cbr\u003e\n    \u003cstrong\u003e2.3.\u003c/strong\u003e Folosirea, inclusiv accesarea, vizitarea si vizualizarea Continutului sau Serviciului implica acceptarea prezentelor Termeni si Conditii. In cazul unor neintelegeri, se aplica termenii valabili la momentul plasarii Comenzii.\u003cbr\u003e\n    \u003cstrong\u003e2.4.\u003c/strong\u003e Accesul la Serviciu se face exclusiv prin accesarea Site-ului public disponibil ro.vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e2.5.\u003c/strong\u003e Prin folosirea Site-ului, Membrul sau Clientul este singurul responsabil pentru toate activitatile care decurg din utilizarea acestuia si pentru orice daune produse Site-ului, Continutului, Serviciului sau tertilor, conform legislatiei romane in vigoare.\u003cbr\u003e\n    \u003cstrong\u003e2.6.\u003c/strong\u003e In cazul in care Utilizatorul sau Clientul nu este de acord cu prezentul Document, acesta poate transmite o solicitare la adresa contact@vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e2.6.1.\u003c/strong\u003e Utilizatorul sau Clientul isi poate retrage oricand consimtamantul exprimat, renuntand la utilizarea Serviciului, prin transmiterea unei solicitari la adresa dpo@vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e2.6.2.\u003c/strong\u003e Utilizatorul sau Clientul se poate dezabona de la comunicari comerciale prin optiunea de dezabonare sau prin solicitare scrisa la dpo@vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e2.6.3.\u003c/strong\u003e Utilizatorul sau Clientul are dreptul de a solicita stergerea datelor personale prelucrate, conform legislatiei aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e2.6.4.\u003c/strong\u003e Utilizatorul sau Clientul poate reveni asupra deciziei sale, exprimandu-si acceptul pentru Documentul disponibil la acel moment.\u003cbr\u003e\n    \u003cstrong\u003e2.7.\u003c/strong\u003e In cazul in care Clientul isi revoca acordul in perioada derularii unei Comenzi, Vivre Homes va anula utilizarea Serviciului fara obligatii ulterioare.\u003cbr\u003e\n    \u003cstrong\u003e2.8.\u003c/strong\u003e Site-ul este destinat exclusiv persoanelor fizice care au implinit varsta de 18 ani.\n\u003c/p\u003e\n\n\u003ch3\u003e3. Continut\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e3.1.\u003c/strong\u003e Platforma Vivre nu detine drepturi de proprietate asupra continutului paginilor postate in spatiul pus la dispozitia utilizatorilor sau Vanzatorilor (Sellerilor), nu cerceteaza continutul materialelor la momentul publicarii acestora, dar isi rezerva dreptul (nu si obligatia) pentru sine si pentru orice persoana desemnata de Vivre, de a refuza sau sterge, dupa cum crede de cuviinta, orice continut disponibil prin intermediul platformei.\u003cbr\u003e\n    \u003cstrong\u003e3.2.\u003c/strong\u003e Vivre si orice alta persoana desemnata in acest sens au dreptul de a sterge (indeparta) orice continut care incalca termenii si conditiile de utilizare sau este in alt mod incompatibil cu principiile acestei platforme. Prin urmare, sunteti de acord sa evaluati si sa suportati toate riscurile asociate cu folosirea oricarui continut, inclusiv cel legat de exactitatea, intregimea sau utilitatea unui astfel de continut.\u003cbr\u003e\n    \u003cstrong\u003e3.3.\u003c/strong\u003e Ca utilizator sunteti unic responsabil de propriile actiuni precum si de consecintele pe care acestea le pot avea, in urma publicarii materialelor pe care le incarcati sau puneti la dispozitie in mod public pe platforma Vivre si luati la cunostinta faptul ca materialele publicate vor putea fi accesate si prelucrate de catre terti, platforma Vivre nedetinand o functie de control in acest sens.\u003cbr\u003e\n    \u003cstrong\u003e3.4.\u003c/strong\u003e Va obligati sa nu faceti urmatoarele lucruri:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003esa publicati material cu drept de autor, daca nu sunteti autorul sau daca nu aveti permisiunea autorului de a publica materialul respectiv;\u003c/li\u003e\n    \u003cli\u003esa publicati materiale obscene, defaimatoare, de amenintare, discriminatorii sau rauvoitoare fata de un alt utilizator, persoana fizica sau juridica sau fata de orice alt tert;\u003c/li\u003e\n    \u003cli\u003esa publicati date cu caracter personal (inclusiv dar nelimitat la imagini, inregistrari video, texte) fara consimtamantul expres al persoanelor vizate, respectiv in cazul minorilor, fara consimtamantul expres al parintilor sau al reprezentantilor legali ai acestora;\u003c/li\u003e\n    \u003cli\u003esa postati, difuzati sau transmiteti material (imagini, texte) pornografic, erotic sau sexual explicit, de orice fel si in orice forma, care promoveaza actele de pedofilie, incest sau bestialitate, care promoveaza ura fata de anumite grupuri de persoane din motive legate de rasa, origine etnica, religie, dizabilitati, sex, varsta, statut de veteran, identitate sau orientare sexuala. Este interzisa crearea de profile personale si publicarea de materiale referitoare la videochat, servicii de escorta, masaj erotic sau altele de acest gen;\u003c/li\u003e\n    \u003cli\u003esa publicati materiale care contin virusi, viermi sau alte programe cu intentia de a distruge orice sistem sau informatie;\u003c/li\u003e\n    \u003cli\u003esa incarcati, postati, difuzati sau transmiteti in alt mod orice continut pentru care nu aveti dreptul legal de transmitere sau difuzare, sub orice sistem juridic, romanesc sau strain, in baza unor relatii contractuale sau de incredere (cum sunt informatiile confidentiale sau cele aflate sub incidenta acordurilor de confidentialitate);\u003c/li\u003e\n    \u003cli\u003esa incarcati, postati, difuzati sau transmiteti in alt mod orice tip de publicitate, materiale promotionale, „junk mail”, „spam”, scrisori in lant, scheme piramidale sau orice alta forma de solicitari;\u003c/li\u003e\n    \u003cli\u003esa promovati sau sa furnizati informatii despre modul de derulare a activitatilor ilegale, sa promovati ranirea fizica sau verbala impotriva oricarui grup sau persoana sau sa promovati acte de cruzime fata de animale;\u003c/li\u003e\n    \u003cli\u003esa publicati materiale in scopuri concurentiale platformei sau sa folositi materialele obtinute prin intermediul platformei in scopuri concurentiale;\u003c/li\u003e\n    \u003cli\u003esa postati, difuzati sau transmiteti orice alt material care contravine, in orice fel, normelor legale in vigoare.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e3.5.\u003c/strong\u003e Vivre isi rezerva dreptul unilateral de a edita, modifica sau inlatura in totalitate ori partial orice material ce intra sub incidenta celor de mai sus. In cazul incalcarii prevederilor mentionate, Vivre isi rezerva dreptul de a inlatura materialele respective de pe platforma, precum poate restricționa sau elimina conținutul și/sau suspenda contul, inclusiv fără notificare prealabilă atunci când este necesar pentru prevenirea prejudiciilor sau respectarea obligațiilor legale; în măsura aplicabilității, utilizatorul va fi informat ulterior asupra motivelor și a opțiunilor de contestare.\u003cbr\u003e\n    \u003cstrong\u003e3.6.\u003c/strong\u003e Vivre nu garanteaza credibilitatea sau acuratetea informatiilor publicate de catre utilizatori sau Vanzatori si nu gireaza nicio opinie exprimata de acestia.\u003cbr\u003e\n    \u003cstrong\u003e3.7.\u003c/strong\u003e Platforma Vivre actioneaza ca un factor pasiv in distributia online si publicarea informatiilor furnizate de catre utilizatori si Vanzatori si nu are obligatia de a verifica in avans materialul publicat. In consecinta, Vivre nu raspunde pentru informatiile si datele postate, difuzate sau transmise de acestia. In cazul in care i se semnaleaza un continut neconform, Vivre poate investiga situatia si poate decide indepartarea continutului respectiv.\u003cbr\u003e\n    \u003cstrong\u003e3.8.\u003c/strong\u003e Vivre isi poate asuma masuri in privinta utilizatorului sau a materialelor publicate de catre acesta. Prin introducerea materialului in orice segment public sau privat de pe platforma, acordati Vivre dreptul neexclusiv, irevocabil si gratuit de a utiliza, reproduce, modifica, adapta, publica, traduce, distribui sau comunica public continutul, in scopul functionarii si promovarii platformei.\u003cbr\u003e\n    \u003cstrong\u003e3.9.\u003c/strong\u003e De asemenea, permiteti oricarei persoane care este abonata sau are acces legal la platforma sa acceseze, sa vizualizeze, sa stocheze sau sa reproduca asemenea materiale in scopuri personale. Sub rezerva celor mentionate anterior, autorul materialului isi pastreaza drepturile care deriva din lege.\u003cbr\u003e\n    \u003cstrong\u003e3.10.\u003c/strong\u003e Continutul, astfel cum este definit in prezentul document, incluzand dar nelimitandu-se la logo-uri, reprezentari stilizate, simboluri comerciale, imagini statice sau dinamice, texte si continut multimedia prezentate pe Site, care apartin Vivre Homes, este proprietatea exclusiva a acesteia, toate drepturile fiind rezervate.\u003cbr\u003e\n    \u003cstrong\u003e3.11.\u003c/strong\u003e Membrului sau Clientului nu ii este permisa copierea, distribuirea, publicarea, transferul catre terte parti, modificarea sau utilizarea Continutului apartinand Vivre Homes in alte scopuri decat cele prevazute expres de prezentul Document, fara acordul prealabil al Vivre Homes.\u003cbr\u003e\n    \u003cstrong\u003e3.12.\u003c/strong\u003e Orice continut la care Membrul sau Clientul are sau obtine acces se afla sub incidenta prezentului Document, in lipsa unui acord de utilizare specific si valid incheiat intre Vivre Homes si acesta, fara nicio garantie expresa sau implicita din partea Vivre Homes cu privire la acel continut.\u003cbr\u003e\n    \u003cstrong\u003e3.13.\u003c/strong\u003e Membrul sau Clientul poate copia, transfera sau utiliza Continutul numai in scopuri personale sau non-comerciale, in masura in care acestea nu contravin prevederilor prezentului Document.\u003cbr\u003e\n    \u003cstrong\u003e3.14.\u003c/strong\u003e In cazul in care Vivre Homes confera dreptul de utilizare a unui anumit continut printr-un acord distinct, acest drept se extinde numai asupra continutului definit in acord, pe perioada si in conditiile prevazute de acesta.\u003cbr\u003e\n    \u003cstrong\u003e3.15.\u003c/strong\u003e Niciun continut transmis Membrului sau Clientului, prin orice mijloc de comunicare, nu constituie o obligatie contractuala din partea Vivre Homes sau a angajatilor ori colaboratorilor sai.\u003cbr\u003e\n    \u003cstrong\u003e3.16.\u003c/strong\u003e Este interzisa orice utilizare a Continutului in alte scopuri decat cele permise expres prin prezentul Document sau prin acordul de utilizare care il insoteste, daca acesta exista.\n\u003c/p\u003e\n\n\u003ch3\u003e3A. Digital Services Act (DSA) – Conținut ilegal, raportări și moderare\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e3A.1. Punct unic de contact (DSA)\u003c/strong\u003e Pentru comunicări privind aplicarea Regulamentului (UE) 2022/2065 („Digital Services Act”), inclusiv raportarea conținutului ilegal sau solicitări ale autorităților competente, Vivre Homes poate fi contactată la adresa: contact@vivre.eu (subiect: „DSA”).\u003cbr\u003e\n    \u003cstrong\u003e3A.2. Raportarea conținutului ilegal\u003c/strong\u003e Orice persoană poate notifica existența pe SITE a unui conținut presupus ilegal (ex. încălcarea drepturilor de autor, mărci, conținut defăimător sau interzis prin lege). Pentru procesarea eficientă, notificarea trebuie să includă, pe cât posibil:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) motivele pentru care conținutul este considerat ilegal;\u003c/li\u003e\n    \u003cli\u003eb) locația exactă a conținutului (URL/link, captură ecran);\u003c/li\u003e\n    \u003cli\u003ec) numele și adresa de e-mail a persoanei care notifică;\u003c/li\u003e\n    \u003cli\u003ed) o declarație de bună-credință privind corectitudinea informațiilor furnizate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e3A.3. Analiza notificărilor\u003c/strong\u003e Vivre Homes va confirma primirea notificării, atunci când este posibil, și va analiza situația într-un termen rezonabil.\u003cbr\u003e\n    \u003cstrong\u003e3A.4. Măsuri\u003c/strong\u003e În urma analizei, Vivre Homes poate dispune eliminarea sau restricționarea accesului la conținut, suspendarea contului sau alte măsuri permise de lege.\u003cbr\u003e\n    \u003cstrong\u003e3A.5. Informarea utilizatorului\u003c/strong\u003e În măsura aplicabilității, utilizatorul vizat va fi informat cu privire la decizia luată și principalele motive care au stat la baza acesteia, precum și despre posibilitatea contestării.\u003cbr\u003e\n    \u003cstrong\u003e3A.6. Contestarea deciziilor\u003c/strong\u003e Utilizatorii pot formula contestații la adresa contact@vivre.eu (subiect: „Contestație DSA”), indicând elementele relevante.\n\u003c/p\u003e\n\n\u003ch3\u003e4. Contact pentru Clienti si Membri\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e4.1.\u003c/strong\u003e Vivre Homes publica pe site datele complete si corecte de identificare si contactare de catre Client sau Membru.\u003cbr\u003e\n    \u003cstrong\u003e4.2.\u003c/strong\u003e Prin utilizarea formularului de contact sau al serviciului prezent pe site, Membrul sau Clientul declara si accepta sa fie contactat prin orice mijloc disponibil, incluzand si mijloacele electronice, de catre compania Vivre Homes (fara insa a exista o obligatie din partea companiei in acest sens), intelegand ca prin completarea informatiilor cu privire la datele sale de contact, precum nume, prenume, adresa de e-mail, nr. de telefon etc., aceste date urmeaza a fi prelucrate si evidentiate in baza de date in scopul imbunatatirii relatiilor comerciale, respectiv in scopul bunei desfasurari a activitatii economice si comerciale ale companiei. Pentru detalii si informatii suplimentare legate de prelucrarea si administrarea datelor tale cu caracter personal, te rugam sa vizualizezi si capitolul/articolul denumit Politica de confidentialitate.\u003cbr\u003e\n    \u003cstrong\u003e4.3.\u003c/strong\u003e Completarea partiala sau integrala a formularului de contact si trimiterea acestuia nu reprezinta in nici un fel un angajament din partea Vivre Homes de a contacta Membrul sau Clientul.\u003cbr\u003e\n    \u003cstrong\u003e4.4.\u003c/strong\u003e Accesarea Site-ului, folosirea informatiilor prezentate in cadrul acestuia, vizitarea paginilor sau trimiterea de e-mail-uri sau notificari adresate Vivre Homes se realizeaza in mod electronic, telefonic, sau orice alt mod de comunicare disponibil Membrului sau Clientului si Vivre Homes, considerandu-se astfel ca acesta consimte primirea notificarilor din partea Vivre Homes in modalitate electronica si/sau telefonica, incluzand si comunicari prin e-mail, mesaje scurte (SMS) sau prin anunturi pe site.\u003cbr\u003e\n    \u003cstrong\u003e4.5.\u003c/strong\u003e Clientul declara expres ca datele de contact furnizate ii apartin (adresa de email, numar de telefon, adresa de livrare) si ca vor putea fi folosite de catre Vivre Homes in comunicarile sale cu Clientul.\n\u003c/p\u003e\n\n\u003ch3\u003e5. Newslettere si alerte\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e5.1.\u003c/strong\u003e In momentul in care, Membrul sau Clientul isi creaza un Cont pe Site, acceptand Documentul (Termeni si Conditii), acesta are dreptul de a-si exprima sau nu acordul cu privire la primirea de newslettere si/sau alerte din partea Vivre Homes prin modalitate electronica si/sau telefonica, incluzand si comunicari prin e-mail, mesaje scurte (SMS) sau prin anunturi pe site.\u003cbr\u003e\n    \u003cstrong\u003e5.2.\u003c/strong\u003e Datele preluate de la Membru in scopul expedierii newslettere-lor si/sau alertelor, pot si vor fi folosite de catre Vivre Homes in limitele Politicii de confidentialitate.\u003cbr\u003e\n    \u003cstrong\u003e5.3.\u003c/strong\u003e Renuntarea la primirea newslettere-lor si/sau alertelor de catre Membru sau Client se poate face in orice moment:\u003cbr\u003e\n    \u003cstrong\u003e5.3.1.\u003c/strong\u003e Folosind legatura special destinata din cadrul oricaror newslettere si/sau alerte primite (in partea de jos a e-mail-ului in sectiunea „Click aici pentru dezabonare”), acolo unde aceasta optiune este tehnic posibila;\u003cbr\u003e\n    \u003cstrong\u003e5.3.2.\u003c/strong\u003e Prin modificarea acceptului sau de a primi newslettere si/sau alerte si folosind pagini din zonele restrictionate, in cadrul Contului individual al Membrului, de pe ro.Vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e5.3.3.\u003c/strong\u003e Prin contactarea Vivre Homes la datele de mai sus astfel cum sunt precizate in art. 2.6 si fara nicio obligatie ulterioara a vreunei parti fata de cealalta sau fara ca vreo parte sa poata sa pretinda celeilalte daune-interese.\u003cbr\u003e\n    \u003cstrong\u003e5.4.\u003c/strong\u003e Retragerea consimtamantului cu privire la primirea newsletter-lor si/sau alertelor nu implica renuntarea la acceptul dat pentru prezentul document si se produc efecte doar pentru viitor ulterior comunicarii intentiei de retragere.\u003cbr\u003e\n    \u003cstrong\u003e5.5.\u003c/strong\u003e Vivre Homes isi rezerva atat dreptul de a selectiona persoanele carora le va trimite newslettere si/sau alerte, cat si dreptul de a elimina din baza sa de date orice Membru sau Client care si-a exprimat anterior consimtamantul de a primi newslettere si/sau alerte, fara nici un angajament ulterior din partea Vivre Homes, sau a vreunei notificari prealabile a acestuia.\u003cbr\u003e\n    \u003cstrong\u003e5.6.\u003c/strong\u003e Vivre Homes nu va include in newslettere si/sau alerte transmise Membrului sau Clientului nici un alt fel de material publicitar sub forma de continut care sa faca referire la vreun tert care nu este partener comercial al Vivre Homes, la momentul expedierii newsletterelor si/sau alertelor.\n\u003c/p\u003e\n\n\u003ch3\u003e6. Politica de confidentialitate\u003c/h3\u003e\n\u003cp\u003e\n    Depunem toate eforturile pentru a va asigura ca va protejam si respectam confidentialitatea datelor dvs. cu caracter personal prin implementarea masurilor necesare prevazute de normele si reglementarile in vigoare privind protectia datelor, inclusiv Regulamentul general (UE) 2016/679 privind protectia datelor (“ RGPD”). Aceast capitol are rolul de a va informa asupra datelor cu caracter personal pe care le colectam de la dvs. sau pe care dvs. ni le comunicati prin intermediul prezentului site web, precum si a modului in care vom prelucra these date.\u003cbr\u003e\n    \u003cstrong\u003e6.1.\u003c/strong\u003e Potrivit normelor si reglementarilor in vigoare privind protectia datelor (“ RGPD”) - datele cu caracter personal sunt definite ca orice informatie privind o persoana fizica identificata sau identificabila. In principiu reprezinta date personale, pe care si Compania Vivre le are in vedere: numele si prenumele persoanei fizice, domiciliul, adresa de email, CNP, numar de telefon, coduri client/atribut al contului inregistrat, codul de identificare de tip AWB pentru livrarea produsului comandat etc.\u003cbr\u003e\n    \u003cstrong\u003e6.1.1.\u003c/strong\u003e Datele dvs. personale pe care le colecteaza si prelucreaza compania Vivre Homes sunt: numele si prenumele persoanei, domiciliu (adresa postala pentru livrare), adresa de email, numar de telefon, coduri de identificare client/identificator online, date de facturare (in cazul finalizarii unei comenzi), voce, informatii bancare (in cazul efectuarii unui retur/ramburs de plata), cont social media. În cadrul funcționalităților de amenajare asistate de inteligență artificială, utilizatorii pot încărca imagini ale locuinței proprii în vederea generării de propuneri vizuale personalizate. În măsura în care imaginile permit identificarea directă sau indirectă a unei persoane, acestea pot constitui date cu caracter personal în sensul Regulamentului (UE) 2016/679 (RGPD). Prelucrarea imaginilor se realizează exclusiv în scopul furnizării serviciului solicitat și al îmbunătățirii funcționalităților platformei, în baza consimțământului exprimat de utilizator prin utilizarea activă a serviciului. Imaginile nu sunt utilizate pentru antrenarea modelelor de inteligență artificială și nu sunt valorificate în alte scopuri comerciale. Vivre își rezervă dreptul de a utiliza imaginile generate prin intermediul platformei, precum și versiunile inițiale încărcate de utilizator, în scopuri de prezentare, promovare și exemplificare a funcționalităților disponibile, inclusiv prin publicarea acestora în secțiuni inspiraționale ale platformei sau în materiale de comunicare. Publicarea designurilor se va realiza fără afișarea datelor cu caracter personal care pot conduce la identificarea directă a utilizatorului. În măsura în care este indicat un autor, acesta va fi reprezentat exclusiv prin aliasul asociat contului, care poate fi modificat de utilizator în orice moment, inclusiv în scopul protejării identității sale. Utilizatorul are dreptul de a ascunde amenajările realizate din contul propriu, de a solicita ștergerea acestora sau de a-și retrage consimțământul în orice moment, fără a afecta legalitatea prelucrării efectuate anterior retragerii. Nu colectam si nu prelucram in alt mod date sensibile, asa cum sunt definite in Regulamentul General privind Protectia Datelor (prescurtat RGPD) in categorii speciale de date cu caracter personal. De asemenea, nu dorim sa colectam sau sa prelucram date ale minorilor care nu au implinit varsta de 18 ani.\u003cbr\u003e\n    \u003cstrong\u003e6.1.2.\u003c/strong\u003e Asadar, potrivit “RGPD”, e operator de date cu caracter personal („Operator”) – Compania VIVRE HOMES S.R.L., societate romana cu personalitate juridica, cu sediul in Romania, Bucuresti, Bld. Tudor Vladimiresc, nr. 22, biroul 1, et. 11, Cod postal 050883, avand nr. de ordine in Registrul Comertului J2021015306408 si CUI RO44853220 avand obligatia conform normelor nationale si a Regulamentului UE 679/2016 (RGPD) de a administra in conditii de siguranta si numai pentru scopurile specificate, datele tale cu caracter personal. Aceste date au fost colectate/procesate/etc. in relatia comerciala desfasurata in trecut si/sau in curs de desfasurare si pentru care v-ati exprimat in mod valabil consimtamantul potrivit legislatiei in vigoare la momentul preluarii si colectarii datelor personale!\u003cbr\u003e\n    \u003cstrong\u003e6.1.3.\u003c/strong\u003e Compania aduce la cunostinta ca enumerarea din cadrul art. 6.1 si urmatoarele este pur exemplificativa si ca in raport de serviciul angajat de client, subscrisa colecteaza numai acele date personale minime necesare indeplinirii scopurilor/activitatilor realizate de Vivre.\u003cbr\u003e\n    \u003cstrong\u003e6.2.\u003c/strong\u003e In procesul de operare a prezentului site web, Compania Vivre Homes colecteaza anumite informatii (“date cu caracter personal”) referitoare la persoane fizice identificate sau care pot identifica persoane fizice, date furnizate de utilizatorii prezentului site web, prin exprimarea voluntara a consimtamantului, in mod direct (ex. nume, prenume, adresa postala, adresa de e-mail, numar de telefon) sau indirect (ex. adresa IP, utilizarea UUIDS (unique identifiers provided by social logins).\u003cbr\u003e\n    \u003cstrong\u003e6.3.\u003c/strong\u003e Scopurile prelucarii datelor cu caracter personal furnizate de catre un “Membru” sau un “Client Vivre”, avute in vedere si urmarite de catre compania Vivre Homes sunt urmatoarele:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eprocesarea comenzilor si retururilor;\u003c/li\u003e\n    \u003cli\u003epastrarea relatiei cu partenerii contractuali in scopuri contabile;\u003c/li\u003e\n    \u003cli\u003eoptimizarea activitatii de marketing;\u003c/li\u003e\n    \u003cli\u003esolutionarea cererilor privind indeplinirea unei comenzi\u003c/li\u003e\n    \u003cli\u003ecomunicari de marketing;\u003c/li\u003e\n    \u003cli\u003eadministrarea contului in cadrul platformei Vivre;\u003c/li\u003e\n    \u003cli\u003escopuri statistice\u003c/li\u003e\n    \u003cli\u003efeedback-ul furnizat serviciilor oferite de catre Vivre Homes.\u003c/li\u003e\n    \u003cli\u003efeedback-ul furnizat produselor/colectiilor oferite de catre Vivre Homes, prin exprimarea optiunilor clientilor/membrilor privind anumite colectii de bunuri, optiuni care pot fi publicate pe magazinul online al companiei, asigurandu-se o promovare superioara a bunurilor respective.\u003c/li\u003e\n    \u003cli\u003efurnizarea funcționalităților de amenajare asistate de inteligență artificială, inclusiv prelucrarea imaginilor încărcate de utilizatori în scopul generării de propuneri vizuale de design interior.\u003c/li\u003e\n    \u003cli\u003efurnizarea serviciilor de intermediere prin Vivre Services si transmiterea solicitarilor catre Mesterii Parteneri.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e6.4.\u003c/strong\u003e Compania Vivre colecteaza, prelucreaza si administreaza datele tale personale in conformitate cu normele si reglementarile “RGPD” pentru urmatoarele perioade de timp: (i) in conformitate cu prevederile codului civil privind institutia juridica a prescriptiei, precum si a conditiilor contractuale asumate prin acceptarea termenilor si conditiilor, datele personale colectate sunt arhivate/pastrate de Companie pe o perioada de 3 ani de la incetarea contractului (pentru situatia livrarilor si neintervenirii solicitarilor de retur); (ii) datele personale colectate sunt arhivate/pastrate de Companie pe o perioada de 3 ani si/sau Client si-a exprimat de la data intervenirii ultimului retur aferent contului. De asemenea este bine sa stiti ca putem prelucra date cu caracter personal pentru a va informa in legatura cu produse si servicii, oferte promotionale sau pentru abonarea la newsletter. Ca regula generala, these date cu caracter personal vor fi prelucrate in scopuri directe de marketing numai cu consimtamantul dvs. si prin utilizarea canalelor de comunicare (email, sms etc.) pe care le-ati indicat in momentul oferirii consimtamantului. In these conditii este important sa cunoasteti ca vom utiliza consimtamantul dvs. exprimat in scop de marketing pana la retragerea acestuia, existand posibilitatea de retragere a acestui tip de consimtamant oricand. Clientul Vivre, prin transmiterea datelor cu caracter personal, declara si accepta neconditionat ca datele sale personale sa faca parte, sa fie arhivate in baza de date a proprietarului, exprimandu-si astfel un acord expres si neechivoc ca datele sale personale sa fie stocate, utilizate si prelucrate conform scopurilor precizate la punctul 6.3.\u003cbr\u003e\n    \u003cstrong\u003e6.5.\u003c/strong\u003e Compania Vivre va informeaza ca prelucrarea reprezinta: orice operatiune/set de operatiuni asupra acestor date (cu sau fara utilizarea de mijloace automatizate), respectiv colectarea, inregistrarea, organizarea, structurarea, stocarea, adaptarea, modificarea, extragerea, consultarea, utilizarea, diseminarea, punerea la dispozitie, alinierea, combinarea, restrictionarea, stergerea, distrugerea etc. (aceste operatiuni sunt indicate cu titlu exemplificativ in Regulament, notiunea de prelucrarea reprezentand orice fel de operatiune in legatura cu datele personale).\u003cbr\u003e\n    \u003cstrong\u003e6.6.\u003c/strong\u003e La nivel teritorial dispozitiile regulamentului se aplica prelucrarilor efectuate de un operator sau imputernicit cu sediul in U.E., prelucrarilor de date personale ale unor persoane aflate in UE, efectuate de un operator sau imputernicit care nu e stabilit in UE, daca: se ofera bunuri sau servicii catre persoane aflate in UE sau se monitorizeaza comportamentul persoanelor din UE. Compania Vivre este operator de date cu caracter personal potrivit normelor si reglemantarilor in vigoare, inclusiv RGPD.\u003cbr\u003e\n    \u003cstrong\u003e6.7.\u003c/strong\u003e Compania va aduce la cunostinta ca in raport de activitatea/serviciul ales de client, respectiv a scopului colectarii datelor cu caracter personal, Vivre poate transmite datele dvs. companiilor din grup, tertilor sau autoritatilor, pentru indeplinirea scopurilor pe baza temeiurilor activitatilor de procesare. Potrivit Regulamentului “RGPD”, va informam ca putem transmite sau oferi acces la anumite date cu caracter personal ce va privesc, urmatoarelor categorii de destinatari:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003esocietatilor din grup pentru gestiunea comenzilor;\u003c/li\u003e\n    \u003cli\u003epartenerilor comerciali pentru furnizarea produselor/serviciilor comandate\u003c/li\u003e\n    \u003cli\u003efurnizorilor de servicii de curierat;\u003c/li\u003e\n    \u003cli\u003efurnizorilor de servicii de plata/bancare;\u003c/li\u003e\n    \u003cli\u003efurnizorilor de servicii de contabilitate, pentru tinerea evidentei contabile prin imputernicit extern;\u003c/li\u003e\n    \u003cli\u003ealtor societati cu care putem dezvolta programe comune de ofertare pe piata a bunurilor si serviciilor noastre;\u003c/li\u003e\n    \u003cli\u003emesterilor Parteneri inscrisi in platforma Vivre Services, exclusiv in scopul procesarii solicitarilor transmise de Client;\u003c/li\u003e\n    \u003cli\u003eautoritatilor publice.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eMesterii Parteneri actioneaza ca operatori independenti de date cu caracter personal pentru datele prelucrate in scopul furnizarii serviciilor solicitate de Client.\u003c/p\u003e\n\u003cp\u003e\n    Va asiguram ca vom depune toate diligentele ca imputernicitul si/sau terta parte contractanta ofera garantii suficiente pentru a pune in aplicare masuri tehnice si organizatorice adecvate, astfel incat procedurile sa indeplineasca cerintele normelor si reglementarilor legale, inclusiv RGDP si sa asigure protectia drepturilor persoanei vizate (persoana fizica client/membru Vivre).\u003cbr\u003e\n    \u003cstrong\u003e6.8.\u003c/strong\u003e Temeiul pentru care prelucram these date personale si administram these date colectate poate fi in raport de scopul prelucrarii datelor consimtamantul dvs., acordat cu prilejul crearii contului online si al validarii acestuia, prin solicitarea de a fi devenit client/membru in comunitatea Vivre. Totodata, temeiul este si unul legal si/sau contractual, avand la baza contractul/raportul comercial ce a luat nastere intre dvs., client si compania/companiile Vivre, prin plasarea comenzii si efectuarea platilor produselor comandate, prin efectuarea de retururi ale produselor neconforme si/sau refuzate etc., dar si un temei legitim necesar si indispensabil desfasurarii activitatilor comerciale si economice ale companiei Vivre prevazut asemenea de Regulament. Vom prelucra datele dvs. personale pentru a imbunatati si a lua masuri de protectie, ori de cate ori se impune, pentru protectia privind utilizarea site-ului web si a utilizatorilor platformei Vivre fata de atacuri cibernetice, masuri de prevenire si detectare a tentativelor de frauda, inclusiv transmiterea unor informatii catre autoritatile publice competente, masuri de gestionare a diverselor altor riscuri.\u003cbr\u003e\n    \u003cstrong\u003e6.9.\u003c/strong\u003e De asemenea tinem sa fiti informati in mod complet si intelegem a va prezenta Principiile stabilite de Regulamentul UE 679/2016 si Drepturile Utilizatorului privind datele cu caracter personal.\u003cbr\u003e\n    \u003cstrong\u003e6.10.\u003c/strong\u003e Regulamentul european in domeniul protectiei datelor cu caracter personal reglementeaza un numar de 6 principii a fi respectate de operator (compania Vivre) atunci cand proceseaza date personale:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ePrincipiul legalitatii, echitatii (corectitudine) si transparentei. Conform acestui principiu, compania trebuie sa se asigure (1) ca prelucrarea de date trebuie sa fie realizata doar respectand dispozitiile legale, orice alta procesare va fi considerata a fi ilicita, (2) ca prelucreaza datele doar in modalitatile pe care persoana in cauza le-ar astepta in mod rezonabil si (3) ca procesarea trebuie sa fie transparenta, adica operatorul sa transmita subiectilor clar si deschis cum intentioneaza sa foloseasca datele personale.\u003c/li\u003e\n    \u003cli\u003ePrincipiul limitarii scopului pentru care sunt colectate datele. Compania noastra respecta acest principiu obligandu-se sa colecteze/proceseze datele personale doar pentru scopul determinat si transmis persoanei.\u003c/li\u003e\n    \u003cli\u003ePrincipiul reducerii la minim a datelor prelucrate. Compania noastra respecta acest principiu colectand/procesand numai acele date minim necesare pentru realizarea operatiunilor, adoptand norme prin care sa se asigure ca nu va colecta date inutile in raport de operatiunea comerciala.\u003c/li\u003e\n    \u003cli\u003ePrincipiul exactitatii, date actuale. Compania noastra va colecta/procesa de la clientii sai doar date exacte si actuale.\u003c/li\u003e\n    \u003cli\u003ePrincipiul pastrarii datelor pe o perioada necesara indeplinirii scopurilor pentru care sunt prelucrate. Compania noastra respecta principiul reglementat de regulamentul european, arhivand/pastrand datele dvs. doar pentru perioada de timp necesara indeplinirii scopurilor.\u003c/li\u003e\n    \u003cli\u003ePrincipiul integritatii si confidentialitatii. Compania noastra a implementat toate masurile de securitate si a dispus la nivelul propriilor departamente norme care au menirea de a asigura securitatea impotriva procesarilor neautorizate si ilicite si impotriva pierderilor de date accidentale, distrugerilor sau deteriorarilor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e6.11.\u003c/strong\u003e Regulamentul european a statuat ca persoanele fizice (clientii/membrii Vivre) beneficiaza de 8 (opt) drepturi, astfel:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) Dreptul la informare.\u003c/li\u003e\n    \u003cli\u003eb) Dreptul la acces.\u003c/li\u003e\n    \u003cli\u003ec) Dreptul la rectificare.\u003c/li\u003e\n    \u003cli\u003ed) Dreptul de stergere.\u003c/li\u003e\n    \u003cli\u003ee) Dreptul la restrictionare.\u003c/li\u003e\n    \u003cli\u003ef) Dreptul la portabilitate.\u003c/li\u003e\n    \u003cli\u003eg) Dreptul la opozitie.\u003c/li\u003e\n    \u003cli\u003eh) Dreptul de a nu fi evaluat prin profilare automata.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    Este bine sa stiti ca aveti posibilitatea de a contacta si Responsabilul privind Protectia Datelor la nivelul Vivre la adresa de email: dpo@Vivre.eu. De asemenea, va informam ca aveti dreptul sa depuneti o plangere la autoritatea de supraveghere cu privire la prelucrarea datelor dvs. cu caracter personal. Pentru exercitarea drepturilor prevazute anterior, in calitate de client al companiei Vivre, aveti dreptul de a adresa o cerere scrisa, datata si expediata la adresa dpo@Vivre.eu.\n\u003c/p\u003e\n\n\u003ch3\u003e7. Politica de utilizare Cookie-uri pe ro.Vivre.eu\u003c/h3\u003e\n\u003cp\u003e\n    Cookie-ul este un fisier de mici dimensiuni, un text special, deseori codificat, trimis de un server unui navigator web si apoi trimis inapoi (nemodificat) de catre navigator, de fiecare data cand acceseaza acel server. Cookie-ul este instalat prin solicitarea emisa de catre un web-server unui browser (ex: Internet Explorer, Chrome, Mozilla) si este complet “pasiv” (nu contine programe software, virusi sau spyware si nu poate accesa informatiile de pe hard driverul utilizatorului). Cookie-urile sunt folosite pentru autentificare, precum si pentru urmarirea comportamentului utilizatorilor; aplicatii tipice sunt retinerea preferintelor utilizatorilor si implementarea sistemului de „cos de cumparaturi”. These fisiere fac posibila recunoasterea terminalului utilizatorului si prezentarea continutului intr-un mod relevant, adaptat preferintelor utilizatorului. Cookie-urile asigura utilizatorilor o experienta placuta de navigare si sustin eforturile Vivre Homes pentru a oferi servicii comfortabile utilizatorilor, de ex.: – preferintele in materie de confidentialitate online si istoricul cosului de cumparaturi. De asemenea, sunt utilizate in pregatirea unor statistici anonime agregate care ajuta la intelegerea modalitatii in care un utilizator beneficiaza de ro.Vivre.eu, permitand imbunatatirea structurii si continutului, dar excluzand indentificarea personala a utilizatorului.\u003cbr\u003e\n    Vivre Homes foloseste doua tipuri de Cookie-uri: per sesiune si fixe (fisiere temporare ce raman in terminalul utilizatorului pana la terminarea sesiunii sau inchiderea aplicatiei/browser-ului web). Fisierele fixe raman pe terminalul utilizatorului pe o perioada in parametrii Cookie-ului sau pana sunt sterse manual de utilizator. Cookie-urile folosite de partenerii operatorului unei pagini web, incluzand fara limitari utlizatorii paginii web, fac obiectul Politicii de Confidentialitate respective. O vizita pe ro.Vivre.eu poate plasa: Cookie-uri de performanta a site-ului, Cookie-uri de analiza a vizitatorilor, Cookie-uri pentru geotargetting, Cookie-uri de inregistrare, Cookie-uri pentru publicitate sau Cookie-uri ale furnizorilor de publicitate. Datele personale colectate prin utilizarea Cookie-urilor pot fi colectate doar pentru a facilita anumite functionalitati pentru utilizator si sunt criptate intr-un mod care face imposibil accesul persoanelor neautorizate la ele.\u003cbr\u003e\n    In general, o aplicatie folosita pentru accesarea paginilor web permite salvarea Cookie-urilor pe terminal in mod implicit. These setari pot fi schimbate in asa fel incat administrarea automata a Cookie-urilor sa fie blocata de browser-ul web sau utilizatorul sa fie informat de fiecare data cand cookie-urile sunt trimise catre terminalul sau. Informatii detaliate despre posibilitatile si modurile de administrare a Cookie-urilor pot fi gasite in zona de setari a aplicatiei (browser-ului web). Limitarea folosirii Cookie-urilor poate afecta anumite functionalitati ale ro.Vivre.eu. Cookie-urile reprezinta punctul central al functionarii eficiente a Internetului, ajutand la generarea unei experiente de navigare prietenoase si adaptata preferintelor si intereselor fiecarui utilizator. Refuzarea sau dezactivarea cookie-urilor poate face unele site-uri imposibil de folosit. Datorita flexibilitatii lor si a faptului ca majoritatea dintre cele mai vizitate site-uri si cele mai mari folosesc cookie-uri, acestea sunt aproape inevitabile; dezactivarea cookie-urilor nu va permite accesul utilizatorului pe site-urile cele mai raspandite si utilizate printre care Youtube, Gmail, Yahoo si altele. Exemple de intrebuintari importante ale cookie-urilor:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eContinut si servicii adaptate preferintelor utilizatorului – categorii de produse si servicii. Acces adaptat pe interesele utilizatorilor – retinerea parolelor.\u003c/li\u003e\n    \u003cli\u003eRetinerea filtrelor de protectie a copiilor privind continutul pe Internet (optiuni family mode, functii de safe search).\u003c/li\u003e\n    \u003cli\u003eMasurarea, optimizarea si caracteristicile de analytics – cum ar fi confirmarea unui anumit nivel de trafic pe un website, ce tip de continut este vizualizat si modul cum un utilizator ajunge pe un website (ex prin motoare de cautare, direct, din alte website-uri etc). Website-urile deruleaza these analize a utilizarii lor pentru a imbunatati site-urile in beneficiul userilor.\u003c/li\u003e\n    \u003cli\u003eSecuritate si probleme legate de confidentialitate - Cookie-urile NU sunt virusi si folosesc formate tip plain text; nu sunt alcatuite din bucati de cod asa ca nu pot fi executate nici nu pot auto-rula. In consecinta, nu se pot duplica sau replica pe alte retele pentru a se rula sau replica din nou. Deoarece nu pot indeplini these functii, nu pot fi considerate virusi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    Intrucat cookie-urile pot fi folosite pentru scopuri negative deoarece stocheaza informatii despre preferintele si istoricul de navigare al utilizatorilor, atat pe un anume site cat si pe mai multe alte siteuri, fiind folosite ca o forma de Spyware (spionaj privind activitatea consumatorului), multe produse anti-spyware marcheaza cookie-urile in mod constant pentru a fi sterse in cadrul procedurilor de stergere/scanare anti-virus/anti-spyware. In general browserele au integrate setari de confidentialitate care furnizeaza diferite nivele de acceptare a cookie-urilor, perioada de valabilitate si stergere automata dupa ce utilizatorul a vizitat un anumit site. Deoarece protectia identitatii este foarte valoroasa si reprezinta dreptul fiecarui utilizator de internet, este indicat sa se stie ce eventuale probleme pot crea cookie-urile. Pentru ca prin intermediul lor se transmit in mod constant in ambele sensuri informatii intre browser si website, daca un atacator sau persoana neautorizata intervine in parcursul de transmitere a datelor, informatiile continute de cookie pot fi interceptate. Desi foarte rar, acest lucru se poate intampla daca browserul se conecteaza la server folosind o retea necriptata (ex: o retea WiFi nesecurizata). Alte atacuri bazate pe cookie implica setari gresite ale cookie-urilor pe servere. Este foarte important ca Utilizatorul sa aleaga metoda cea mai potrivita de protectie a informatiilor personale si sa:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eParticularizeze setarile browserului in ceea ce priveste cookie-urile pentru a reflecta un nivel confortabil pentru acesta al securitatii utilizarii cookie-urilor.\u003c/li\u003e\n    \u003cli\u003eSeteze termene lungi de expirare pentru stocarea istoricului de navigare si al datelor personale de acces.\u003c/li\u003e\n    \u003cli\u003eIa in considerare setarea browserului pentru a sterge datele individuale de navigare de fiecare data cand inchideti browserul. Aceasta este o varianta de a accesa site-urile care plaseaza cookie-uri si de a sterge orice informatie de vizitare la inchiderea sesiunii navigare.\u003c/li\u003e\n    \u003cli\u003eInstaleze si sa actualizeze constant aplicatii antispyware. Multe dintre aplicatiile de detectare si prevenire a spyware-ului includ detectarea atacurilor pe site-uri. Astfel, impiedica browserul de la a accesa website-uri care ar putea sa exploateze vulnerabilitatile browserului sau sa descarce software periculos.\u003c/li\u003e\n    \u003cli\u003eSe recomanda actualizarea programelor de navigare in mod constant, pentru ca multe dintre atacurile bazate pe cookie-uri se realizeaza exploatand punctele slabe ale versiunilor vechi ale browserelor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    Toate browserele moderne ofera posibilitatea de a schimba setarile cookie-urilor. These setari se gasesc de regula in “optiuni” sau in meniul de “preferinte” al browserului.\n\u003c/p\u003e\n\n\u003ch3\u003e8. Plata cu cardul\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e8.1.\u003c/strong\u003e In cazul in care Clientul opteaza pentru plata online cu cardul a contravalorii comenzilor, contractului si/sau contractelor, autorizarea si remiterea spre Decontare a tranzactiilor de acceptare card se realizeaza exclusiv prin solutia integrata Stripe; Stripe este furnizorul Vivre Homes de solutie software de facilitare a comertului electronic, respectiv servicii de plata, administrare plati si protectie antifrauda.\u003cbr\u003e\n    \u003cstrong\u003e8.2.\u003c/strong\u003e Sunt acceptate toate tipurile de carduri emise de banci romanesti si straine sub siglele VISA si MasterCard, cu conditia ca bancile emitente sa le fi activat pentru plata online. De asemenea, sunt acceptate plati efectuate prin carduri de credit pentru plati in rate, astfel cum sunt enumerate pe pagina cu informatii despre plati. Alte metode de plata pot include transferul bancar sau plata la livrare, in functie de optiunile puse la dispozitie pe Site.\u003cbr\u003e\n    \u003cstrong\u003e8.3.\u003c/strong\u003e Vivre Homes nu solicita si nu stocheaza niciun fel de informatii referitoare la cardul sau cardurile bancare ale Clientului, acestea fiind procesate direct pe serverele furnizorului de servicii de plata online.\u003cbr\u003e\n    \u003cstrong\u003e8.4.\u003c/strong\u003e In cazul comenzilor plasate prin intermediul Platformei Marketplace, plata efectuata de Client este procesata prin intermediul Platformei Vivre, care actioneaza ca intermediar de plata intre Client si Vanzator. Sumele incasate sunt transferate catre Vanzatorii relevanti, conform termenilor contractuali incheiati intre acestia si Vivre Homes.\u003cbr\u003e\n    \u003cstrong\u003e8.5.\u003c/strong\u003e Plata produselor comercializate prin intermediul Platformei nu reprezinta, prin ea insasi, incheierea Contractului de Vanzare-Cumparare, acesta fiind considerat incheiat intre Client si Vanzator la momentul confirmarii Comenzii de catre Vanzator, conform informatiilor afisate pe Site.\u003cbr\u003e\n    \u003cstrong\u003e8.6.\u003c/strong\u003e In situatia in care o Comanda este anulata, partial sau integral, sau in cazul unui retur acceptat, rambursarea sumelor achitate de Client se va efectua prin aceeasi metoda de plata utilizata initial, in conformitate cu Politica de retur aplicabila si cu informatiile comunicate Clientului prin intermediul Platformei.\u003cbr\u003e\n    \u003cstrong\u003e8.7.\u003c/strong\u003e Eventualele probleme legate de procesarea platilor, retururi sau rambursari pot fi semnalate de Client prin intermediul canalelor de contact puse la dispozitie de Vivre Homes, fara a aduce atingere drepturilor Clientului de a se adresa direct Vanzatorului, acolo unde este cazul.\n\u003c/p\u003e\n\n\u003ch3\u003e9. Politica de vanzare online\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e9.1 Acces la serviciu\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.1.1.\u003c/strong\u003e Accesul la serviciu este permis oricarui Membru care poseda sau isi creeaza un Cont pe site sau descarca aplicatia mobila iOS sau Android.\u003cbr\u003e\n    \u003cstrong\u003e9.1.2.\u003c/strong\u003e Pentru a i se permite accesul la serviciu, Membrul va trebui sa accepte prevederile Documentului.\u003cbr\u003e\n    \u003cstrong\u003e9.1.3.\u003c/strong\u003e Vivre Homes isi rezerva dreptul de a limita accesul clientului la Serviciu si campanii marketing (de a nu-l include in campania de promovare si fidelizare, de a-i permite sa comande doar cu plata in avans, etc.) precum si dreptul de a anula comenzile deja plasate in urmatoarele cazuri: plasarea si refuzarea a mai mult de doua comenzi in sistemul de plata la livrare, mai mult de 2 comenzi ulterior anulate de catre Client prin utilizarea butonului „Anuleaza comanda” sau notificare din partea lui trimisa in scris pe adresa de email contact@vivre.eu sau modificarea comenzilor in sensul renuntarii la 20 de produse lunar din comenzile plasate, prin comunicare in scrisa din partea Clientului catre adresa de email contact@vivre.eu, folosirea unui limbaj tendentios, incalcarea dreptului de proprietate intelectuala etc., accesul si existenta Contului Clientului ar putea prejudicia in vreun fel Vivre Homes. Vivre Homes isi rezerva acest drept cu exceptia cazurilor permise de la art. 9.3.7 si oricare criteriu mentionat mai sus se indeplineste primul. Acest drept poate fi exercitat in orice moment si nu este necesara notificarea Clientului in acest sens.\u003cbr\u003e\n    \u003cstrong\u003e9.1.4.\u003c/strong\u003e Fiecare Membru poate avea un singur Cont. Este interzisa partajarea unui Cont intre mai multi Membri/Clienti.\u003cbr\u003e\n    \u003cstrong\u003e9.1.5.\u003c/strong\u003e In situatia in care se descopera accese partajate de mai multi Clienti, Vivre Homes isi rezerva dreptul de a anula sau a suspenda accesul Clientului la Continut sau Serviciu. Daca exista comenzi plasate din conturile suspendate sau anulate, these vor fi anulate automat.\u003cbr\u003e\n    \u003cstrong\u003e9.1.6.\u003c/strong\u003e Vivre Homes poate refuza o comanda in urma unei notificari prealabile adresate Clientului, fara a exista obligatii intre parti si fara ca o parte sa poata pretinde daune, pentru urmatoarele situatii:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEsuarea / invalidarea tranzactiei online;\u003c/li\u003e\n    \u003cli\u003eNeacceptarea de catre banca emitenta a cardului Clientului / a tranzactiei;\u003c/li\u003e\n    \u003cli\u003eFurnizarea de date incomplete sau incorecte de catre Client;\u003c/li\u003e\n    \u003cli\u003eActivitatea Clientului poate produce daune site-ului ro.Vivre.eu, societatii VIVRE HOMES S.R.L. si /sau partenerilor sai;\u003c/li\u003e\n    \u003cli\u003eClientul foloseste Serviciul intr-un mod neconform uzantelor normale si bunei-credinte sau isi exercita drepturile in scopul de a vatama sau pagubi Vivre Homes intr-un mod excesiv si nerezonabil, contrar bunei-credinte;\u003c/li\u003e\n    \u003cli\u003eLivrari consecutiv esuate din culpa Clientului;\u003c/li\u003e\n    \u003cli\u003eAlte motive justificate (de ex.: plasarea si renuntarea nejustificata la mai mult de trei comenzi intr-un interval de 30 zile).\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.2. Produse si servicii\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.2.1.\u003c/strong\u003e Platforma Vivre poate publica pe site informatii despre produse, servicii si/sau promotii oferite fie direct de catre Vivre Homes, fie de catre terti vanzatori (Parteneri Marketplace) care comercializeaza produse prin intermediul platformei, intr-o anumita perioada si in limita stocului disponibil.\u003cbr\u003e\n    \u003cstrong\u003e9.2.2.\u003c/strong\u003e Produsele si/sau serviciile achizitionate prin intermediul platformei sunt destinate exclusiv uzului personal al Clientului.\u003cbr\u003e\n    \u003cstrong\u003e9.2.3.\u003c/strong\u003e Vivre Homes poate limita capacitatea de achizitionare a unor produse sau servicii disponibile pe site la un moment dat, unuia sau mai multor Clienti, pe motive intemeiate, inclusiv pentru prevenirea comenzilor abuzive sau a fraudelor.\u003cbr\u003e\n    \u003cstrong\u003e9.2.4.\u003c/strong\u003e Toate tarifele aferente produselor sau serviciilor prezentate pe site sunt exprimate in lei (RON) si includ TVA, conform legislatiei aplicabile si informatiilor furnizate de Vanzator.\u003cbr\u003e\n    \u003cstrong\u003e9.2.5.\u003c/strong\u003e În cadrul campaniilor promoționale, reducerile de preț sunt semnalizate distinct prin afișarea „prețului nou” (evidențiat grafic) alături de „prețul vechi”, afișat cu mențiunea corespunzătoare și marcat distinct. Pentru scopul prezentului Regulament, „prețul vechi” reprezintă cel mai scăzut preț practicat de platforma Vivre pentru produsul respectiv în perioada de 30 de zile anterioară aplicării reducerii de preț, în conformitate cu legislația aplicabilă.\u003cbr\u003e\n    \u003cstrong\u003e9.2.6.\u003c/strong\u003e Anumite produse disponibile pe platforma Vivre pot fi semnalizate cu prețul recomandat de furnizor („RRP” – Recommended Retail Price). Pentru scopul prezentului Regulament, „RRP” reprezintă prețul recomandat de producător sau furnizor și este afișat în vecinătatea prețului de vânzare, exclusiv cu titlu informativ. În situația în care produsul este comercializat la prețul RRP, acesta este afișat ca preț de vânzare. În toate celelalte cazuri, RRP nu reprezintă un preț anterior practicat de Vivre și nu constituie un preț de referință utilizat în calculul reducerilor, fiind distinct de noțiunile de „preț vechi” și „preț nou”.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003eFacturare si documente fiscale\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.2.6.\u003c/strong\u003e Facturarea produselor achizitionate prin intermediul platformei se face exclusiv in RON, folosind informatiile furnizate de Client in formularul destinat. In cazul produselor vandute de Partenerii Marketplace, factura si documentele fiscale sunt emise de catre Vanzatorul respectiv, care este parte in Contractul de Vanzare-Cumparare cu Clientul. Vivre Homes nu raspunde de corectitudinea informatiilor furnizate de Client pentru factura sau de imposibilitatea deducerii unor cheltuieli datorita informatiilor furnizate incorecte de catre Client. Pentru corectii (anulari, retur) se pot emite facturi de storno, conform legislatiei aplicabile, de catre Vanzatorul care a emis factura initiala.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003ePlata\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.2.7.\u003c/strong\u003e Plata produselor si/sau a serviciilor achizitionate prin intermediul platformei se poate face atat online cu cardul de debit, inclusiv carduri de credit pentru plati in rate, cat si prin alte metode disponibile la momentul plasarii comenzii, in functie de optiunile Vanzatorului.\u003cbr\u003e\n    \u003cstrong\u003e9.2.8.\u003c/strong\u003e In cazul platilor online cu cardul, Vivre Homes nu poate fi facuta responsabila pentru niciun alt cost suplimentar suportat de Client, incluzand dar nelimitandu-se la comisioane de conversie valutara aplicate de catre banca emitenta a cardului acestuia, in cazul in care moneda de emitere difera de RON. Responsabilitatea pentru this actiune o poarta numai Clientul.\u003cbr\u003e\n    \u003cstrong\u003e9.2.9.\u003c/strong\u003e Plata in numerar sau prin intermediul sistemului POS la livrare poate fi disponibila doar pentru anumite produse si doar in anumite conditii stabilite de Vanzator sau de partenerii de curierat. Clientul este informat in momentul plasarii comenzii cu privire la metodele de plata disponibile.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003eInformatii despre produse si oferte\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.2.11.\u003c/strong\u003e Informatiile folosite pentru descrierea produselor, caracteristici si greutate disponibile pe site (imagini statice/dinamice/prezentari multimedia/link-uri etc.) sunt furnizate cu titlu de prezentare si nu reprezinta o obligatie contractuala suplimentara fata de cea asumata de Vanzator prin Contractul de Vanzare-Cumparare. Vanzatorul isi rezerva dreptul de a retrage o oferta de produse sau de a o modifica in orice moment pana la plasarea comenzii, fara a datora daune sau penalitati catre niciun potential Client.\u003cbr\u003e\n    \u003cstrong\u003e9.2.12.\u003c/strong\u003e In imaginile produselor si/sau serviciilor, Vivre Homes sau Partenerii Marketplace isi rezerva dreptul de a utiliza si alte produse (accesorii etc.) care pot sa nu fie incluse in costurile produselor respective si implicit nu vor fi livrate la achizitia produselor. In acest caz, se precizeaza expres in descrierea produsului ce bun este de vanzare.\u003cbr\u003e\n    \u003cstrong\u003e9.2.13.\u003c/strong\u003e In cazul putin probabil cand un Vanzator nu va putea onora o parte din produse, Clientul va fi notificat prin e-mail, iar acesta poate beneficia de una dintre alternativele prevazute de lege, inclusiv anularea comenzii sau scoaterea din comanda a produsului ce nu mai poate fi livrat.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003eTimbru verde si obligatii legale\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.2.14.\u003c/strong\u003e TAXA DE TIMBRU VERDE – valoare exprimata in lei, platita de catre producator sau comerciant catre compania autorizata cu preluarea operatiunilor de colectare, transport si valorificare/reciclare a deseurilor de echipamente electrice si electronice, astfel cum este prevazut de legislatia aplicabile. Conform legii, this taxa este suportata in final de catre Clientul final (utilizator).\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.3. Comanda online\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.3.1.\u003c/strong\u003e Clientul poate efectua comenzi de produse comercializate la un moment dat, exclusiv pe platforma Vivre, ofertele fiind limitate in timp (dupa perioada indicata nu se mai pot plasa comenzi si articolele nu mai sunt vizibile pe ro.Vivre.eu). Pretul afisat pe site la momentul comenzii nu se va modifica, fiind ferm pentru comanda plasata. Pentru o oferta care a expirat nu mai pot fi plasate comenzi. Vanzatorii (VIVRE HOMES S.R.L. sau, dupa caz, Partenerii Vivre Marketplace) pot modifica oricand preturi, oferte sau cantitati, in functie de disponibilitatea stocului si de criterii comerciale interne, cu respectarea comenzilor deja confirmate. Platforma Vivre nu poate fi obligata sa mentina un anumit pret decat pentru comenzile plasate si confirmate; potentialii clienti care vizualizeaza ofertele dar nu plaseaza comenzi nu pot solicita un pret/oferta diferit de cel afisat pe site.\u003cbr\u003e\n    \u003cstrong\u003e9.3.2.\u003c/strong\u003e Prin finalizarea comenzii, Clientul consimte ca toate datele furnizate de acesta, necesare procesului de cumparare, sunt corecte, complete si adevarate la data plasarii comenzii.\u003cbr\u003e\n    \u003cstrong\u003e9.3.3.\u003c/strong\u003e Contractul la distanta este considerat incheiat intre Client si Vanzator (VIVRE HOMES S.R.L. sau, dupa caz, Partenerul Vivre Marketplace indicat pentru produs), atunci cand comanda plasata de catre Client este confirmata electronic. Platforma Vivre faciliteaza transmiterea comenzii catre Vanzatorul relevant. Inainte de expedierea produselor, Vanzatorul isi rezerva dreptul de a contacta Clientul, prin orice mijloc disponibil (telefonic sau e-mail), pentru confirmarea datelor de identificare si livrare. Clientii accepta ca Vanzatorul nu poate fi fortat sa livreze produse catre persoane care nu au confirmat datele necesare livrarii.\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.\u003c/strong\u003e Vanzatorul (VIVRE HOMES S.R.L. sau Partenerul Marketplace, dupa caz) poate denunta unilateral si anula automat comanda efectuata de catre Client, chiar si fara notificare prealabila, fara obligatii ulterioare intre parti si fara ca vreo parte sa poata pretinde celeilalte daune-interese, in urmatoarele cazuri:\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.1.\u003c/strong\u003e Neacceptarea de catre banca emitenta a cardului Clientului a tranzactiei, in cazul platii online;\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.2.\u003c/strong\u003e Invalidarea tranzactiei de catre procesatorul de carduri agreat;\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.3.\u003c/strong\u003e Datele furnizate de catre Client privind livrarea (adresa, date contact) sunt incomplete sau incorecte;\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.4.\u003c/strong\u003e Activitatea Clientului pe platforma poate produce daune de orice natura Vivre Homes si/sau Partenerilor sai;\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.5.\u003c/strong\u003e Realizarea a mai mult de doua livrari consecutive esuate din culpa Clientului;\u003cbr\u003e\n    \u003cstrong\u003e9.3.4.6.\u003c/strong\u003e Alte motive obiective si justificate (inclusiv indisponibilitatea produselor).\u003cbr\u003e\n    \u003cstrong\u003e9.3.5.\u003c/strong\u003e In cazul in care Clientul renunta la o comanda cu plata efectuata in avans (transfer bancar sau plata online cu cardul), suma achitata va fi rambursata de catre Vanzator in termen de maxim 14 zile de la data la care acesta a luat la cunostiinta de retragere, conform legislatiei aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e9.3.5.1.\u003c/strong\u003e In cazul rezolutiunii sau, dupa caz, rezilierii contractului din culpa Vanzatorului, daca Clientul a efectuat plata in avans, suma achitata va fi rambursata in maxim 7 zile de la momentul incetarii contractului.\u003cbr\u003e\n    \u003cstrong\u003e9.3.6.\u003c/strong\u003e In cazul in care unele produse comandate nu mai sunt disponibile pe stoc din motive independente de Vanzator, acesta va informa Clientul asupra indisponibilitatii imediat ce o cunoaste si va dispune rambursarea sumelor achitate in avans in termen de maxim 7 zile de la notificarea Clientului.\u003cbr\u003e\n    \u003cstrong\u003e9.3.7.\u003c/strong\u003e O comanda plasata poate fi modificata numai in anumite situatii si doar la solicitarea Clientului, daca produsul nu a fost expediat, astfel:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) Clientul solicita modificarea in scris, trimitand un e-mail pe contact@vivre.eu mentionand clar solicitarea si numarul comenzii;\u003c/li\u003e\n    \u003cli\u003eb) Clientul renunta la un produs inainte de expediere;\u003c/li\u003e\n    \u003cli\u003ec) Cresterea cantitatii dintr-un produs deja existent intr-o comanda, daca acesta este inca disponibil;\u003c/li\u003e\n    \u003cli\u003ed) Modificarea adresei de livrare;\u003c/li\u003e\n    \u003cli\u003ee) Modificarea metodei de plata;\u003c/li\u003e\n    \u003cli\u003ef) Modificare date pentru facturare, in limitele permise de lege.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    In cazul comenzilor vandute de Partenerii Marketplace, modificarile pot fi supuse politicilor comerciale proprii ale acestora.\u003cbr\u003e\n    \u003cstrong\u003e9.3.8.\u003c/strong\u003e Comenzile nu pot fi modificate dupa confirmarea platii online sau prin transfer bancar, daca Vanzatorul a inceput procesarea sau expedierea produselor.\u003cbr\u003e\n    \u003cstrong\u003e9.3.9.\u003c/strong\u003e In cazul in care un Client isi modifica datele personale folosind formularele disponibile pe site, toate comenzile in derulare existente la acel moment isi pastreaza datele acceptate anterior,
