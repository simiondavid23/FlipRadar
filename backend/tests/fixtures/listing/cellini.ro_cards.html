lansare":"0000-00-00","subtitle":"","metatitle":"","metakeywords":"","metadescription":"","canonical":"","robots":"","categoryid":"4216","external_href":"","category":"Cercei","categoryurl":"bijuterii-cercei","stockid":"1","stockno":"1","stock":"in stoc","pic":"cs-photos\/products\/thumb\/cercei-infinity-flower-din-aur-roz-18k-cu-diamante_15292_1_1694522012.jpg","featureid":null,"name":null,"brand":"Henri Maillardet","brandurl":"marci\/henri-maillardet","branddescription":"<p><b>Return to Exclusivity <\/b>- aceasta este invitatia pe care brandul elvetian<b> Henri Maillardet<\/b> o transmite prin fiecare bijuterie creata si fiecare experienta oferita in spatiul elegant dedicat artei, din inima orasului Z\u00fcrich. Bijuteriile Henri Maillardet imbina valoarea consacrata a pietrelor pretioase si a aurului prelucrat cu maiestrie, cu inspiratia extraordinara venita din arta si tehnologie. Surprinzatoare, spectaculoase si innobilate cu simboluri complexe, piesele din colectiile Design Jewellery si High Jewellery sunt adevarate capodopere atemporale, ce simbolizeaza eleganta, feminitatea, dar si puterea celei care le poarta. Henri Maillardet (1745 - 1830), artistul elvetian de avangarda care a inspirat brandul, a stabilit un nou nivel de asteptari in secolul al XVIII-lea in mecanica, orologerie si arta. Inventator al superbelor automatoane - primele mecanisme care deschideau calea roboticii moderne - Henri Maillardet este cel care a construit The Juvenile Artist. Acest extraordinar automaton avea capacitatea unica in acea perioada de a reproduce in scris 3 poezii ale epocii si 4 desene. Aceasta viziune curajoasa si exclusivista inspira si astazi designul extraordinar al bijuteriilor Henri Maillardet.<\/p><p><br><\/p>","bimage":"henri-maillardet_1628082716.png","isvariant":"0","ronvalue":"1.0000","currencyname":"Lei","currencyprice_no_vat":"6049.5868","variants_count":"0","types":[],"tier_price_table":{"prices_no_vat":[],"prices_with_vat":[]},"pic_ext":0,"picture":{"mini":                 function productClickListingGTAG() {
                    var AllElement = document.getElementsByClassName('product');
                    if (AllElement.length < 1){
                        AllElement = document.getElementsByClassName('prod_zen');
                    }

                    Array.from(AllElement).forEach((el) => {
                        el.addEventListener('click', function (e) {
                            if (!e.target.classList.contains("addtocart")){
                                var productID = this.getAttribute('data-id');
                                if (!isNaN(productID) && productID != null) {
                                    var found = products.find(function (element) {
                                        if (element.productid === productID) {
                                            return element;
                                        }
                                    });

                                    if (typeof found === 'object') {
                                        dataLayer.push({ ecommerce: null });
                                        dataLayer.push({
                                            event: 'select_item',
                                            ecommerce:{
                                                item_list_id: listingName,
                                                item_list_name: listingName,
                                                items: [{
                                                    item_id: found.productid,
                                                    item_name: found.product,
                                                    affiliation: "",
                                                    coupon: "",
                                                    discount:0,
                                                    index: products.indexOf(found),
                                                    item_brand: found.brand,
                                                    item_category: found.category,
                                                    item_list_id: listingName,
                                                    item_list_name: listingName,
                                                    item_variant: "",
                                                    location_id: "",
                                                    price: found.price,
                                                    quantity: 1
                                                }]
                                            },
                                            google_business_vertical: myBusinessVertical
                                        });
                                    }
                                }
                            }
                        });
                    });
                }
                document.addEventListener('DOMContentLoaded', productClickListingGTAG, false);

                function productAddtoCartListing(){
                    var AllElement = document.getElementsByClassName('addtocart');
                    Array.from(AllElement).forEach((el) => {
                        el.addEventListener('click', function (e) {
                            var url = new URL(this.href);
                            var productID = url.searchParams.get('productid');
                            if (!isNaN(productID) && productID != null) {
                                var found = products.find(function (element) {
                                    if (element.productid === productID) {
                                        return element;
                                    }
                                });
                                if (typeof found === 'object') {
                                    addProductToCart(found,($(this).parents(':eq(1)').find('[name="quantity"]').val() === undefined) ? 1 :$(this).parents(':eq(1)').find('[name="quantity"]').val(),"Bijuterii");
                                }
                            }
                        });
                    });
                }
                document.addEventListener('DOMContentLoaded', productAddtoCartListing, false);
                            
            document.addEventListener('click', (event) => {

                        addProductToCart(productVariant);
                    }
