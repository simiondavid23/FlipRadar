<script>self.__next_f.push([1,"\u003ch1\u003eTermeni și condiții generale de utilizare a platformei\u003c/h1\u003e\n\u003cp\u003eGeneralități\u003c/p\u003e\n\u003cp\u003ePrezentele termeni și condiții (denumite \u0026icirc;n continuare \u0026rdquo;Termeni\u0026rdquo;; \u0026rdquo;T\u0026amp;C\u0026rdquo;) reglementează utilizarea totalității serviciilor oferite prin intermediul platformei online\u0026nbsp;\u003ca href=\"https://www.casta.eu/ro\"\u003ewww.casta.eu\u003c/a\u003e, de catre entitățile afiliate grupului Casta, respectiv:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCASTA IMOBILIARE SRL\u003c/strong\u003e, avand sediul in Targu.Mures, str. Targului nr. 1, et. 1, Corp B, jud. Mures, inregistrata la Registrul Comertului cu nr. J26/702/2013, Cod Unic de Inregistrare RO 31961387, avand contul nr. IBAN : RO94BACX0000000906542001\u0026rlm; deschis la UniCredit Bank - Sucursala Targu Mures,\u003c/p\u003e\n\u003cp\u003eVă rugăm să citiți cu atenție prezentele termeni \u0026icirc;naintea utilizării platformei online Casta, prevederile acestui document fiind aplicabile tuturor persoanelor fizice și juridice care utilizează platforma iar acestea vă obliga legal.\u003c/p\u003e\n\u003cp\u003eUtilizarea Platformei de către Dvs. se realizeaza \u0026icirc;n baza acceptarii \u0026icirc;n mod expres a tuturor prevederilor conținute in prezentele Termeni, precum și garantarea faptului că ați \u0026icirc;mplinit v\u0026acirc;rsta de 18 ani, dispuneți de capacitate de exercițiu \u0026icirc;n calitate de persoană fizică, sunteți reprezentantul legal al unei societăti sau dispuneți de toate prerogativele, \u0026icirc;mputernicirile și capacitatea necesară de a angaja persoana juridica pe care o reprezentați, cu efecte obligatorii pentru toate părțile interesate. \u0026Icirc;n cazul oricăror obiecțiuni față de prevederile prezentelor Termeni, utilizarea platformei Casta este interzisă.\u003c/p\u003e\n\u003cp\u003ePolitica noastră privind protecția datelor cu caracter personal, precum și aspectele viz\u0026acirc;nd clauzele de confidențialitate sunt \u0026icirc;ncorporate prin referință \u0026icirc;n prezentele Termeni și Condiții, iar respectivele prevederi coroborate cu termenii și condițiile de utilizare constituie \u0026icirc;n integralitatea lor și vor fi denumite \u0026icirc;n continuare \u0026ldquo;Acordul\u0026rdquo;\u003c/p\u003e\n\u003cp\u003eCasta \u0026icirc;și rezervă dreptul de a revizui oric\u0026acirc;nd prezentele Termeni și condiții generale de utilizare, eventualele modificări intr\u0026acirc;nd \u0026icirc;n vigoare și devenind aplicabile din momentul actualizării acestora pe Platforma. Utilizarea serviciilor Casta ulterior implementării unor amendamente constituie acceptul asupra prevederilor modificate. Prin urmare, vă recomandam să verificati periodic Termenii si condițiile de utilizare precum și politica privind protecția datelor cu caracter personal și confidențialitate pentru a fi informați despre eventualele modificări implementate.\u003c/p\u003e\n\u003cp\u003ePentru orice detalii legate de serviciile, respectiv de platforma\u0026nbsp;\u003cu\u003ewww.casta.eu ,\u003c/u\u003e\u0026nbsp;ne puteți contacta cu \u0026icirc;ncredere numărul de telefon 031-122-7088, respectiv la următoarea adresa de email:\u0026nbsp;\u003ca href=\"mailto:contact@casta.eu\"\u003econtact@casta.eu\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eTermeni si Definiții\u003c/p\u003e\n\u003cp\u003eUtilizator = orice persoană fizică sau juridică care accesează și \u0026icirc;și \u0026icirc;nregistrează un cont aferent pe platforma online Casta\u003c/p\u003e\n\u003cp\u003ePartener = Agent imobiliar sau Agentia imobiliara care furnizeaza servicii utilizatorilor in numele Casta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eServiciile furnizate de Casta pentru utilizatori pot include diverse servicii de promovare imobiliara:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- publicarea anunțului de v\u0026acirc;nzare/chirie pe platforma proprie,\u0026nbsp;\u003ca href=\"https://www.casta.eu/ro\"\u003ewww.casta.eu,\u003c/a\u003e\u0026nbsp;promovarea acestuia pe platforme terțe, consultanța cu ocazia negocierilor legate de \u0026icirc;nstrăinarea imobilului precum și in cadrul perfectării formalitaților legate de transferul de proprietate al imobilului de catre Casta sau Parteneri; asistența tip call-center, oferte de achizitie de imobil și evaluarea imobilelor supuse v\u0026acirc;nzarii catre terți, asistență \u0026icirc;n realizarea de fotografii imobilelor supuse v\u0026acirc;nzarii, asistență cu ocazia vizionării imobilelor rezervate prin serviciile Casta, consultanta in vederea obtinerii unui credit imobiliar.\u003c/p\u003e\n\u003cp\u003e- tranzacțiilei imobiliare proprii, const\u0026acirc;nd \u0026icirc;n achiziții și \u0026icirc;nstrăinări de imobile cu utilizatorii platformei Casta. Tranzacțiile imobiliare realizate prin intermediul serviciilor Casta \u0026icirc;n care Casta este parte contractantă vor respecta prevederile regimul juridic al imobilelor \u0026icirc;n proprietate privată precum și cele necesare \u0026icirc;n ceea ce privește publicitatea imobiliară, cuo ocazia perfectării transferului de proprietate ale acestora.\u003c/p\u003e\n\u003cp\u003eBeneficiar = orice persoană fizică sau juridică care deține relații comerciale cu Casta, \u0026icirc;n calitate de:\u003cbr /\u003ea.) \u0026ldquo;V\u0026acirc;nzator\u0026rdquo;/\u0026rdquo;Locator\u0026rdquo; al unui spațiu imobiliar cu destinație de locuință (apartament bloc, casă etc.)\u003cbr /\u003eb.) \u0026rdquo;Cumpărător\u0026rdquo;/\u0026rdquo;Chiriaș\u0026rdquo; unui imobil, conform cererii sale de achizitie \u0026icirc;nregistrat pe platformă\u003cbr /\u003eBeneficiarul este titular al contului \u0026icirc;nregistrat pe platforma online\u0026nbsp;\u003ca href=\"https://www.casta.eu/ro\"\u003ewww.casta.eu,\u003c/a\u003e\u0026nbsp;al cărui anunț de v\u0026acirc;nzare/cumpărare este publicat și promovat pe platforma mai sus menționată.\u003c/p\u003e\n\u003cp\u003ePartener= reprezentant al Casta, desemnat \u0026icirc;n vederea prestării Pachetului de Servicii Casta, conform celor prevăzute mai sus\u003c/p\u003e\n\u003cp\u003eAnunțul de v\u0026acirc;nzare/inchiriere = anunțul supus de V\u0026acirc;nzator spre publicare pe platforma Casta, av\u0026acirc;nd ca obiect \u0026icirc;nstrăinarea/\u0026icirc;nchirierea unui imobil cu destinația de locuință, conțin\u0026acirc;nd descrierea acestuia, conform funcționalităților existente pe platforma. Imobilul oferit către v\u0026acirc;nzare poate fi achitat at\u0026acirc;t de cumpărători terți, c\u0026acirc;t și de către Casta, conform domeniului său de activitate.\u003c/p\u003e\n\u003cp\u003eEvaluare imobil = evaluarea cu caracter estimativ al prețului apartamentului publicat spre v\u0026acirc;nzare, \u0026icirc;ntocmit de Casta \u0026icirc;n baza informațiilor furnizate de solicitant, raportul de evaluare fiind realizat prin utilizarea mijloacelor de analiză internă ale Casta. Prin solicitarea unei evaluari al imobilului, utilizatorul \u0026icirc;și dă acordul cu privire la publicarea v\u0026acirc;nzării pe platformă.\u003c/p\u003e\n\u003cp\u003eTarife și comisioane de succes Casta = remunerația procentuală sau fixă, percepută de Casta pentru serviciile sale agenție imobiliară, precum și orice alt tip de serviciu auxiliar prestart pe platforma\u0026nbsp;\u003ca href=\"http://www.casta.eu/\"\u003ewww.casta.eu\u003c/a\u003e\u0026nbsp;ce se va percepe de către Casta sau de Partener, după caz, \u0026icirc;n mod direct de la Beneficiar, conform condițiilor fiecarui tip de serviciu prestat. Comisionul de succes procentual se va calcula față de valoarea efectivă al \u0026icirc;nstrăinării acordat, conform celor evidențiate \u0026icirc;n contractul de v\u0026acirc;nzare-cumpărare și nu față de prețul \u0026icirc;ndicat \u0026icirc;n anunțul publicat pe platforma\u0026nbsp;\u003ca href=\"https://www.casta.eu/ro\"\u003ewww.casta.eu.\u003c/a\u003e\u0026nbsp;Tarifele și comisioanele actualizate ale platformei se regăsesc \u0026icirc;n secțiunea de oferte ale platformei, acestea put\u0026acirc;nd fi actualizate periodic conform politicilor comerciale ale Casta, eventualele modificari neav\u0026acirc;nd caracter retroactiv\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDescrierea serviciilor\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eCasta este o platformă dedicată serviciilor imobiliare ce ofera posibilitatea utilizatorilor de a publica anunțuri de v\u0026acirc;nzare, de a rezerva pe o perioadă limitată imobilele supuse v\u0026acirc;nzării pe platformă, de a solicita oferte de v\u0026acirc;nzare, de a viziona imobileimobile in, de a vinde direct către Casta, sau de a achiziționa direct de la Casta imobile, precum și de a \u0026icirc;n schimbul unei remunerații de succes plătibil \u0026icirc;n cazul perfectionării formalităților de transfer al imobilului \u0026icirc;nstrăinat conform definițiilor de mai sus. Anunțurile de v\u0026acirc;nzare, vor conține adresa și descrierea imobilului, conform funcționalităților existente pe platforma.\u003c/p\u003e\n\u003cp\u003ePrin activarea oricărui pachet de servicii, utilizatorul va putea beneficia de pachetul de servicii pus la dispozitie de Casta conform disponibilității acestora. Conform opțiunii V\u0026acirc;nzătorului, acestea are posibilitatea de a solicita o ofertă de cumpărare directă de la Casta, transmiterea unei oferte \u0026icirc;n acest sens, răm\u0026acirc;n\u0026acirc;nd la latitudinea exclusivă a Casta.\u003c/p\u003e\n\u003cp\u003eSERVICII PENTRU V\u0026Acirc;NZĂTORI/LOCATORI\u003c/p\u003e\n\u003cp\u003ePrin activarea serviciului, v\u0026acirc;nzătorul/locatorul oferă un mandat către Casta, sau Partenerii acestuia pentru a intermedia, in conditii de exclusivitate al pretului, pe o perioadă de 30 zile calendaristice, vanzarea-cumpărarea/\u0026icirc;nchirierea Imobilului supus v\u0026acirc;nzării/\u0026icirc;nchirierii, și publicat pe platforma\u0026nbsp;\u003ca href=\"http://www.casta.eu/\"\u003ewww.casta.eu\u003c/a\u003e, conform ofertei de preț indicativ furnizat de Casta \u0026icirc;n acest sens.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCu ocazia activării serviciului pentru v\u0026acirc;nzători, \u0026icirc;n baza acceptării ofertei de preț propusă de Casta \u0026icirc;n ceea ce privește evaluarea imobilului, V\u0026acirc;nzătorulului i se aplică următorul plan tarifar:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePachet tarifar 100 EUR:\u0026nbsp;\u003c/strong\u003eprin alegerea acestui pachet, V\u0026acirc;nzătorul se obligă la achitarea sumei de\u0026nbsp;\u003cstrong\u003e100 EUR cu TVA inclus către\u003c/strong\u003e\u0026nbsp;Casta la momentul semnarii contractului de reprezentare, suma reprezent\u0026acirc;nd tariful fix al serviciilor, V\u0026acirc;nzătorul neav\u0026acirc;nd alte obligații de plată viitoare față de Casta. Astfel prin activarea pachetului de servicii, și achitarea tarifului fix, V\u0026acirc;nzătorul mandatează Casta \u0026icirc;n vederea identificării unui cumpărător al imobilului supus v\u0026acirc;nzării conform ofertei de evaluare transmisă anterior de Casta \u0026icirc;n acest sens. \u0026Icirc;n ipoteza \u0026icirc;n care Casta nu va identifica un cumpărător \u0026icirc;n termenul de exclusivitate de 30 zile de la data activării serviciului, V\u0026acirc;nzătorul va fi \u0026icirc;ndreptățit să solicite restituirea sumei achitate către Casta, sau către Partenerii săi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCu ocazia activării serviciului pentru locatori, acestora se aplică un plan tarifar de 50 EUR:\u003c/strong\u003e\u003cstrong\u003ecu TVA\u003c/strong\u003e inclus, fiind aplicabile condițiile de realizare de mai sus pentru pachetul de servicii pentru v\u0026acirc;nzatori \u0026icirc;n ceea ce privește tariful fix, mandatarea Casta pentru identificarea unui Chiriaș, precum și termenul de exclusivitate, respectiv de restituire \u0026icirc;n caz de nerealizare a serviciilor activate.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003ePrin alegerea pachetelui de servicii de mai sus, V\u0026acirc;nzătorul/Locatorul se obligă la următoarele:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea.) sa detina dreptul de proprietate asupra imobilului mai sus mentionat, sau sa fie reprezentantul legal imputernicit de proprietar in vederea instrainarii/\u0026icirc;nchirierii bunului, iar imobilul supus instrăinarii/\u0026icirc;nchirierii trebuie sa aiba regimul proprietatii clar definit,\u003c/p\u003e\n\u003cp\u003eb.) sa puna la dispozitia Casta toate informatiile, documentele, planurile de situatie ce-i sunt necesare in vederea intermedierii vanzarii-cumpararii/\u0026icirc;nchirierii imobilului, precum și cele necesare legate de transferul proprietății, prin intermediul platformei online\u0026nbsp;\u003ca href=\"http://www.casta.eu/\"\u003ewww.casta.eu\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003ec.) sa plateasca prețul serviciilor in conditiile de mai sus, chiar și \u0026icirc;n ipoteza \u0026icirc;n care transferul dreptului de proprietate/\u0026icirc;nchirierea nu s-ar materializa din propria sa culpă, precum și \u0026icirc;n cazul \u0026icirc;n care refuză \u0026icirc;nchierea contractului de v\u0026acirc;nzare-cumpărare/\u0026icirc;nchiriere cu cumpărătorul/chiriașul identificat pentru motive discreționare. \u0026Icirc;n cazul refuzului de a \u0026icirc;nstrăina/\u0026icirc;nchiria imobilul către un cumpărător/chiriaș identificat de Casta, dispus să achite prețul conform ofertei de v\u0026acirc;nzare/\u0026icirc;nchiriere, V\u0026acirc;nzătorul va avea obligația achitării către Casta unei sume cu titlu de daune interese in valoare de 100 EUR, daunele interese aplicabile Locatorului fiind de 50 EUR.\u003c/p\u003e\n\u003cp\u003ed.\u003cstrong\u003e)\u0026nbsp;\u003c/strong\u003esa fie prezent sau sa imputerniceasca o persoana la solicitarea Casta pentru vizionarea imobilului ce face obiectul prezentului contract, sa permită accesul reprezentantului Casta \u0026icirc;n incinta imobilului precum și efectuarea unei note de inventar, incluz\u0026acirc;nd fotografii, privind starea imobilului precum și dotările, respectiv accesoriile sale. Prevederile prezentului articol nu sunt aplicabile imobilelor supuse \u0026icirc;nchirierii\u003c/p\u003e\n\u003cp\u003ee.) sa aiba intreaga capacitate de exercitiu si sa poata dispune fara nici o ingradire asupra bunului imobil\u003c/p\u003e\n\u003cp\u003ef.) să acorde pe o perioada de 30 zile de la data activării pachetului de servicii ales un drept de reprezentare exclusiva catre Casta, respectiv catre partenerul desemnat de acesta in vederea prestarii serviciilor sale. In sensul prezentelor prevederi, Vanzatorul/Locatorul nu are o interdictie de a instraina/da \u0026icirc;n chirie imobilul prin alte mijloace sau prin intermediul altor terti, insa in cazul in care transferul de proprietate prin vanzare, sau \u0026icirc;nchirierea imobilului, după caz, se va realiza in acest termen, sau se va \u0026icirc;ncheia o promisiune de v\u0026acirc;nzare-cumpărare privind \u0026icirc;nstrăinarea imobilului, V\u0026acirc;nzatorul/Locatorul va avea obligatia achitarii Pachetului tarifar ales, chiar si in ipoteza in care vanzarea/\u0026icirc;nchirierea se realizeaza prin evitarea de catre V\u0026acirc;nzător/Locator a serviciilor puse la dispozitie de catre Casta, sau prin intermediul unor terti. In acest sens, V\u0026acirc;nzătorul/Locatorul se angajeaza ca in cazul in care va promova şi vinde/\u0026icirc;nchiria proprietatea sus menționată \u0026icirc;n perioada de exclusivitate singur sau printr-un alt intermediar, pretul indicat al imobilului sa fie cu cel putin minim 5% mai mare fata de cel stabilit in contractual cu\u0026nbsp;\u003cstrong\u003eCASTA IMOBILIARE SRL\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVanzatorul/Locatorul declara si garanteaza urmatoarele:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003ea.) detine capacitatea necesara publicarii anuntului de instrainare/\u0026icirc;nchiriere al imobilului, avand calitatea fie de proprietar exclusiv, fie cel de coproprietar, imputernicit sau mandatar, obtinand acordul proprietarului in vederea reprezentarii intereselor acestuia in ceea ce priveste relatia comerciala cu Casta, precum a beneficierii de serviciile aferente formalitatilor necesare instrainarii/\u0026icirc;nchirierii bunului.\u003c/p\u003e\n\u003cp\u003eb.) imobilul supus vanzarii/\u0026icirc;nchirierii prin intermediul serviciilor Casta corespunde informatiilor furnizate de Vanzator/Locator si nu este grevat de sarcini, totodata nu exista orice alte impedimente juridice ce ar putea impiedica transferul dreptului de proprietate/\u0026icirc;nchiriere a bunului.\u003c/p\u003e\n\u003cp\u003eCasta isi rezerva dreptul de a verifica prin mijloace proprii indeplinirea garantiilor si conditiilor prevazute mai sus. In acest sens, in termen de 5 zile lucratoare de la data validarii anuntului de vanzare/\u0026icirc;nchiriere, Vanzatorul/Locatorul are obligatia de a transmite catre Casta prin corespondenta electronica o copie dupa documentele care atesta veridicitatea informatiilor furnizate (extras de carte functiara, procura speciala, mandat etc.).\u003c/p\u003e\n\u003cp\u003eIn cazul in care Vanzatorul/Locatorul nu isi indeplineste obligatiile prevazute mai sus si nu poate face dovada indeplinirii conditiilor prevazute mai sus, Casta isi rezerva dreptul conform optiunii sale sa procedeze la urmatoarele:\u003c/p\u003e\n\u003cp\u003ea.) incetarea serviciilor furnizate, blocarea automata a contului de utilizator si revocarea anuntului de vanzare/\u0026icirc;nchiriere, fara nici o notificare prealabila, cu decaderea dreptului Vanzatorului/Locatorului de a pretinde restituirea oricăror sume achitate p\u0026acirc;na la acel moment către Casta\u003c/p\u003e\n\u003cp\u003eb.) obligarea Vanzatorului/Locatorului la achitarea tarifelor sale, in cazul in care se constata existenta unor manopere dolosive avand scopul de a frauda interesele Casta.\u003c/p\u003e\n\u003cp\u003eSERVICII PENTRU CUMPĂRĂTORI/CHIRIAȘI\u003c/p\u003e\n\u003cp\u003ePrin activarea serviciului, Cumpărătorul/Chiriașul oferă un mandat către Casta, sau Partenerii acestuia pentru a identifica și de a intermedia, in conditii de exclusivitate, pe o perioadă de 30 zile calendaristice, vanzarea-cumpărarea/\u0026icirc;nchirierii unui imobil supus v\u0026acirc;nzării/chiriei pe platforma\u0026nbsp;\u003ca href=\"http://www.casta.eu/\"\u003ewww.casta.eu\u003c/a\u003e,\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCu ocazia activării serviciului, Cumpărătorului i se aplică următorul plan tarifar, conform celor de mai jos:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePachet tarifar 100 EUR cu TVA inclus:\u0026nbsp;\u003c/strong\u003eprin alegerea acestui pachet, Cumpărătorul va avea posibilitatea rezervării achiziției unui imobil supus v\u0026acirc;nzării pe platforma\u0026nbsp;\u003ca href=\"http://www.casta.eu/\"\u003ewww.casta.eu\u003c/a\u003e, pe o perioadă de 7 zile calendaristice de la data achitării tarifului de activare a pachetului. \u0026Icirc;n perioada rezervării, Cumpărătorul va avea posibilitatea vizionării imobilului rezervat \u0026icirc;mpreună cu reprezentanții Casta, conform unei programări prealabile efectuate prin intermediul platformei. \u0026Icirc;n cazul \u0026icirc;n care \u0026icirc;n termenul de cele 7 zile calendaristice de la data activării pachetului de servicii, Cumpărătorul nu va mai avea interesul achizitionării imobilului rezervat, acesta va avea dreptul să solicite restituirea tarifului achitat \u0026icirc;n acest sens.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCu ocazia activării serviciului pentru chiriași\u003c/strong\u003e, acestora se aplică un plan tarifar de \u003cstrong\u003e50 EUR cu TVA inclus\u003c/strong\u003e, fiind aplicabile condițiile de realizare de mai sus pentru pachetul de servicii pentru cumpărători \u0026icirc;n ceea ce privește tariful fix, rezervarea unui imobil supus \u0026icirc;nchirierii, precum și termenul de exclusivitate, respectiv de restituire \u0026icirc;n caz de nerealizare a serviciilor activate.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e\u0026Icirc;n prestarea pachetelor de servicii, at\u0026acirc;t pentru V\u0026acirc;nzători/Locatori c\u0026acirc;t și Cumpărători/Chirași, Casta va avea următoarele obligatii și atribuțiuni:\u003c/strong\u003e\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003ea) sa utilizeze baza sa de date de potentiali clienti si sa faca toate diligentele pe care le considera necesare pentru indeplinirea serviciilor, prin intermediul platformei www.casta.eu si a celorlalte site-uri de specialitate, precum si prin metode clasice de promovare, fie direct, fie prin intermediul unui Partener Casta, abilitat in acest scop.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eb.) să acționeze \u0026icirc;n calitate de reprezentant al Beneficiarului, și să presteze servicile sale de agenție, incluz\u0026icirc;nd identificarea de v\u0026acirc;nzători/cumpărători, \u0026icirc;ndrumare și intocmire de documente necesare perfectării formalităților privind transferul de proprietate, etc.\u003c/p\u003e\n\u003cp\u003ec.) să indisponibilizeze pe platformă toate imobilele rezervate de cumpărători de la \u0026icirc;nstrăinare, pe durata valabilității rezervării\u003c/p\u003e\n\u003cp\u003ed.) conform opțiunii sale, sa desemneze un partener in vederea realizarii activitatilor de intermediere a tranzactiei imobiliare\u003c/p\u003e\n\u003cp\u003ee.) la solicitarea Clientului sa-l informeze pe acesta asupra potentialilor clienti interesati si sa-i puna la dispozitie acestuia informatiile referitoare la vizitele avute cu acestia;\u003c/p\u003e\n\u003cp\u003ef.) la solicitarea Clientului sa-l asiste pe acesta la incheierea contractului de vanzare-cumparare pentru imobile;\u003c/p\u003e\n\u003cp\u003eBeneficiarii \u0026icirc;și dau acordul ca documentele aferente colaborarii (contracte, notificari, facturi fiscale, etc) sa fie transmise prin corespondenta electronica, catre adresa de email furnizata pe platforma\u0026nbsp;\u003ca href=\"https://www.casta.eu/ro/\"\u003ewww.casta.eu\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCosturi de tranzacționare, impozite și taxe\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eV\u0026acirc;nzătorul va avea obligația achitării oricăror taxe referitoare la documentele necesare perfectării vanzarii apartamentului așa cum sunt ele reglementate de legea rom\u0026acirc;nă, precum și orice alte costuri suplimentare de tranzacționare, conform practicilor \u0026icirc;n acest domeniu. Aceste cheltuieli pot include \u0026icirc;n mod nelimitativ costuri de rambursare anticipată a \u0026icirc;mprumuturilor, taxe de transfer, taxe de \u0026icirc;nregistrare, onorarii de avocat, drepturi de garanție sau hotăr\u0026acirc;ri \u0026icirc;mpotriva imobilului., cotizații proporționale ale asociației de proprietari și / impozite sau utilitati pe proprietate datorate p\u0026acirc;nă la data \u0026icirc;ncheierii contractului de v\u0026acirc;nzare-cumpărare. \u0026Icirc;n cazul pre-existenței unui contract de reprezentare cu prevederi de exclusivitate \u0026icirc;ncheiat de v\u0026acirc;nzător cu un alt agent imobiliar, v\u0026acirc;nzătorul va fi responsabil pentru acoperirea oricăror cheltuieli legate de respectiva relație, Casta neaccept\u0026acirc;nd să achite comisioane terților, cu excepția cazului \u0026icirc;n care relația respectivă este divulgată de v\u0026acirc;nzător anterior efectuării tranzacției, iar Casta acceptă o derogare de la propriile sale proceduri \u0026icirc;n acest sens.\u003c/p\u003e\n\u003cp\u003e.\u003c/p\u003e\n\u003cp\u003eServicii auxiliare\u003c/p\u003e\n\u003cp\u003ePrin intermediul platformei Casta, utilizatorii \u0026icirc;nregistrați pot beneficia de servicii auxiliare puse la dispoziție \u0026icirc;n măsura disponibilităților acestora, cum ar fi intermedierea de credite bancare. Prin cererea de ofertă de credit utilizatorilor li permite sa transmita datele de contact, impreuna cu diverse informatii privind situatia personala si financiara (conform cerintelor partenerilor comerciali ai Casta) catre institutiile financiare partenere, in vedere obtinerii unui oferte de credit.\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;nregistrare cont de utilizator\u003c/p\u003e\n\u003cp\u003eUtilizarea serviciilor Casta se poate realiza prin intermediul unui cont personalizat \u0026icirc;nregistrat pe platforma \u0026icirc;n baza unui nume de utilizator și parolă unică, \u0026icirc;n urmatoarele etape:\u003c/p\u003e\n\u003cp\u003ea.) cu ocazia \u0026icirc;nregistrarii contului, veți avea obligația să ne furnizați numele, prenumele, adresa de email precum și numarul de telefon.\u003c/p\u003e\n\u003cp\u003eb.) \u0026icirc;n cazul publicarii unui anunț de v\u0026acirc;nzare /, utilizatorul \u0026icirc;și va furniza pe platformă datele de facturare, precum și locația imobilului publicat spre v\u0026acirc;nzare\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;n cadrul procedurii de \u0026icirc;nregistrare, Casta va avea access și va prelucra datele cu privire la adresa de IP ale utilizatorilor.\u003c/p\u003e\n\u003cp\u003eObligații la \u0026icirc;nregistrare\u003c/p\u003e\n\u003cp\u003ePentru a folosi serviciile oferite de Casta la \u0026icirc;nregistrarea contului utilizatorii au următoarele obligații:\u003c/p\u003e\n\u003cp\u003e1) furnizarea datelor adevarate, exacte și complete, conform formularului de \u0026icirc;nregistrare pus la dispoziție de Casta;\u003c/p\u003e\n\u003cp\u003e2) menținerea și după caz actualizarea atunci c\u0026acirc;nd situația o cere, a datelor de \u0026icirc;nregistrare pentru a fi adevarate, exacte și complete.\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;n cazul furnizării unor informații care nu sunt conforme cu realitatea, inexacte sau incomplete, Casta Imobiliare SRL are dreptul să suspende sau să desfiinteze contul utilizatorului și să refuze toate \u0026icirc;ncercările curente sau viitoare de folosire a platformei www.casta.eu\u003c/p\u003e\n\u003cp\u003eCasta \u0026icirc;și rezervă dreptul unilateral de a efectua prin mijloace proprii o procedură de filtrare a tuturor utilizatorilor anterior aprobării contului (verificarea antecedentelor, interacțiune personală, efectuarea de corespondență, interviuri prin telefon sau alte mijloace de comunicare, etc.).\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;n cazul \u0026icirc;n care \u0026icirc;n cadrul procedurii de filtrare reprezentanții Casta consideră oportun, aceștia pot proceda oric\u0026acirc;nd la refuzarea contului supus spre aprobare, fără vreo notificare prealabilă și fără a avea obligația motivării deciziei.\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;nregistrare și condiții pentru persoane juridice\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;n urma \u0026icirc;nregistrării unui cont de catre o persoana juridica, reprezentanților acestora li se va solicita furnizarea unor informații valide cu privire la denumirea, datele de facturare, precum și informații privind informatii bancare.\u003c/p\u003e\n\u003cp\u003eCasta \u0026icirc;și rezervă dreptul de a efectua o procedură de filtrare a Companiei, și poate proceda oric\u0026acirc;nd la refuzarea unui cont aflat \u0026icirc;n curs de aprobare, fără vreo notificare prealabilă și fără a avea obligația motivării deciziei.\u003c/p\u003e\n\u003cp\u003eRăspunderea Casta\u003c/p\u003e\n\u003cp\u003ePrin furnizarea serviciilor sale, Casta nu \u0026icirc;și asuma răspundere cu privire la perfectarea transferurilor de proprietate asupra imobilelor publicate pe platforma sa, acțion\u0026acirc;nd ca factor pasiv \u0026icirc;n relația părților.\u003c/p\u003e\n\u003cp\u003eCasta nu deține control și prin urmare nu-și asuma nici o răspundere asupra calității, legalității, viciilor aparente sau ascunse, sau orice alte aspect legate de conținutul anunțurilor de v\u0026acirc;nzare, precum și nici asupra imobilelor publicate pe platformă, precum nici asupra integrității, responsabilității sau ale oricăror acțiuni sau omisiuni de orice natură ale utilizatorilor.\u003c/p\u003e\n\u003cp\u003eCasta nu \u0026icirc;și asumă răspunderea pentru acuratețea sau veridicitatea oricăror informații transmise de Utilizatori \u0026icirc;n cadrul folosirii serviciilor pe platforma.\u003c/p\u003e\n\u003cp\u003eSpecialistii imobiliari, acțion\u0026acirc;nd \u0026icirc;n calitate de reprezentanți ai Casta, vor raspunde profesional și delictual civil față Casta \u0026icirc;n ceea ce privește activitatea acestora \u0026icirc;n raporturile cu beneficiarii serviciilor.\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;n cazul interacțiunii utilizatorilor, este recomandat ca aceștia să exercite precauție și rezonabilitate \u0026icirc;n vederea protejării drepturilor personale și patrimoniale.\u003c/p\u003e\n\u003cp\u003eCasta și societățile sale afiliate nu \u0026icirc;și asumă nici o răspundere pentru comportamentul utilizatorilor \u0026icirc;n cadrul serviciilor prestate, at\u0026acirc;t \u0026icirc;n mediul online c\u0026acirc;t și cel offline.\u003c/p\u003e\n\u003cp\u003eCasta nu iși asuma răspunderea cu privire la orice pretenții derivate din eventuale litigii născute \u0026icirc;ntre terți \u0026icirc;n ceea ce privește imobilele publicate spre v\u0026acirc;nzare pe platformă, ce ar putea viza prejudicii, daune compensatorii, clauze penale, vicii de orice natură, cunoscute sau necunoscute, ascunse sau vizibile, publice sau nepublice, aflate \u0026icirc;n legatură cu asemenea litigii.\u003c/p\u003e\n\u003cp\u003eProtecția Datelor cu Caracter Personal\u003c/p\u003e\n\u003cp\u003eCasta Imobiliare SRL este responsabila pentru prelucrarea datelor cu caracter personal furnizate pe platforma Casta, prin serverele sale dedicate acestei operațiuni.\u003c/p\u003e\n\u003cp\u003eCasta va colecta și va prelucra datele cu caracter personal furnizate de Utilizatorii serviciilor, aceste date incluz\u0026acirc;nd \u0026icirc;n principal dar nerestrictiv următoarele: numele, denumirea și datele de identificare ale persoanelor fizice și juridice, datele de contact, date bancare curente, de profil ale Utilizatorilor, adrese de email, etc.\u003c/p\u003e\n\u003cp\u003eNota de informare cu privire la protectia datelor cu caracter personal se coroboreaza cu prevederile prezentului document, put\u0026acirc;nd fi accesata la\u0026nbsp;\u003ca href=\"https://www.casta.eu/ro/politica-de-confidentialitate\"\u003ehttps://www.casta.eu/ro/politica-de-confidentialitate\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eSpațiul Public și Confidențialitatea\u003c/p\u003e\n\u003cp\u003eServiciile furnizate de Casta pot include profiluri, sisteme de email, bloguri, mesagerie, aplicații, anunțuri de recrutare, spații de chat, \u0026icirc;nștiintări colective, forumuri, comunități precum și alte platforme de comunicare care facilitează interacțiunea \u0026icirc;ntre Utilizatori. Aceste spații pot fi folosite \u0026icirc;n mod exclusiv pentru transmiterea și recepția unor conținuturi relevante \u0026icirc;n scopul destinat respectivelor platforme.\u003c/p\u003e\n\u003cp\u003eActivitati interzise pe platforma\u003c/p\u003e\n\u003cp\u003eSunt interzise \u0026icirc;n mod nelimitativ următoarele activități:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003edefăimarea, abuzul, hărțuirea, urmărirea, amenințarea, lezarea incălcarea drepturilor altor persoane (de ex. dar in mod nelimitativ drepturile de viață privată și de imagine publică)\u003c/li\u003e\n\u003cli\u003epublicarea, \u0026icirc;ncărcarea distribuirea sau diseminarea oricărui conținut cu caracter obscen, defăimator, sau ilicit prin natura, sa.\u003c/li\u003e\n\u003cli\u003eutilizarea serviciilor Casta \u0026icirc;n scopuri care contravin reglementărilor legale la nivel local, national sau international, precum si in orice alte scop decat cele stabilite de Casta\u003c/li\u003e\n\u003cli\u003epublicarea unor fișiere care conțin aparatură soft sau orice alt material ce \u0026icirc;ncalcă drepturile de proprietate intelectuală (sau de orice altă natura) ale terților\u003c/li\u003e\n\u003cli\u003epublicarea unor fișiere care conțin viruși, viermi sau alte programe cu intenția de a distruge sau de a dăuna orice sistem sau informație;\u003c/li\u003e\n\u003cli\u003epublicitatea sau oferirea oricăror produse sau servicii pentru scopuri comerciale prin platforma, altele dec\u0026acirc;t cele oferite prin serviciul Casta\u003c/li\u003e\n\u003cli\u003epromovarea unor chestionare, concursuri, jocuri piramidale sau corespondență tip \u0026rdquo;chain letter\u0026rdquo;\u003c/li\u003e\n\u003cli\u003epublicarea aceluiași conținut \u0026icirc;n mod repetat (spamming) este strict interzisă\u003c/li\u003e\n\u003cli\u003edescărcarea oricărui tip de conținut \u0026icirc;ncarcat de un alt Utilizator, despre care se poate prezuma \u0026icirc;n mod rezonabil că distribuirea sa prin serviciul Casta este ilicită.\u003c/li\u003e\n\u003cli\u003erestricționarea sau obstrucția utilizării platformei de către alte persoane. Insinuarea sau afirmarea faptului ca orice afirmații pe care le faceți sunt garantate de Casta , \u0026icirc;n lipsa acordului prealabil manifestat \u0026icirc;n scris de către Casta\u003c/li\u003e\n\u003cli\u003eutilizarea unor sisteme manuale sau automatizate \u0026icirc;n vederea colectării ilicite a datelor, copierii informațiilor sau al indexării serviciilor\u003c/li\u003e\n\u003cli\u003eatacarea cibernetică a Serviciului, ale serverelor sau ale rețelelor aferente\u003c/li\u003e\n\u003cli\u003eadaptarea alterarea, licențierea, sub-licențierea sau traducerea Serviciului pentru uz personal sau \u0026icirc;n scopuri comerciale\u003c/li\u003e\n\u003cli\u003erevocarea sau alterarea vizuală sau \u0026icirc;n alt mod ale mărcilor, respectiv ale bunurilor protejate prin drepturi de autor, sau ale oricăror bunuri aflate \u0026icirc;n patrimoniul Casta\u003c/li\u003e\n\u003cli\u003e\u0026icirc;ncărcarea de material cu conținut jignitor, sau dăunător, \u0026icirc;ncluz\u0026acirc;nd \u0026icirc;n mod nerestrictiv conținut ce pledează \u0026icirc;n favoarea, \u0026icirc;nstigă sau promoveză rasismul, intoleranța religioasă, ura sau agresiunea fizică \u0026icirc;mpotriva altor indivizi sau grupuri de persoane.\u003c/li\u003e\n\u003cli\u003epublicarea de conținut sau furnizarea accesului la conținuturi ce exploatează minorii \u0026icirc;n mod abuziv, violent sau sexual.\u003c/li\u003e\n\u003cli\u003efolosirea materialul obtinut prin intermediul platformei Casta in scopuri concurentiale\u003c/li\u003e\n\u003cli\u003epostarea, difuzarea sau transmite orice alt material care contravine, in orice fel, normelor legale in vigoare.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCasta nu va fi responsabil pentru acțiunile terților \u0026icirc;n legatură cu orice material sau conținut publicat pe platforma, iar in cazul constatarii incalcarii obligatiilor mai sus mentionate, isi rezerva dreptul unilateral de a indeparta orice continut ce contravine acestor prevederi, precum si de a bloca accesul la platforma, respectiv de a refuza prestarea serviciilor catre persoanele aflate in culpa. Totodata, Casta isi rezerva dreptul de a se indrepta impotriva tuturor persoanelor ce s-ar afla vinovate de cauzarea unor prejudicii societatii, prin incalcarea obligatiilor de mai sus.\u003c/p\u003e\n\u003cp\u003eContul, Parola, Securitatea si Utilizarea Contului\u003c/p\u003e\n\u003cp\u003eUtilizatorul este singura persoană autorizată sa utilizeze contul său, fiind unica parte responsabilă pentru menținerea confidențialității oricărei parole sau număr de cont furnizat de Casta \u0026icirc;n vederea accesării serviciilor.\u003c/p\u003e\n\u003cp\u003eUtilizatorul este unica parte responsabilă pentru toate activitătile ce se desfășoară din contul și parolele sale. Casta nu deține controlul asupra utilizării conturilor și \u0026icirc;și declina orice responsabilitate fată de activitățile derivate \u0026icirc;n urma utilizărilor. \u0026Icirc;n cazul existenței unor suspiciuni față de utilizarea neautorizată din partea unor terți ale parolelor sau conturilor, precum și indicii asupra oricăror \u0026icirc;ncalcări ale sistemelor de securitate, utilizatorul isi asuma obligatia de a notifica de indata Casta despre aceste aspecte.\u003c/p\u003e\n\u003cp\u003ePrin furnizarea numărului de telefonie mobila precum și prin utilizarea platformei, persoana vizata \u0026icirc;și da acordul expres pentru Casta in vederea transmiterii unor mesaje și inițierea de convorbiri telefonice \u0026icirc;n vederea imbunătățirii serviciilor oferite. Casta nu va taxa costul acestor convorbiri sau mesaje, \u0026icirc;nsă taxe standard impuse de rețelele mobile se pot aplica.\u003c/p\u003e\n\u003cp\u003eLinkuri către alte Platforme/Pagini web\u003c/p\u003e\n\u003cp\u003eFurnizarea de linkuri de pe Casta către alte pagini web sau alte platforme nu constituie o recomandare din partea Prestatorului privind respectivele platforme sau conținutul acestora, linkurile mai sus menționate fiind furnizate doar cu scop informativ și spre referință. Casta nu deține controlul acestor platforme terțe și nu garantează sau \u0026icirc;si asumă orice fel de răspundere fată de conținutul acestora. Existența unor asemenea linkuri (incluz\u0026acirc;nd și reclame) nu reprezintă recomandarea Casta asupra conținutului acestora și nu implică vreo asociere față de operatorii respectivelor platforme. Evaluarea conținutului și utilității paginilor web terțe revine \u0026icirc;n sarcina utilizatorilor.\u003c/p\u003e\n\u003cp\u003eUtilizarea oricăror pagini web deținute sau operate de terțe persoane este reglementată de termenii și conditiile de utilizare ale respectivelor platforme, și nu de catre Casta. Utilizatorii pot accesa respectivele platforme terte pe propria lor răspundere. Casta \u0026icirc;si declina orice răspundere legată de accesarea și utilizarea precum și fată de conținutul platformelor ter \u0026icirc;n integralitatea lor și ulterior expirării sau denunțării prezentelor termeni si conditii.\u003c/p\u003e\n\u003cp\u003eDrepturi de proprietate intelectuală\u003c/p\u003e\n\u003cp\u003eTextele, grafica, conținutul editorial, datele, formatul, graficele, design-urile, HTML, fotografiile, muzica, suntele, imaginile, softwarele, video-urile, precum și orice alt conținut accesibil Utilizatorilor \u0026icirc;n cadrul serviciilor constituie proprietatea exclusivă a Casta Imobiliare SRL., cu excepția conținuturilor generate de utilizatori, pe care Casta are dreptul sa le folosească.\u003c/p\u003e\n\u003cp\u003eDreptul de proprietate intelectuală al Casta asupra materialelor mai sus menționate este protejată de legile naționale și internaționale \u0026icirc;n materia drepturilor de proprietate intelectuală și patrimonială. Utilizatorilor le este interzis să descarce, utilizeze, remodeleze, reconfigureze, sau de a retransmite orice material fără acordul scris \u0026icirc;n prealabil al Casta, sau după caz, al titularului conținutului generat de utilizatori.\u003c/p\u003e\n\u003cp\u003eLogo-ul precum și denumirea marcii Casta aparțin patrimoniului Casta Imobiliare SRL., orice alte mărci sau logo-uri afișate pe platformă fiind deținute de către proprietarii respectivi. \u0026Icirc;n lipsa acordului proprietarilor copierea sau utilizarea acestor mărci, logo-uri, denumiri este strict interzisă.\u003c/p\u003e\n\u003cp\u003eInformații Confidențiale\u003c/p\u003e\n\u003cp\u003eUtilizatorii \u0026icirc;și dău acordul și \u0026icirc;și asumă să se abțină de orice conduită prin care Informațiile Confidențiale ar putea fi făcute publice, sau divulgate către terți, cu excepția personalului autorizat a persoanei juridice pe care o reprezinta, care are de asemenea obligația respectării confidențialități informațiilor\u003c/p\u003e\n\u003cp\u003eUtilizatorii vor notifica \u0026icirc;n scris de indată Casta \u0026icirc;n cazul oricăror situații ce pot implica divulgarea, transferul sau utilizarea neautorizată ale informațiilor confidențiale. Utilizatorii vor depune toate eforturile necesare protejării informațiilor confidențiale de la divulgarea neautorizată.\u003c/p\u003e\n\u003cp\u003e\u0026Icirc;n cazul incetării prezentelor termeni si conditii pentru orice motiv, utilizatorul va returna toate materialele \u0026icirc;n original sau \u0026icirc;n copie de conțin Informații Confidențiale. Termenul \u0026rdquo;Informație Confidențiala\u0026rdquo; include toate secretele comerciale ale Casta, informații patrimoniale ale Casta, precum și orice informații și date despre Casta care nu au fost aduse la cunoștiința publicului sau către terți, care ar putea deriva valoare economică sau de altă natură prin divulgarea lor.\u003c/p\u003e\n\u003cp\u003eInformațiile Confidențiale vor include date tehnice, know-how, cercetări, planuri de producție, produse, servicii, clienți, piețe, software, dezvoltări, invenții, procedure, formule, tehnologie, designu-ri, schițe, inginerii, informații de configurare hardware, marketing, date financiare sau informații de afaceri divulgate \u0026icirc;n mod direct sau indirect, pe orice cale.\u003c/p\u003e\n\u003cp\u003eDeclinarea Responsabilității\u003c/p\u003e\n\u003cp\u003eUtilizarea serviciilor se efectuază pe răspunderea solitară al utilizatorului.\u003c/p\u003e\n\u003cp\u003eServiciile Casta sunt furnizate conform principiului \u0026ldquo;așa cum sunt\u0026rdquo;, fără garantarea expresă sau prezumată a condițiilor de comercializare, conformitate pentru un scop specific sau de legalitate. Casta nu \u0026icirc;și asumă nici o responsabilitate față de acuratețea materialelor furnizate \u0026icirc;n cadrul serviciilor precum și față de conținutul altor platforme legate de servicii, totodata nu \u0026icirc;și asumă nici o răspundere juridică pentru următoarele:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eerori, greșeli sau date neadevărate \u0026icirc;n conținut\u003c/li\u003e\n\u003cli\u003evătămări corporale sau prejudicii patrimoniale de orice natură rezultate din accesarea și utilizarea serviciilor Casta\u003c/li\u003e\n\u003cli\u003eorice access au utilizare neautorizată ale serverelor noastre securizate și/sau ale datelor și informațiilor cu caracter personal depozitate pe aceste rețele\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCasta nu garantează, recomandă sau \u0026icirc;și asumă răspunderea pentru orice serviciu oferit sau publicat de către terți \u0026icirc;n cadrul serviciului, sau conectat printr-un hyperlink sau banner, către o altă platformă.\u003c/p\u003e\n\u003cp\u003eCasta nu va răspunde și nu va fi responsabila de monitorizarea oricăror tranzacții \u0026icirc;ntre utilizatori și terți, \u0026icirc;n afara celor menționate prin prezentele termeni si conditii, precum si ale contractelor incheiate de parti. Recomandăm utilizatorilor să utilizeze platforma \u0026icirc;n mod rezonabil, cu prudență și discernăm\u0026acirc;nt.\u003c/p\u003e\n\u003cp\u003eCasta și afiliații acestuia nu garantează faptul serviciile oferite vor fi \u0026icirc;n permanență neintrerupte sau viciate, totodată nu sunt garantate eventualele rezultate obținute prin utilizarea Serviciului, precum și nici sinrconizarea, acuratețea, fiabilitatea, conformitatea sau conținutul activităților specifice unui serviciu, informații, sau materiale furnizate \u0026icirc;n cadrul sau \u0026icirc;n legatură cu serviciile Casta.\u003c/p\u003e\n\u003cp\u003eLegea aplicabilă. Litigii\u003c/p\u003e\n\u003cp\u003eDrepturile și obligațiile părților menționate \u0026icirc;n acest document, precum și orice efecte juridice ale acestora sunt reglementate de legislația aplicabila din Romania.\u003c/p\u003e\n\u003cp\u003eLitigiile rezultate \u0026icirc;n urma interpretării sau exeutării prezentelor termeni si conditii vor fi soluționate de către instanțele aflate \u0026icirc;n competența sediului Casta.\u003c/p\u003e\n\u003cp\u003eDaca vreo prevedere din acest document este considerata invalida de catre forurile legale competente, invaliditatea unei asemenea prevederi nu va afecta valabilitatea celorlalte prevederi ale termenilor si conditiilor de utilizare, acestea ramanand in vigoare.\u003c/p\u003e\n\u003cp\u003ePrezentul document constituie in intregime un acord incheiat intre utilizator si Casta Imobiliare SRL in privinta utilizarii platformei online www.casta.eu\u003c/p\u003e\n\u003cp\u003eAceste prevederi pot fi modificate de Casta in mod periodic fara o notificare prealabila in acest sens. Puteti regasi cea mai recenta versiune a acestor conditii oricand, accesand aceasta pagina.\u003c/p\u003e\n\u003cbr\u003e\u003cbr\u003e\n\u003chr\u003e\n\n\u003cbr\u003e\u003cbr\u003e\n\u003ch2 id=\"privacy-policy\"\u003eProtectia și confidențialitatea datelor cu caracter personal\u003c/h2\u003e \n\u003cp\u003eVa multumim pentru accesarea platformei Casta! Echipa Casta va proteja cat mai mult dreptul la intimitate si la imagine al utilizatorilor platformei. Ne propunem sa va oferim dumneavoastra, utilizatorilor platformei, o experienta online sigura, care sa nu va afecteze in mod negativ viata personala. In acest sens depunem toate eforturile pentru a ne asigura ca informatiile pe care dumneavoastra le introduceti in baza noastra de date sunt folosite numai in scopurile pe care dumneavoastra le aveti in vedere. \u003c/p\u003e\n\n\u003ch2\u003eNota de informare cu privire la prelucrarea datelor cu caracter personal\u003c/h2\u003e\n\u003cp\u003ePrezentul document continue informatiile esentiale despre modalitatea de prelucrare a datelor cu caracter personal in cadrul serviciilor oferite de www.casta.ro (denumita in mod colectiv “platforma”). \u003c/p\u003e\n\u003cp\u003eIn sensul definitiei art. 4.1 din REGULAMENTUL (UE) 2016/679 (Regulamentul general privind protecția datelor, denumit in continuare GDPR) „date cu caracter personal” înseamnă orice informații privind o persoană fizică identificată sau identificabilă („persoana vizată”); o persoană fizică identificabilă este o persoană care poate fi identificată, direct sau indirect, în special prin referire la un element de identificare, cum ar fi un nume, un număr de identificare, date de localizare, un identificator online, sau la unul sau mai multe elemente specifice, proprii identității sale fizice, fiziologice, genetice, psihice, economice, culturale sau sociale. \u003c/p\u003e\n\u003cp\u003eIn momentul crearii unui cont pe platforma va sunt solicitate numele, prenumele, adresa de email , data nasterii, sex, profesie, cod postal, domeniul de activitate si interese personale. Crearea contului dvs pe site-ul nostru si abonarea la serviciile noastre ne faciliteaza accesul la datele dvs cu caracter personal.\u003c/p\u003e\n\n\u003ch2\u003eResponsabilitatea prelucrarii datelor cu caracter personal\u003c/h2\u003e\n\u003cp\u003eIn calitate de operator de date cu caracter personal, datele Dvs. cu caracter personal sunt prelucrate de catre:\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCASTA IMOBILIARE SRL\u003c/strong\u003e, avand sediul in Targu.Mures, str. Targului nr. 1, et. 1, Corp B, jud. Mures, inregistrata la Registrul Comertului cu nr. J26/702/2013, Cod Unic de Inregistrare RO 31961387, avand contul nr. IBAN : RO94BACX0000000906542001‏ deschis la UniCredit Bank - Sucursala Targu Mures\u003c/p\u003e\n\u003cp\u003eNr. tel:  0312297088 \u003c/p\u003e\n\u003cp\u003eEmail: contact@casta.eu\u003c/p\u003e\n\u003cp\u003eDatele de contact ale Responsabilului privind Protectia Datelor (DPO)\u003c/p\u003e\n\u003cp\u003ePuteti contacta DPO-ul societatii la urmatoarea adresa de email: dpo@casta.eu \u003c/p\u003e\n\n\u003ch2\u003eTemeiul juridic, scopul si termenul prelucrarii datelor cu caracter personal\u003c/h2\u003e\n\u003cp\u003eIn baza obtinerii consimtamantului persoanei vizate in vederea prelucrarii datelor cu caracter personal, acestea sunt prelucrate conform art. 6.1 lit a.) din GDPR.  Daca prelucrarea este necesară pentru executarea unui contract la care persoana vizată este parte sau pentru a face demersuri la cererea persoanei vizate înainte de încheierea unui contract, prelucrarea se efectuaza in baza art. 6.1 lit b.) din GDPR. Daca prelucrarea este necesară în vederea îndeplinirii unei obligații legale, ea se va efectua conform art. 6.1 lit c.) din GDPR. Daca prelucrarea este necesară în scopul intereselor legitime urmărite de Casta, ea se va efectua conform art. 6.1 lit f.) din GDPR. \u003c/p\u003e\n\u003cp\u003eScopul prelucrarii datelor cu caracter personal este acela de a facilita operatiunile de instrainare a imobilelor prin intermediul folosirii platformei online www.casta.ro, prin promovarea anunturilor publicate de proprietarii imobilelor precum si furnizarea de servicii de agentie imobiliara. \u003c/p\u003e\n\u003cp\u003eDatele cu caracter personal vor fi prelucrate pana la implinirea termenelor impuse de lege in ceea ce priveste limitele de pastrare a evidentelor fiscale si contabile, precum si a contractelor aferente acestora. \u003c/p\u003e\n\n\u003ch2\u003eContul de utilizator Casta\u003c/h2\u003e\n\u003cp\u003ePrin inregistrarea unui cont de utilizator pe platforma Casta, va dati acordul expres in ceea ce priveste termenii si conditiile de utilizare ale platformei, prevederile regasite la  avand valoarea unui contract intre Dvs. si societatea noastra. In acest sens, datele furnizate de Dvs. prin intermediul contului de utilizator Casta, sunt prelucrate in temeiul 6.1 lit b.) din GDPR. \u003c/p\u003e\n\u003cp\u003eUtilizarea serviciilor Casta se poate realiza prin intermediul unui cont personalizat inregistrat pe platforma in baza unui nume de utilizator si parola unica. \u003c/p\u003e\n\u003cp\u003eUtilizarea serviciilor Casta se poate realiza prin intermediul unui cont personalizat inregistrat pe platforma in baza unui nume de utilizator si parola unica, in urmatoarele etape: \u003c/p\u003e\n\u003cp\u003ea.)\tcu ocazia inregistrarii contului, veti avea obligatia sa ne furnizati numele, prenumele, adresa de email precum si numarul de telefon.\u003c/p\u003e\n\u003cp\u003eb.)\tin cazul publicarii unui anunt de vaznare, utilizatorul isi va furniza pe platforma datele de facturare, precum si locatia imobilului publicat spre vanzare\u003c/p\u003e\n\u003cp\u003ec.)\tin vederea activarii anuntului de vanzare, utilizatorul va avea obligatia achitarii tarifului de publicare, caz cu care isi va furniza datele cardului bancar necesare efectuarii platii, tranzactiile de plata fiind stocate si efectuate prin intermediul procesatorului de plati PayU,   https://www.payu.ro/en\u003c/p\u003e\n\u003cp\u003ed.) cu ocazia solicitării unei oferte de credit, utilizatorul va transmite datele de contact, impreuna cu diverse informatii privind situatia personala si financiara (conform cerintelor partenerilor comerciali ai Casta) catre institutiile financiare partenere, in vedere obtinerii unui oferte de credit. De asemenea, prin formularea cererii, persoana vizată își oferă acordul ca datele sale cu caracter personal furnizate cu această ocazie să fie prelucrate de către entitățile colaboratoare ale Casta, instituții financiar-bancare, în vederea întocmirii unei oferte de credit, înclusiv acordul de verificare și înregistrare al acestora la Biroul de Credit\u003c/p\u003e\n\n\u003ch2\u003eDreptul de a va modifica si stege datele dvs. detinute de Casta\u003c/h2\u003e\n\u003cp\u003eCasta confera dreptul utilizatorului de a modifica datele dvs. de contact pe care le-ati inregistrat, unele aspectele de care sunteti interesat, incluzand noile informatii despre produse si servicii lansate. De asemenea puteti sa solicitati stergerea datelor dvs. oricand, exceptie facand cazurile in care prelucrarea se efectuaza in temeiul 6.1 lit b.) din GDPR.\u003c/p\u003e\n\n\u003ch2\u003eSecuritatea datelor\u003c/h2\u003e\n\u003cp\u003ePentru confidentialitatea si securitatea datelor contul de Casta e protejat de o parola.\u003c/p\u003e\n\n\u003ch2\u003ePrelucrarea datelor in contextul utilizarii generale a platformelor si servicilor Casta\u003c/h2\u003e\n\u003cp\u003eCu ocazia accesarii platformei vom colecta informatii despre dispozitivul de accesare si vom stoca aceste date de log pe serverele noastre. Prin urmare, putem colecta informatii despre: tipurile si versiunile de browsere folosite; sistemul de operare folosit pentru accesarea sistemului; website-urile terte de pe care se acceseaza website-ul nostru; data si ora accesarii platformei; adresa IP;  furnizorul de servicii Internet (ISP) ale dispozitivului de acces; precum si alte informatii similare utilizate in vederea salvgardarii sistemelor noastre IT de la atacuri cibernetice. Pentru ratiuni de securitate (de exemplu pentru a putea trasa un eventual atac cibernetic impotriva platformei) vom stoca asemenea pe un termen de 30 zile, dupa care vom anonimiza sau sterge aceste date. Prelucrarea si stocarea temporara a adreselor IP se intemeiaza conform art. 6.1 lit f.) din GDPR, intrucat afisarea continuturilor website-ului, respectiv mentinerea securitatii propriilor noastre sisteme IT reprezinta interesul legitim al Casta. \u003c/p\u003e\n\n\u003ch2\u003ePrelucrarea datelor reprezentantilor persoanelor juridice\u003c/h2\u003e\n\u003cp\u003eIn cazul colaborarii cu perosane juridice, Casta va prelucra datele reprezentantilor persoanelor juridice (nume si prenume, adresa de email, nr. de telefon) numai in scopul indeplinirii raporturilor comerciale intre cele doua parti.\u003c/p\u003e\n\u003cp\u003eReprezentantii persoanelor juridice exprima prin prezenta acordul expres ca datele sale cu caracter personal constand din nume si prenume, adresa, email, numar de telefon, identitate vizuala, sa fie prelucrate de Casta  in scopul realizarii serviciilor de agentie imobiliara contractate, precum si in scopul informarii in legatura cu produsele si serviciile ulterioare ale Casta, acestea putand fi publicate pe platforma www.casta.ro, si dezvaluite tertilor, in cadrul serviciilor de promovare anuntului pe toate portalurile nationale de specializate in publicitatea imobiliara;\u003c/p\u003e\n\n\u003ch2\u003eOptimizarea functionalitatilor de cautare si recomandari\u003c/h2\u003e\n\u003cp\u003eNe rezervam dreptul de a prelucra informatii despre tiparele de cautare pe platforma, in vederea crearii unor modele statistice cu scopul de configura platforma pentru o utilizare cat mai usoara, si in mod deosebit pentru a optimiza functionalitatile de cautare si recomandare al anunturilor disponibile pe platforma. In acest sens, colectam adresa Dvs. de IP sub o forma pseudonomizata, pe un termen de 30 zile Prelucrarea si stocarea temporara a adreselor IP se intemeiaza conform art. 6.1 lit f.) din GDPR, intrucat interesul legitim al societatii noastre este de ne imbunatati serviciile prin asigurarea unor functionalitati intocmite pe modele statistice.  \u003c/p\u003e\n\n\u003ch2\u003eNotificari tip newsletter\u003c/h2\u003e\n\u003cp\u003ePrin abonarea la notificarile de tip newsletter, Casta va prelucra adresa de email a Dvs. pentru a va transmite notificari continand subiectele ce va pot interesa. Baza legala pentru prelucrarea acestor date se intemeiaza conform art. 6.1 lit a.) din GDPR. Pentru demonstrabilitatea identitatii Dvs., in ceea ce priveste abonarea in temeiul art. 6.1 lit f) din GDPR vom stoca adresa Dvs. de IP, pana la dezabonare, sau pana la incetarea transmiterii notificarilor catre Dvs. \u003c/p\u003e\n\u003cp\u003eNotificarile transmise contin asa numitele “pixeluri de urmarire”, care ne informeaza daca respective notificare a fost deschisa, respectiv data accesarii acesteia. Datele mai sus mentionate sunt necesare pentru optimiza sistemul de notificari emis de Casta, constituind interesul legitim conform art. 6.1 lit f) din GDPR.\u003c/p\u003e\n\n\u003ch2\u003eCorespondenta si contactul electronic\u003c/h2\u003e\n\u003cp\u003ePlatformele noastre pot contine formulare de contact prin intermediul careia ne puteti contacta pe cale electronica, de asemenea putem fi contactati pe adresa de email mai sus mentionata. In acest sens, datele continand mesajele transmise, precum si raspunsurile oferite din partea noastra vor fi stocate si prelucrate pana la momentul in care aspectele discutate se considera clarificate de cele doua parti.   \u003c/p\u003e\n\n\u003ch2\u003eChestionare, concursuri, promotii\u003c/h2\u003e\n\u003cp\u003eIn mod periodic, Casta va pune la dispozita utilizatorilor sai chestionare care pot fi completate de acestia. Chestionarele vor putea fi completate in mod anonim, insa exista posibilitatea solicitarii anumitor date (de ex. adresa de email) in vederea participarii la anumite concursuri. Datele colectate vor fi prelucrate in vederea notificarii Dvs., in cazul castigarii concursului, respectiv pentru predarea premiului oferit. Datele cu caracter personal furnizate in acest scop vor fi pastrate pana la finalizarea respectivei promotii.   \u003c/p\u003e\n\n\u003ch2\u003eDezvaluirea si transmiterea informatiilor cu caracter personal\u003c/h2\u003e\n\u003cp\u003eCasta nu va transmite (prin vanzare sau inchiriere) catre terte parti informatiile dvs. cu caracter personal. \u003c/p\u003e\n\u003cp\u003eCasta poate, totusi, transmite informatia tertilor in urmatoarele cazuri:\u003c/p\u003e\n\u003cp\u003eCu acordul dvs.;\u003c/p\u003e\n\u003cp\u003e\n\u003cul\u003e\n  \u003cli\u003eDaca este necesara transmiterea unor informatii in vederea furnizarii produselor si serviciilor solicitate de dvs.\u003c/li\u003e\n  \u003cli\u003eIn cazul in care informatia e necesara partenerilor companiei pentru imbunatatirea sau facilitarea unor servicii sau produse solicitate de dvs. \u003c/li\u003e\n  \u003cli\u003eCompaniile partenere au dreptul de a utiliza datele cu caracter personal furnizate direct de Casta doar in masura in care este necesara asistenta lor.\u003c/li\u003e\n  \u003cli\u003ePutem transmite informatii cu caracter personal autoritatilor sau institutiilor publice conform prevederilor legale sau bunei-credinte daca:\n    \u003cul\u003e\n      \u003cli\u003e(a) e prevazut intr-o dispozitie legala; \u003c/li\u003e\n      \u003cli\u003e(b) protejeaza drepturile companiei Casta sau companiilor afiliate; \u003c/li\u003e\n      \u003cli\u003e(c) previne o infractiune sau protejeaza siguranta nationala; \u003c/li\u003e\n      \u003cli\u003e(d) protejeaza siguranta individului sau siguranta publica;\u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIn cazul in care Casta fuzioneaza sau e achizitionata total sau partial de o alta companie baza de date e transferata noului operator. In cazul in care Casta devine insolvabila, voluntar sau involuntar, prin lichidatorul, administratorul sau cumparatorul baza de date poate fi vanduta, autorizata, tranzactionata doar cu acordul instantei. In cazul in care vor aparea situatii mentionate mai sus veti fi anuntati prin e-mail sau printr-un anunt postat pe site-urile Casta .\u003c/p\u003e\n\u003cp\u003eImputernicirea tertilor pentru servicii de hosting, securizare, mentenanta si marketing si activitati de suport tehnic\u003c/p\u003e\n\u003cp\u003eIn vederea prestarii serviciilor, Casta imputerniceste urmatorii terti conform interesului sau legitim, imputernicitii Casta prelucrand datele furnizate in mod exclusiv in scopul in care acestea au fost transmise catre acestia in temeiul art. 28 din GDPR. Imputernicitii vor pastra pe serverele mai sus mentionate datele cu caracter personal pe aceeasi perioada pentru care se prelucreaza datele conform prezentei:\u003c/p\u003e\n\n\u003ch2\u003eServicii de Hosting: \u003c/h2\u003e\n\u003cp\u003eGoogle Cloud  -  Belgia (europe-west 1), cu locatia:  \u003ca target=\"_blank\" href=\"https://cloud.google.com/about/locations/?region=europe#region\"\u003e aici\u003c/a\u003e \u003c/p\u003e\n\n\u003ch2\u003eServicii de mailing si newsletter:\u003c/h2\u003e\n\u003cp\u003eSendmachine.com - prin Zooku Solutions SRL, Str. Iuliu Maniu Nr. 14, Targu Mures, Jud. Mures, Romania\u003c/p\u003e\n\n\u003ch2\u003eServicii de Callcenter: \u003c/h2\u003e\n\u003cp\u003eVCC Live, furnizat de VCC Live Germany GmbH (seat: Gontardstraße 11, 10178 Berlin, GERMANY; company registration number: HRB 190017 B, tax number: 114/141/50235, EU tax number: DE277993151, IBAN:DE64 7007,   \u003ca target=\"_blank\" href=\"https://vcc.live/privacy-policy/\"\u003e website \u003c/a\u003e\n\u003c/p\u003e\n\u003cp\u003e\nServicii de mesagerie instantă\nGoogle Firebase, furnizat de   \u003ca target=\"_blank\" href=\"https://firebase.google.com/products/firestore\"\u003eGoogle\u003c/a\u003e\n\u003c/p\u003e\n\u003ch2 id='cookie'\u003eCookies si alte tehnologii similare\u003c/h2\u003e\n\u003cp\u003ePersoanele fizice pot fi asociate cu identificatorii online furnizați de dispozitivele, aplicațiile, instrumentele și protocoalele lor, cum ar fi adresele IP, identificatorii cookie sau alți identificatori precum etichetele de identificare prin frecvențe radio. Aceștia pot lăsa urme care, în special atunci când sunt combinate cu identificatori unici și alte informații primite de servere, pot fi utilizate pentru crearea de profiluri ale persoanelor fizice și pentru identificarea lor.\u003c/p\u003e\n\u003cp\u003eUn cookie este o informatie transmisa pe calculatorul unui utilizator care identifica informatii despre acea persoana vizata. Casta si imputernicii sai folosesc cookie-uri pentru a oferi o navigare cat mai fluida si pentru a urmari / memora preferintele vizitatorilor, cu scop statistic, pentru a informa, a optimiza si a difuza anunturi / reclame in functie de vizitele anterioare efectuate de un utilizator atat pe platforma de website cat si pe prin aplicatia de telefonie mobila. Casta plaseaza cookie-uri inclusiv pe browserele care accesează aceste site-uri web sau site-uri terte care ne gazduiesc pluginurile.\u003c/p\u003e\n\u003cp\u003eBeaconii web sunt imagini pixel transparente care sunt utilizate pentru colectarea de informații despre utilizarea site-ului.\u003c/p\u003e\n\u003cp\u003eUtilizatorii au optiunea de a seta browserul astfel incat sa respinga cookies, click aici pentru dezactivarea acestora. Dezactivarea acestora cookies ar putea sa aiba un impact negativ asupra navigarii pe site, de ex. nu se vor putea vizualiza anumite imagini / accesa anumite optiuni / facillitati. \u003c/p\u003e\n\u003cp\u003eIn cele ce urmeaza va prezentam o descriere despre scopul acestor module, precum si modalitatea de utilizare ale acestora:\u003c/p\u003e\n\u003cp\u003eIn general modulele de cookies sunt impartite in doua categorii distincte: cele esentiale si cele neesentiale. Cookie-urile esentiale sunt necesare pentru furnizarea informatiilor solicitate de utilizator pe platforma. \u003c/p\u003e\n\u003cp\u003eCelelalte categorii de cookie-uri sunt folosite de Casta in urmatoarele scopuri: \u003c/p\u003e\n\u003cp\u003eAutentificare si logare: pastrarea utilizatorului logat pe site, prin retinerea de informatii relevante despre acesta si personalizarea experientiei in cadrul folosirii functionalitatilor platformei \u003c/p\u003e\n\u003cp\u003eFunctionare, setari preferinte, analiza si performanta: salvarea setarilor si a preferintelor diverselor functionalitati, cum ar fi a limba setata, modalitatea de comunicare, navigarea pe site, interesele manifestate, cautarile efectuate. \u003c/p\u003e\n\n\u003ch2\u003ePublicitate\u003c/h2\u003e\n\u003cp\u003eCasta difuzeaza anunturi grafice, care apar ca imagini, animatie sau video, anunturi text, care apar sub forma de link-uri text prin intermediul unei companii externe, ce permite afisarea reclamelor pe site-ul nostru. Aceste reclame ar putea folosi informatii (care nu includ numele, adresa, emailul sau numarul de telefon) despre vizitele utilizatorilor pe www.casta.eu sau pe alte site-uri, pentru a oferi reclame despre joburi / companii / bunuri si servicii din aria de interes a acestora.\u003c/p\u003e\n\u003cp\u003ePartenerii cu care colaboram, precum Google si platforma de difuzare a reclamelor AdOcean, folosesc astfel de cookie-uri pentru filtrarea informatiei afisate, in functie de vizitele anterioare realizate pe www.casta.ro sau pe alte site-uri. Pentru mai multe informatii vizitati urmatorul link \u003ca target=\"_blank\" href=\"https://support.google.com/adspolicy/answer/6008942?hl=ro\"\u003eaici\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eInstrumentele de mai jos ne ajuta in intelegerea interactionarii utilizatorilor platformei iar analiza acstora ne permite sa va transmitem mesaje cu caracter publicitar in vederea promovarii unor anunturi personalizate ce sunt compatibile cu activitatea Dvs.\u003c/p\u003e\n\u003cp\u003eProgramul Google Analytics este folosit de platforma pentru a analiza traficul de internet furnizat de Google, prin utilizarea de cookie-uri care sa ajute Casta in intelegerea modului in care utilizatorii folosesc platforma, prin compilarea de rapoarte privint activitatea platformei,  \u003c/p\u003e\n\u003cp\u003eProgramul Google Adwords: este utilizat pentru livrarea de informatii utilizatorilor care cauta serviciile noastre dar si anunturi personalizate bazate pe comportament \u003c/p\u003e\n\u003cp\u003eUtilizatorii isi pot manifesta optiunea de a nu fi urmariti de programul Google Analytics accesand urmatorul \u003ca target=\"_blank\" href=\"https://tools.google.com/dlpage/gaoptout\"\u003elink\u003c/a\u003e\u003c/p\u003e\n\n\u003ch2\u003eOptiunile utilizatorilor privind politica de cookies\u003c/h2\u003e\n\u003cp\u003ePersoanele vizate au dreptul de a ajusta setarile de confidentialitate prin blocarea cookie-urilor in browserele folosite, insa aceste actiuni pot impacta in mod negativ functionarea optima a website-urilor folosite, putand avea consecinte in mod inclusiv asupra setarilor salvate si personalizate ale platformelor vizitate in mod regulat. Totodata browserele ofera oportunitatea utilizatorilor de a specifica care sunt site-urile autorizate sa foloseasca modulele cookies.\u003c/p\u003e\n\u003cp\u003eAccesand urmatoarele linkuri utilizatorii pot obtine informatii despre modalitatea de setare a cookie-urilor pe diversele platforme de browser folosite:\u003c/p\u003e\n\u003cp\u003eInternet Explorer: \u003ca target=\"_blank\" href=\"https://support.microsoft.com/en-us/help/17442/windows-internet-explorer-delete-manage-cookies\"\u003eManage cookies\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eFirefox: \u003ca target=\"_blank\" href=\"https://support.mozilla.org/en-US/kb/cookies-information-websites-store-on-your-computer#:~:text=A%20cookie%20is%20information%20stored,your%20preferred%20language%20or%20location\"\u003e Firefox cookies \u003c/a\u003e \u003c/p\u003e\n\u003cp\u003eChrome:  \u003ca target=\"_blank\" href=\"https://support.google.com/chrome/answer/95647?hl=en\u0026ref_topic=14666\"\u003ehttps://support.google.com/chrome/answer/95647?hl=en\u0026ref_topic=14666\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eSafari web:\u003ca target=\"_blank\" href=\" https://support.apple.com/kb/PH17191?locale=en_US\"\u003eSuport Apple \u003c/a\u003e  \u003c/p\u003e\n\u003cp\u003eiOS: \u003ca target=\"_blank\" href=\"https://support.apple.com/en-us/HT201265\"\u003eIOS Support \u003c/a\u003e  \u003c/p\u003e\n\u003cp\u003eUtilizatorii pot obtine informatii suplimentare despre modul in care functioneaza cookie-urile accesand urmatoarul \u003ca target=\"_blank\" href=\"http://www.allaboutcookies.org/ \"\u003e link \u003c/a\u003e \u003c/p\u003e\n\n\u003cp\u003eDrepturile persoanei vizate\u003c/p\u003e\n\u003cp\u003eIn calitate de utilizator al platformei Casta, conform prevederilor GDPR, beneficiati de urmatoarele drepturi:\u003c/p\u003e\n\u003cp\u003eDreptul la acces la informatii: puteti solicita confirmarea faptului ca Casta prelucreaza date cu caracter personal vizand persoana Dvs;\u003c/p\u003e\n\u003cp\u003eIn caz afirmativ, puteti solicita accesul la urmatoarele informatii: \u003c/p\u003e\n\u003cp\u003ea) scopurile prelucrării; \u003c/p\u003e\n\u003cp\u003eb) categoriile de date cu caracter personal vizate; \u003c/p\u003e\n\u003cp\u003ec) destinatarii sau categoriile de destinatari cărora datele cu caracter personal le-au fost sau urmează să le fie divulgate, în special destinatari din țări terțe sau organizații internaționale; \u003c/p\u003e\n\u003cp\u003ed) acolo unde este posibil, perioada pentru care se preconizează că vor fi stocate datele cu caracter personal sau, dacă acest lucru nu este posibil, criteriile utilizate pentru a stabili această perioadă; \u003c/p\u003e\n\u003cp\u003ee) existența dreptului de a solicita rectificarea sau ștergerea datelor cu caracter personal ori restricționarea prelucrării datelor cu caracter personal referitoare la persoana vizată sau a dreptului de a se opune prelucrării;\u003c/p\u003e\n\u003cp\u003e f) dreptul de a depune o plângere în fața unei autorități de supraveghere; \u003c/p\u003e\n\u003cp\u003eg) în cazul în care datele cu caracter personal nu sunt colectate de la persoana vizată, orice informații disponibile privind sursa acestora; \u003c/p\u003e\n\u003cp\u003eh) existența unui proces decizional automatizat incluzând crearea de profiluri, menționat la articolul 22 alineatele (1) și (4), precum și, cel puțin în cazurile respective, informații pertinente privind logica utilizată și privind importanța și consecințele preconizate ale unei astfel de prelucrări pentru persoana vizată. \u003c/p\u003e\n\u003cp\u003eÎn cazul în care datele cu caracter personal sunt transferate către o țară terță sau o organizație internațională, persoana vizată are dreptul să fie informată cu privire la garanțiile adecvate în temeiul articolului 46 referitoare la transfer.\u003c/p\u003e\n\n\u003ch2\u003eDreptul la rectificare \u003c/h2\u003e\n\u003cp\u003eAveti dreptul de a obține fără întârzieri nejustificate, rectificarea datelor cu caracter personal inexacte care o privesc. Ținându-se seama de scopurile în care au fost prelucrate datele, persoana vizată are dreptul de a obține completarea datelor cu caracter personal care sunt incomplete, inclusiv prin furnizarea unei declarații suplimentare. \u003c/p\u003e\n\u003cp\u003eDreptul la ștergerea datelor („dreptul de a fi uitat”) \u003c/p\u003e\n\u003cp\u003eAveti dreptul de a obține ștergerea datelor cu caracter personal care o privesc, fără întârzieri nejustificate, în cazul în care se aplică unul dintre următoarele motive: \u003c/p\u003e\n\u003cp\u003edatele cu caracter personal nu mai sunt necesare pentru îndeplinirea scopurilor pentru care au fost colectate sau prelucrate;\u003c/p\u003e\n\u003cp\u003e(b) persoana vizată își retrage consimțământul pe baza căruia are loc prelucrarea, și nu există niciun alt temei juridic pentru prelucrarea; \u003c/p\u003e\n\u003cp\u003e(c) persoana vizată se opune prelucrării în temeiul articolului 21 alineatul (1) și nu există motive legitime care să prevaleze în ceea ce privește prelucrarea sau persoana vizată se opune prelucrării în temeiul articolului 21 alineatul (2); \u003c/p\u003e\n\u003cp\u003e(d) datele cu caracter personal au fost prelucrate ilegal; \u003c/p\u003e\n\u003cp\u003e(e) datele cu caracter personal trebuie șterse pentru respectarea unei obligații legale în temeiul dreptului Uniunii sau al dreptului intern \u003c/p\u003e\n\u003cp\u003eExercitarea drepturilor de mai sus nu se aplică în măsura în care prelucrarea este necesară: \u003c/p\u003e\n\u003cp\u003e(a) pentru exercitarea dreptului la liberă exprimare și la informare; \u003c/p\u003e\n\u003cp\u003e(b) pentru respectarea unei obligații legale care prevede prelucrarea în temeiul dreptului Uniunii sau al dreptului intern sau pentru îndeplinirea unei sarcini executate în interes public \u003c/p\u003e\n\u003cp\u003e(c) din motive de interes public în domeniul sănătății publice, \u003c/p\u003e\n\u003cp\u003e(d) în scopuri de arhivare în interes public, în scopuri de cercetare științifică sau istorică ori în scopuri statistice, în măsura în care dreptul exercitat este susceptibil să facă imposibilă sau să afecteze în mod grav realizarea obiectivelor prelucrării respective; sau \u003c/p\u003e\n\u003cp\u003e(e) pentru constatarea, exercitarea sau apărarea unui drept în instanță.\u003c/p\u003e\n\u003cp\u003eÎn cazul în care Casta a făcut publice datele cu caracter personal și este obligata să le șteargă, ținând seama de tehnologia disponibilă și de costul implementării, vom lua măsuri rezonabile, inclusiv măsuri tehnice, pentru a informa tertii care prelucrează datele cu caracter personal că persoana vizată a solicitat ștergerea de către acești operatori a oricăror linkuri către datele respective sau a oricăror copii sau reproduceri ale acestor date cu caracter personal.\u003c/p\u003e\n\n\u003ch2\u003eDreptul la restricționarea prelucrării \u003c/h2\u003e\n\u003cp\u003eAveti dreptul de a obține restricționarea prelucrării în cazul în care se aplică unul din următoarele cazuri: \u003c/p\u003e\n\u003cp\u003e(a) persoana vizată contestă exactitatea datelor, pentru o perioadă care îi permite procesatorului să verifice exactitatea datelor; \u003c/p\u003e\n\u003cp\u003e(b) prelucrarea este ilegală, iar persoana vizată se opune ștergerii datelor cu caracter personal, solicitând în schimb restricționarea utilizării lor; \u003c/p\u003e\n\u003cp\u003e(c) operatorul nu mai are nevoie de datele cu caracter personal în scopul prelucrării, dar persoana vizată i le solicită pentru constatarea, exercitarea sau apărarea unui drept în instanță; \u003c/p\u003e\n\u003cp\u003e(d) persoana vizată s-a opus prelucrării în conformitate cu articolul 21 alineatul (1), pentru intervalul de timp în care se verifică dacă drepturile legitime ale operatorului prevalează asupra celor ale persoanei vizate. \u003c/p\u003e\n\n\u003ch2\u003eDreptul la portabilitatea datelor \u003c/h2\u003e\n\u003cp\u003eAveti dreptul de a primi datele cu caracter personal care o privesc și pe care le-a furnizat într-un format structurat, utilizat în mod curent și care poate fi citit automat și are dreptul de a transmite aceste date altui operator, fără obstacole din partea operatorului căruia i-au fost furnizate datele cu caracter personal, în cazul în care: \u003c/p\u003e\n\u003cp\u003e(a) prelucrarea se bazează pe consimțământ în temeiul art 6.1 lit a) \u003c/p\u003e\n\u003cp\u003e (b) prelucrarea este efectuată prin mijloace automate. \u003c/p\u003e\n\u003cp\u003eÎn exercitarea dreptului său la portabilitatea datelor persoana vizată are dreptul ca datele cu caracter personal să fie transmise direct de la un operator la altul acolo unde acest lucru este fezabil din punct de vedere tehnic\u003c/p\u003e\n\n\u003ch2\u003eDreptul la opoziție \u003c/h2\u003e\n\u003cp\u003eAveti dreptul de a va opune, din motive legate de situația particulară în care va aflati aflati, prelucrării în temeiul articolului 6 alineatul (1) litera (e) sau (f) inclusiv creării de profiluri pe baza respectivelor dispoziții. \u003c/p\u003e\n\u003cp\u003eIn acest caz nu se vor prelucra datele cu caracter personal, cu excepția cazului în care se demonstreaza existenta motivelor legitime și imperioase care justifică prelucrarea și care prevalează asupra intereselor, drepturilor și libertăților persoanei vizate sau că scopul este constatarea, exercitarea sau apărarea unui drept în instanță. \u003c/p\u003e\n\u003cp\u003eAtunci când prelucrarea datelor cu caracter personal are drept scop marketingul direct, aveti dreptul de a se opune în orice moment prelucrării în acest scop a datelor cu caracter personal care va privesc, inclusiv creării de profiluri, în măsura în care este legată de marketingul direct respectiv. \u003c/p\u003e\n\n\u003ch2\u003eProcesul decizional individual automatizat, inclusiv crearea de profiluri\u003c/h2\u003e\n\u003cp\u003eAveti dreptul de a nu face obiectul unei decizii bazate exclusiv pe prelucrarea automată, inclusiv crearea de profiluri, care produce efecte juridice care va privesc sau va afecteaza in mod similar într-o măsură semnificativă. \u003c/p\u003e\n\u003cp\u003ePrevederile de mai sus nu se aplică în cazul în care decizia: \u003c/p\u003e\n\u003cp\u003e(a) este necesară pentru încheierea sau executarea unui contract între persoana vizată și Dvs.\u003c/p\u003e\n\u003cp\u003e(b) este autorizată prin dreptul Uniunii sau dreptul intern și care prevede, de asemenea, măsuri corespunzătoare pentru protejarea drepturilor, libertăților și intereselor legitime ale persoanei vizate; sau \u003c/p\u003e\n\u003cp\u003e(c) are la bază consimțământul explicit al Dvs.\u003c/p\u003e\n\n\u003ch2\u003eModificari ale politicii privind protectia și confidențialitatea datelor cu caracter personal\u003c/h2\u003e\n\u003cp\u003eDaca consideram ca este necesara o schimbare a regulilor de confidentialitate, vom publica respectivele modificari in aceasta pagina pentru a va informa cu privire la tipurile de informatii pe care le colectam si modul in care le utilizam. Daca aveti intrebari cu privire la politica noastra de confidentialitate va rugam sa ne scrieti la contact. \u003c/p\u003e\n\u003cp\u003eVa multumim ca folositi serviciile noastre. Va asiguram ca vom incerca sa va oferim intotdeauna cele mai bune servicii si sa ramanem prietenul dumneavoastra pentru numeroase servicii on-line.\u003c/p\u003e"])</script>
