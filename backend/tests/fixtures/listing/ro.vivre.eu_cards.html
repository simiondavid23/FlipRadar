 iar noile date vor fi luate in considerare doar pentru comenzile viitoare sau pentru modificarile permise.\u003cbr\u003e\n    \u003cstrong\u003e9.3.10.\u003c/strong\u003e O comanda plasata poate fi anulata inainte de expedierea acesteia prin intermediul butonului \"Anuleaza comanda\" din Contul Clientului sau prin solicitarea Clientului in scris, trimitand un e-mail pe contact@vivre.eu, mentionand clar anularea si numarul comenzii. In cazul produselor vandute de Partenerii Marketplace, anularea poate fi supusa termenelor si conditiilor specifice ale Vanzatorului.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.4. Comanda telefonica\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.4.1.\u003c/strong\u003e Clientul / Membrul nu poate efectua comenzi telefonice. Clientul / Membrul nu poate solicita modificarea comenzii la telefon.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.5. Contract si finalizare\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.5.1.\u003c/strong\u003e Vanzatorul (VIVRE HOMES S.R.L. sau, dupa caz, Partenerul Vivre Marketplace indicat pentru produs) transmite catre Client toate documentele necesare care sa ateste achizitionarea produselor/serviciilor de catre Client conform legislatiei in vigoare. Platforma Vivre faciliteaza transmiterea acestor documente si comunicarea dintre Client si Vanzator, fara a deveni parte in contractul de vanzare-cumparare incheiat intre Client si Vanzator.\u003cbr\u003e\n    \u003cstrong\u003e9.5.2.\u003c/strong\u003e Vivre Homes va facilita informarea Clientului asupra stadiului de finalizare in care se afla comanda sa prin trimiterea unor e-mailuri de informare la adresa indicata de acesta. Factura aferenta produselor comandate este emisa de catre Vanzatorul relevant (VIVRE HOMES S.R.L. sau Partenerul Marketplace) si va cuprinde toate mentiunile obligatorii in conformitate cu art. 319 din Legea nr. 227/2015 privind Codul fiscal. Daca Vanzatorul furnizeaza factura in format electronic, Clientul va putea fi notificat prin e-mail, iar documentul va putea fi descarcat si din contul Membrului, sectiunea „Comenzile mele → Detalii comanda”.\u003cbr\u003e\n    \u003cstrong\u003e9.5.3.\u003c/strong\u003e Contractul de vanzare-cumparare este considerat onorat atunci cand produsele sunt livrate catre Client de catre Vanzator, iar documentele care atesta predarea coletului catre curier si livrarea catre Client (AWB, confirmare de livrare etc.) sunt emise de catre transportator si/sau Vanzator. In cazul produselor vandute de Partenerii Vivre Marketplace, livrarea este efectuata direct de catre acestia, conform politicilor proprii afisate pe platforma.\u003cbr\u003e\n    \u003cstrong\u003e9.5.4.\u003c/strong\u003e Contractul este incheiat pe durata determinata. Acesta va fi considerat incetat in momentul in care partile (Clientul si Vanzatorul) isi vor fi executat obligatiile reciproce in termenele si conditiile stabilite prin prezentul Document si prin conditiile specifice ale Vanzatorului.\u003cbr\u003e\n    \u003cstrong\u003e9.5.5.\u003c/strong\u003e In cazul in care exista diferente intre numarul de produse comandate (asa cum poate fi accesat din \"Contul meu\") si continutul coletului, Clientul are obligatia de a notifica de indata Vanzatorul, prin intermediul platformei Vivre sau prin e-mail la contact@vivre.eu, in maximum 24 de ore de la receptia coletului, cu detaliile aferente (foto, explicatii etc.). In cazul produselor vandute de Partenerii Marketplace, Clientul poate utiliza inclusiv campul „Conversatie cu vanzatorul” disponibil in contul sau, la sectiunea „Comenzile mele”.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.6. Transport\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.6.1\u003c/strong\u003e Costul total al comenzii, inclusiv costurile de transport, este comunicat Clientului la momentul plasarii comenzii. Clientul accepta in mod expres, prin plasarea comenzii, estimarile pentru costul transportului, indiferent de datele care au stat la baza determinarii acestui cost. In cazul comenzilor care includ produse vandute de Partenerii Vivre Marketplace, costurile de livrare si retur pot varia in functie de politica fiecarui Partener si sunt afisate distinct in Cosul de Cumparaturi si/sau in pagina Partenerului.\u003cbr\u003e\n    \u003cstrong\u003e9.6.2.\u003c/strong\u003e Timpul de livrare al unei comenzi este comunicat expres la plasarea acesteia si este stabilit de catre Vanzator (VIVRE HOMES S.R.L. sau Partenerul Marketplace, dupa caz), in functie de disponibilitatea produselor si de procesul logistic propriu. Livrarile se vor efectua de regula in interiorul perioadei asumate la plasarea comenzii (variaza intre 2 zile si 8 saptamani), iar Clientul poate obtine informatii privind statusul livrarii in orice moment din contul sau. In cazul in care produsul poate fi livrat cu depasirea termenului comunicat, Vanzatorul va informa de indata Clientul prin e-mail, oferind doua optiuni: Clientul fie renunta (in scris) la comanda/produs, fie accepta noul termen de livrare propus. In eventualitatea in care plata a fost efectuata in avans prealabil livrarii, sumele platite vor fi rambursate de catre Vanzator conform legii, in termen de maximum 14 zile de la data renuntarii.\u003cbr\u003e\n    \u003cstrong\u003e9.6.2.1.\u003c/strong\u003e Clientul are posibilitatea alegerii Livrarii rapide a produselor semnalizate in mod special in acest mod, in masura in care this optiune este oferita de Vanzatorul relevant.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.7. Calitate si garantii\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.7.1.\u003c/strong\u003e Vanzatorul (VIVRE HOMES S.R.L. sau, dupa caz, Partenerul Vivre Marketplace indicat pentru produs) respecta prevederile de garantie conform legislatiei romanesti in vigoare. Detalii clare legate de these garantii sunt furnizate in fisele produselor, iar niciun Membru nu poate solicita o garantie extinsa, mai mult decat cea mentionata. Garantia se aplica conditiilor normale de utilizare si este valabila pentru produsele achizitionate de Client prin intermediul platformei Vivre, fiind oferita de catre Vanzatorul relevant. Produsele beneficiaza de o garantie legala de conformitate conform prevederilor legislatiei aplicabile (inclusiv dispozitiile privind vanzarea de bunuri de consum si garantiile conexe). Daca in prezentarea produsului este precizat un termen extins de garantie, se aplica termenul mai lung. Raspunderea pentru lipsa de conformitate a produsului este angajata fata de Vanzator, daca lipsa de conformitate apare intr-un termen de 2 ani calculat de la livrarea produsului, pentru produsele cu o durata medie de utilizare de cel putin 2 ani. Garantia presupune, dupa caz, rambursarea valorii pentru produsele neconforme, repararea sau inlocuirea acestora, pentru care Clientul notifica Vanzatorul in scris, in termenul legal.\u003cbr\u003e\n    \u003cstrong\u003e9.7.3.\u003c/strong\u003e Conditiile de garantie nu se aplica pentru urmatoarele cazuri:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003es-a intervenit asupra produsului, a fost reparat si/sau modificat de personal neautorizat;\u003c/li\u003e\n    \u003cli\u003enumarul de serie al produsului, componentele sau accesoriile au fost modificate, anulate sau eliminate;\u003c/li\u003e\n    \u003cli\u003eprodusul prezinta defecte fizice: lovituri, crapaturi, cioburi, rugina;\u003c/li\u003e\n    \u003cli\u003eprodusul prezinta urme de utilizare in conditii neadecvate: tensiuni de alimentare necorespunzatoare, supunerea la variatii mari de temperatura si presiune, manipulare incorecta, patrunderea de lichide, metale sau alte substante in interiorul echipamentelor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e9.7.4.\u003c/strong\u003e Detalii clare despre trasaturile caracteristice ale fiecarui produs sunt furnizate pe site de catre Vanzator. Informatii cu privire la termenii si conditiile de garantie, precum si instructiunile generale de utilizare ale produselor pot fi livrate Clientului in format digital, impreuna cu documentele produsului, disponibile din contul Vivre sau furnizate de catre Vanzator. In cazul produselor vandute de Partenerii Vivre Marketplace, certificatul de garantie si documentatia aferenta sunt emise si furnizate de catre Partenerul respectiv sau de catre centrul autorizat al producatorului, dupa caz. Daca these informatii nu au parvenit Clientului, acesta le poate obtine oricand prin intermediul platformei sau prin e-mail la contact@vivre.eu.\n\u003c/p\u003e\n\n\u003cp\u003e\n    \u003cstrong\u003e9.8. Renuntarea la contract si returnarea produselor\u003c/strong\u003e\u003cbr\u003e\n    \u003cstrong\u003e9.8.1.\u003c/strong\u003e Clientul poate returna produsele achizitionate prin intermediul unui Contract la distanta, incheiat cu Vanzatorul relevant (VIVRE HOMES S.R.L. sau, dupa caz, Partenerul Vivre Marketplace indicat pentru produs), si este indreptatit sa primeasca intreaga contravaloare platita pentru produse, in urmatoarele situatii:\u003cbr\u003e\n    \u003cstrong\u003e9.8.1.1.\u003c/strong\u003e Produsele prezinta deteriorari severe care le fac neconforme;\u003cbr\u003e\n    \u003cstrong\u003e9.8.1.2.\u003c/strong\u003e Produsele livrate sunt diferite (specificatii, cantitate etc.) fata de comanda plasata;\u003cbr\u003e\n    \u003cstrong\u003e9.8.1.3.\u003c/strong\u003e Produsele prezinta defecte de fabricatie;\u003cbr\u003e\n    \u003cstrong\u003e9.8.1.4.\u003c/strong\u003e Clientul s-a retras din contract in termenul de 14 zile de la data livrarii comenzii. Prin completarea formularului de retur disponibil in contul Clientului, acesta are posibilitatea de a selecta produse simultan din una sau mai multe comenzi returnabile (cele aflate in termenul maxim legal de 14 zile). În cazul produselor vândute de partenerii din Vivre Marketplace, returul este organizat și gestionat direct de către partenerul relevant, conform politicii proprii de retur și garanție afișate pe pagina acestuia. Se poate percepe o taxă de retur, în funcție de politica fiecărui seller. Recomandăm a se verifica înainte de achiziția unui produs, politica de retur a sellerului și eventualele taxe aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e9.8.3.\u003c/strong\u003e Inainte de expirarea perioadei de retragere, Clientul informeaza Vanzatorul cu privire la decizia sa de retragere din contract. In acest scop, Clientul poate alege una dintre urmatoarele variante:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) De a folosi modelul de formular de retragere disponibil pe platforma Vivre in sectiunea Retur;\u003c/li\u003e\n    \u003cli\u003eb) De a face orice alta declaratie neechivoca in care isi exprima decizia de retragere din contract.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e9.8.4.\u003c/strong\u003e Clientului care a notificat conform art. 9.8.3., ii revine responsabilitatea de a pune produsele la dispozitia Vanzatorului (VIVRE HOMES S.R.L. sau, dupa caz, Partenerului Vivre Marketplace indicat pentru produs), fara intarziere nejustificata si in decurs de cel mult 14 zile de la data la care acesta a comunicat decizia sa de retragere din contract. In cazul produselor vandute de Partenerii din Vivre Marketplace, returul este organizat de catre Vanzatorul relevant, care va solicita firmei de curierat ridicarea produselor returnate direct de la Client. Clientul va fi informat prin e-mail cu privire la organizarea returului, inclusiv cu privire la numarul AWB si detaliile firmei de curierat care va efectua ridicarea produselor. Clientul are obligatia de a preda produsul curierului desemnat, impachetat corespunzator pentru protejarea pe durata transportului. Rambursarea sumelor achitate se va efectua de catre Vanzatorul relevant imediat dupa receptionarea produselor returnate in depozitul acestuia, in conformitate cu termenul legal aplicabil.\u003cbr\u003e\n    \u003cstrong\u003e9.8.5.\u003c/strong\u003e Clientul nu va putea sa returneze produsele achizitionate si/sau nu va pretinde orice alte daune-interese/despagubiri, in urmatoarele situatii:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eIn cazul in care cererea de returnare pentru oricare din situatiile prevazute in art. 9.8.1 are data de expediere a notificarii intentiei de returnare care depaseste perioada de 14 zile prevazute conform art. 9.8.2, calculata din ziua urmatoare datei contractului onorat.\u003c/li\u003e\n    \u003cli\u003eIn cazul in care se returneaza un produs avand ca motivatie una dintre situatiile prevazute in art. 9.8.1, iar produsul returnat nu este in aceeasi stare in care a fost livrat (cu documentele care l-au insotit, cu toate componentele).\u003c/li\u003e\n    \u003cli\u003eIn cazul in care produsele au fost confectionate dupa specificatiile prezentate de Client sau personalizate in mod clar.\u003c/li\u003e\n    \u003cli\u003eIn cazul in care au fost comandate si livrate produse sigilate care nu pot fi returnate din motive de protectie a sanatatii sau din motive de igiena si care au fost desigilate de Client (these produse sunt marcate in prezentare ca produse nereturnabile).\u003c/li\u003e\n    \u003cli\u003eCostumele de baie si articolele de tip lenjerie intima trebuie sa aiba in continuare sigiliul de igiena; Produsele nu trebuie sa prezinte deteriorari sau urme de purtare; Articolele pot fi probate, insa din motive de igiena sigiliul/autocolantul nu trebuie sa fie indepartat; Articolele de lenjerie intima din silicon (adezive) nu pot fi returnate daca ambalajul a fost desfacut; Bijuteriile si accesoriile pentru par nu pot fi returnate daca ambalajul a fost deteriorat; In cazul seturilor de lenjerie pachetul trebuie sa fie nedesfacut si nu se pot returna seturi incomplete sau articole separate.\u003c/li\u003e\n    \u003cli\u003eIn cazul in care au fost comandate si livrate produse care sunt, dupa livrare, potrivit naturii acestora, inseparabil amestecate cu alte elemente.\u003c/li\u003e\n    \u003cli\u003eIn cazul produselor care sunt susceptibile a se deteriora sau a expira rapid.\u003c/li\u003e\n    \u003cli\u003eIn cazul produselor alimentare si bauturilor, conform dispozitiilor art. 3.3.i) din OUG 34/2014.\u003c/li\u003e\n    \u003cli\u003eIn cazul produselor conforme care necesita asamblare, iar Clientul a desigilat produsul/produsele respective si a inceput procesul de asamblare.\u003c/li\u003e\n    \u003cli\u003eDaca Clientul este persoana juridica si doreste retragerea din contract in temeiul OUG 34/2014.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e9.8.6.\u003c/strong\u003e Produsele ce constituie un kit/set trebuie returnate ca un kit/set.\u003cbr\u003e\n    \u003cstrong\u003e9.8.7.\u003c/strong\u003e In cazul retragerii din contract a Clientului, Vanzatorul relevant (VIVRE HOMES S.R.L. sau, dupa caz, Partenerul Vivre Marketplace indicat pentru produs) ii ramburseaza acestuia toate sumele pe care le-a primit drept plata din partea sa, fara intarziere nejustificata si, in orice caz, nu mai tarziu de 14 zile de la data la care este informat de decizia de retragere din contract a Clientului conform art. 9.8.2. si 9.8.3. Rambursarea se face folosind aceleasi modalitati de plata ca si cele folosite de Client pentru tranzactia initiala, cu exceptia cazului in care Clientul a fost de acord cu o alta modalitate de plata. In cazul in care plata a fost efectuata la livrare (ramburs), la initierea procedurii de retur Clientul va avea obligatia de a furniza un cont bancar valid (IBAN) in care urmeaza sa fie returnate sumele aferente produselor returnate. Rambursarea sumelor achitate se va efectua de catre Vanzator imediat dupa receptionarea produselor returnate in depozitul acestuia, in conformitate cu termenul legal aplicabil.\u003cbr\u003e\n    \u003cstrong\u003e9.8.8.\u003c/strong\u003e Clientul poate returna produsele achizitionate prin intermediul unui Contract si este indreptatit sa primeasca partial contravaloarea platita pentru produse daca acestea sunt intr-o stare de diminuare a valorii de revanzare.\u003cbr\u003e\n    \u003cstrong\u003e9.8.9.\u003c/strong\u003e Daca Clientul nu impacheteaza corespunzator pentru protejarea/manipularea produselor returnate, curierul indicat este indreptatit sa nu preia bunurile notificate pentru retur. Daca Clientul trimite produsele impachetate necorespunzator prin alta metoda (alt curier, posta romana, predare personala etc.), acesta este raspunzator de orice distrugeri, defecte, descompletari constatate la receptia returului. Prevederile de mai sus nu se refera la ambalajul original al produselor, ci la orice ambalaj care conform standardelor de curierat este in masura sa protejeze produsele.\n\u003c/p\u003e\n\n\u003ch3\u003e10. Frauda\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e10.1.\u003c/strong\u003e Vivre Homes nu solicita Clientilor sau Utilizatorilor sai prin niciun mijloc de comunicare (e-mail/telefonic/SMS/ etc.) informatii referitoare la date confidentiale, conturi/carduri bancare sau parole personale.\u003cbr\u003e\n    \u003cstrong\u003e10.2.\u003c/strong\u003e Clientul / Membrul isi asuma intreaga responsabilitate pentru divulgarea unui tert a datelor sale confidentiale.\u003cbr\u003e\n    \u003cstrong\u003e10.3.\u003c/strong\u003e Vivre Homes declina orice responsabilitate, in situatia in care un Membru / Client ar fi / este prejudiciat sub orice forma de catre un tert care ar pretinde ca este/reprezinta interesele Vivre Homes.\u003cbr\u003e\n    \u003cstrong\u003e10.4.\u003c/strong\u003e Clientul sau Membrul va informa Vivre Homes asupra unor asemenea tentative, folosind datele de contact.\u003cbr\u003e\n    \u003cstrong\u003e10.5.\u003c/strong\u003e Vivre Homes nu promoveaza SPAM-ul. Orice Membru/client care a furnizat explicit adresa sa de e-mail pe site poate opta pentru dezactivarea contului de client aferent acestei adrese de e-mail.\u003cbr\u003e\n    \u003cstrong\u003e10.6.\u003c/strong\u003e Comunicarile realizate de catre Vivre Homes prin mijloace electronice de comunicare la distanta (i.e. e-mail) contin datele de identificare complete si conforme ale expeditorului sau legaturi catre acestea, la data transmiterii continutului.\u003cbr\u003e\n    \u003cstrong\u003e10.7.\u003c/strong\u003e Urmatoarele scopuri vor fi considerate tentativa de fraudare a Siteului/Continutul si/sau Vivre Homes. Vivre Homes isi rezerva dreptul de a pune in miscare urmarirea penala impotriva aceluia sau acelor care a(u) incercat sa, sau a(u) atins acest(e) scop(uri):\u003cbr\u003e\n    \u003cstrong\u003e10.7.1.\u003c/strong\u003e De a accesa datele de orice tip ale altui Membru/Client prin folosirea unui cont sau prin orice alta metoda.\u003cbr\u003e\n    \u003cstrong\u003e10.7.2.\u003c/strong\u003e De a altera sau de a modifica continutul Siteului sau orice corespondenta expediata prin orice modalitate de catre Vivre Homes catre Membru / Client.\u003cbr\u003e\n    \u003cstrong\u003e10.7.3.\u003c/strong\u003e De a afecta performantele serverului/serverelor pe care ruleaza siteul.\u003cbr\u003e\n    \u003cstrong\u003e10.7.4.\u003c/strong\u003e De a accesa sau de a divulga oricarui tert care nu are autoritatea legala necesara, continutul expediat prin orice mijloc de catre Vivre Homes catre Membru/ Client atunci cand acesta nu este destinatarul legitim al continutului.\n\u003c/p\u003e\n\n\u003ch3\u003e11. Limitare de responsabilitate\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e11.1.\u003c/strong\u003e Vivre Homes nu poate fi tinuta responsabila in nici un fel in fata niciunui Membru/Client care utilizeaza Siteul sau Continutul, altfel decat in limita articolelor ce constituie Termeni si Conditii.\u003cbr\u003e\n    \u003cstrong\u003e11.2.\u003c/strong\u003e In cazul in care un Membru/Client considera ca un Continut expediat prin orice mijloc de catre Vivre Homes violeaza drepturile de copyright sau orice alte drepturi, acesta poate sa contacteze pentru detalii Vivre Homes, conform detaliilor de contact la contact@vivre.eu astfel incat VIVRE HOMES S.R.L. poata lua o decizie in cunostinta de cauza.\u003cbr\u003e\n    \u003cstrong\u003e11.3.\u003c/strong\u003e Vivre Homes nu garanteaza Membrului sau clientului acces pe site sau la serviciu, in lipsa inregistrarii de catre acesta din urma prin parcurgerea etapelor de inregistrare de pe site, si nu ii confera dreptul de a descarca sau de a modifica partial si/sau integral continutul, de a reproduce partial sau integral continutul, de a copia, sau de a exploata orice continut in orice alta maniera, sau de a transfera vreunui tert orice continut asupra caruia are si/sau a obtinut acces, in baza unui acord de utilizare, fara acordul prealabil scris al Vivre Homes.\u003cbr\u003e\n    \u003cstrong\u003e11.4.\u003c/strong\u003e Vivre Homes nu raspunde de continutul, calitatea sau natura altor site-uri la care se ajunge prin legaturi din continut, indiferent de natura acestor legaturi. Pentru respectivele site-uri, raspunderea o poarta, integral, proprietarii acestora.\u003cbr\u003e\n    \u003cstrong\u003e11.5.\u003c/strong\u003e Vivre Homes este exonerata de orice vina in cazul utilizarii siteurilor si/sau al continutului transmis catre Membru sau Client, prin orice mijloc (electronic, telefonic etc.), prin intermediul siteurilor, e-mail-ului sau al unui angajat al Vivre Homes, atunci cand this utilizare a continutului poate sau produce pagube de orice natura Membrului, Clientului si/sau oricarui tert implicat in acest transfer de Continut.\u003cbr\u003e\n    \u003cstrong\u003e11.6.\u003c/strong\u003e Vivre Homes nu ofera niciun fel de garantii directe sau indirecte ca:\u003cbr\u003e\n    \u003cstrong\u003e11.6.1.\u003c/strong\u003e Serviciul va fi potrivit cerintelor clientului;\u003cbr\u003e\n    \u003cstrong\u003e11.6.2.\u003c/strong\u003e Serviciul va fi neintrerupt, sigur sau fara erori de orice fel;\u003cbr\u003e\n    \u003cstrong\u003e11.6.3.\u003c/strong\u003e Produsele/serviciile obtinute gratis sau contra-cost prin intermediul serviciului vor corespunde cerintelor sau asteptarilor clientului.\u003cbr\u003e\n    \u003cstrong\u003e11.7.\u003c/strong\u003e Vivre Homes nu garanteaza disponibilitatea, calitatea, autorizarea, experienta sau executarea serviciilor furnizate de Mesterii Parteneri si nu poate fi tinuta raspunzatoare pentru eventuale prejudicii rezultate din relatia dintre Client si Mesterul Partener.\u003cbr\u003e\n    In niciun caz Vivre Homes nu poate fi tinuta raspunzatoare pentru daune indirecte, pierderi de profit, pierderi comerciale sau alte prejudicii rezultate din utilizarea serviciilor furnizate de Mesterii Parteneri. \u003cbr\u003e \n    \u003cstrong\u003e11.8.\u003c/strong\u003e In limita prevederilor Termeni si Conditii, operatorii, administratorii si/sau proprietarii site-ului nu sunt sub nici o forma responsabili pentru relatiile sau consecintele acestora rezultand din, dar nelimitandu-se la, achizitii, oferte speciale, promotii, promovari, sau oricare alt tip de relatie / legatura / tranzactie / colaborare / etc. care pot aparea intre client sau Membru si oricare dintre cei care isi fac promovare directa sau indirecta prin intermediul siteului.\n\u003c/p\u003e\n\n\u003ch3\u003e12. Forta majora si cazul fortuit\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e12.1.\u003c/strong\u003e Exceptand cazurile in care nu au prevazut in mod expres altfel, nici una din partile unui contract incheiat, care este inca in derulare, nu va fi raspunzatoare pentru neexecutarea la termen si/sau in mod corespunzator, total sau partial, a oricareia din obligatiile care ii incumba in baza contractului, daca neexecutarea obligatiei respective a fost cauzata de un eveniment de forta majora.\u003cbr\u003e\n    \u003cstrong\u003e12.2.\u003c/strong\u003e Partea sau reprezentantul legal al partii care invoca evenimentul mai sus mentionat este obligat sa aduca la cunostinta celeilalte, imediat si in mod complet, producerea acestuia si sa ia orice masuri care-i stau la dispozitie in vederea limitarii consecintelor respectivului eveniment.\u003cbr\u003e\n    \u003cstrong\u003e12.3.\u003c/strong\u003e Partea sau reprezentantul legal al partii care invoca evenimentul mai sus mentionat este exonerat de la this obligatie numai in cazul in care evenimentul o impiedica sa o duca la bun sfarsit.\u003cbr\u003e\n    \u003cstrong\u003e12.4.\u003c/strong\u003e Daca in termen de 15 zile de la data producerii lui, respectivul eveniment nu inceteaza fiecare parte va avea dreptul sa notifice celeilalte parti incetarea de plin drept a acestui contract fara ca vreuna dintre ele sa poata pretinde celeilalte alte daune-interese.\u003cbr\u003e\n    \u003cstrong\u003e12.5.\u003c/strong\u003e Partea care invoca evenimentul de forta majora trebuie sa faca dovada imposibilitatii executarii obligatiilor in termen de 30 zile de la data producerii evenimentului dar in limitele art. 12.3.\n\u003c/p\u003e\n\n\u003ch3\u003e13. Litigii\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e13.1.\u003c/strong\u003e Prin folosirea/vizitarea/vizualizarea/etc siteurilor si/sau al oricarui continut trimis de catre Vivre Homes Membrului/Clientului prin accesare si/sau expediere prin orice mijloc (electronic, telefonic, etc), acesta se declara de acord cel putin cu prevederile \"Termeni si conditii\".\u003cbr\u003e\n    \u003cstrong\u003e13.2.\u003c/strong\u003e Orice disputa cu referire la prezentele Termeni si Conditii care ar putea sa apara intre Membru/Client si Vivre Homes se va rezolva pe cale amiabila.\u003cbr\u003e\n    \u003cstrong\u003e13.3.\u003c/strong\u003e Orice disputa, de orice fel, care ar putea sa apara intre Membru si VIVRE HOMES S.R.L.si partenerii sai, se va rezolva pe cale amiabila. Daca this nu va fi posibila, conflictul va fi solutionat de catre instanta competenta, conform prevederilor legale aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e13.4.\u003c/strong\u003e Avand in vedere dispozitiile Regulamentului (UE) nr. 524/2013 privind solutionarea online a litigiilor in materie de consum si de modificare a Regulamentului (CE) nr. 2006/2004 si a Directivei 2009/22/CE, Vivre Homes ofera Membrului/Clientului posibilitatea de a opta pentru solutionarea pe cale extrajudiciara a eventualelor litigii, prin utilizarea platformei europene de solutionare online a litigiilor (platforma SOL), instrument digital creat de Comisia Europeana pentru a facilita solutionarea independenta, impartiala, transparenta, eficace, rapida si echitabila, pe cale extrajudiciara, a litigiilor care privesc obligatiile contractuale rezultate din contractele de vanzare sau de prestare de servicii online dintre un consumator care isi are resedinta in Uniune si un comerciant stabilit in Uniune . In acest sens se poate utiliza urmatorul link catre platforma SOL: ODR.\u003cbr\u003e\n    \u003cstrong\u003e13.5.\u003c/strong\u003e Daca oricare dintre clauzele de mai sus va fi gasita nula sau nevalida, indiferent de cauza, this clauza nu va afecta valabilitatea celorlalte clauze.\u003cbr\u003e\n    \u003cstrong\u003e13.6.\u003c/strong\u003e Prezentul document a fost redactat si va fi interpretat in conformitate cu legislatia romana. Legea aplicabila – Jurisdictia Prezentul Contract este supus legii romane. Eventualele litigii aparute intre VIVRE HOMES S.R.L. si Clienti / Cumparatori se vor rezolva pe cale amiabila sau, in cazul in care this nu va fi posibila, litigiile vor fi solutionate de instantele judecatoresti romane competente din Municipiul Bucuresti.\n\u003c/p\u003e\n\n\u003ch3\u003e14. Informatii privind DEEE\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e14.1.\u003c/strong\u003e Deseurile de echipamente electrice si electronice (DEEE) pot contine substante periculoase ce au un impact negativ asupra mediului si sanatatii umane in cazul in care nu sunt colectate separat. Avand in vedere prevederile OUG 195/2005 – referitoare la protectia mediului si O.U.G. 5/2015 privind deseurile de echipamente electrice si electronice, Clientii vor avea in vedere urmatoarele:\u003cbr\u003e\n    \u003cstrong\u003e14.1.1.\u003c/strong\u003e CLIENTII au obligatia de a nu elimina deseurile de echipamente electrice si electronice (DEEE) ca deseuri municipale nesortate si de a colecta separat these DEEE;\u003cbr\u003e\n    \u003cstrong\u003e14.1.2.\u003c/strong\u003e Colectarea acestor deseuri (DEEE) se va efectua prin serviciul public de colectare a DEEE, direct de catre Asociatia Ecotic (conform pct. 15.1.3 si 15.1.4) si prin centre de colectare organizate de operatori economici autorizati pentru colectarea DEEE. Puteti accesa lista punctelor de colectare: http://www.ecotic.ro/consumatori/puncte-colectare-DEEE\u003cbr\u003e\n    \u003cstrong\u003e14.1.3.\u003c/strong\u003e Clientii pot preda DEEE in mod gratuit la punctele de colectare specificate la momentul achizitiei unui produs nou din aceeasi categorie. In functie de identitatea Vanzatorului produsului (VIVRE HOMES S.R.L. sau, dupa caz, Partenerul Vivre Marketplace indicat pentru produs), politica de colectare a DEEE se aplica in sistem de preluare a echipamentelor unul la unul, conform legislatiei in vigoare, daca echipamentul predat este echivalent si a indeplinit aceleasi functii ca si echipamentul nou furnizat. Clientii pot comunica this optiune catre Vivre Homes si/sau catre Partenerul relevant, la momentul comenzii sau la primirea acesteia, conform instructiunilor aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e14.1.4.\u003c/strong\u003e In cazul produselor vandute de Partenerii din Vivre Marketplace, obligatiile privind colectarea DEEE revin Partenerului Vanzator, conform legislatiei aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e14.2.\u003c/strong\u003e Simbolul care indica faptul ca echipamentele electrice si electronice fac obiectul unei colectari separate si ca these au fost introduse pe piata dupa data de 31.12.2006 reprezinta o pubela cu roti barata cu o cruce si cu bara neagra in partea de jos, ca in imaginea alaturata.\u003cbr\u003e\n    \u003cstrong\u003e14.3.\u003c/strong\u003e Aceasta pictograma indica faptul ca DEEE nu trebuie amestecate cu deseurile menajere si ca ele fac obiectul unei colectari separate.\u003cbr\u003e\n    \u003cstrong\u003e14.4.\u003c/strong\u003e Numarul de inregistrare in Registrul de punere pe piata a echipamentelor electrice si electronice: RO-2018-06-EEE-2231-II\u003cbr\u003e\n    \u003cstrong\u003e14.5.\u003c/strong\u003e Numarul de inregistrare in Registrul producatorilor de baterii si acumulatori: RO-2015-04-B\u0026A-0717\n\u003c/p\u003e\n\n\u003ch3\u003e15. REVIEW-URI si Ratinguri\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e15.1.\u003c/strong\u003e Scrierea de Review-uri, Comentarii se poate face de catre Utilizatori/Clienti/Cumparatori in sectiunea „Review-urile mele” sau din contul Vivre al Clientului. Informatiile inscrise pot fi atat pozitive, cat si negative, si se vor referi la caracteristicile si modul de folosire al unui produs sau serviciu.\u003cbr\u003e\n    \u003cstrong\u003e15.2.\u003c/strong\u003e In momentul inregistrarii unui anumit Review/Comentariu/Intrebare pe Site-ul ro.Vivre.eu, Clientul acorda Vivre Homes o licenta neexclusiva, perpetua, irevocabila, nelimitata teritorial si dau dreptul Vanzatorului de a utiliza, reproduce, modifica, adapta, publica, traduce, distribui si de a afisa acest continut.\u003cbr\u003e\n    \u003cstrong\u003e15.3.\u003c/strong\u003e Fiecare Client, in momentul inscrierii de Review/Comentariu/Intrebare in sectiunile mentionate, se angajeaza sa respecte urmatoarele reguli:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003esa faca referiri doar la caracteristici si/sau modul de utilizare al unui anumit produs sau serviciu, evitand informatii legate de aspecte ce se pot schimba (pret sau oferte promotionale) sau informatii care tin de modul desfasurarii Comenzii;\u003c/li\u003e\n    \u003cli\u003esa foloseasca doar limba romana;\u003c/li\u003e\n    \u003cli\u003esa utilizeze un limbaj corespunzator, neofensator, fara termeni care pot jigni sau afecta oricare alt Client;\u003c/li\u003e\n    \u003cli\u003esa se asigure ca informatiile introduse de ei sunt realiste, corecte, neinselatoare si in conformitate cu legile aplicabile, respectand astfel inclusiv drepturile altor parti, drepturile de autor, de marca comerciala, de licenta sau alte drepturi de proprietate, publicitate sau intimitate;\u003c/li\u003e\n    \u003cli\u003esa foloseasca this facilitate doar pentru a comunica sau a obtine detalii suplimentare referitoare la un anumit produs sau serviciu de pe Site, fara a face referire catre alte firme ce promoveaza vanzarea si cumpararea de produse sau servicii;\u003c/li\u003e\n    \u003cli\u003esa nu furnizeze sau sa solicite, in niciun mod si in nicio masura, date personale (detaliile de contact, informatii despre adresa de livrare sau de domiciliu, numere de telefon, adrese de email, nume si/sau prenume etc.) sau orice alta informatie care poate determina dezvaluirea acestor date personale;\u003c/li\u003e\n    \u003cli\u003esa nu inscrie informatii si/sau detalii despre URL-uri (legaturi) din alte site-uri comerciale ce desfasoara aceeasi activitate comerciala ca si Vanzatorul;\u003c/li\u003e\n    \u003cli\u003esa nu incerce fraudarea serviciilor puse la dispozitie de catre Vanzator sau sa inscrie Review-uri/Comentarii/Intrebari/ care sa contina materiale de natura publicitara;\u003c/li\u003e\n    \u003cli\u003esa nu utilizeze Review-ul/Comentariul/Intrebarea ca mijloc de comunicare cu Vanzatorul sau cu platforma Vivre in legatura cu o comanda sau o solicitare de suport.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    In acest sens, Clientul va folosi canalele dedicate de comunicare puse la dispozitie in Contul sau, respectiv sectiunea „Comenzile mele” → detalii comanda → rubrica „Conversatie cu vanzatorul”, prin intermediul careia poate lua legatura direct cu Partenerul de la care a achizitionat produsul, sau datele de contact afisate pe Site.\u003cbr\u003e\n    \u003cstrong\u003e15.4.\u003c/strong\u003e Pe langa o evaluarea realista, in momentul inscrierii unui Review, Clientul va adauga si un Rating relevant pentru produsul sau serviciul aferent. Review-urile, impreuna cu Ratingurile corespunzatoare lor, vor influenta Ratingul general al produsului sau serviciului. Astfel, un Review insotit de un Rating mare duce la o crestere a Ratingului general, iar un Review insotit de un Rating mic duce la o scadere a Ratingului general.\u003cbr\u003e\n    \u003cstrong\u003e15.5.\u003c/strong\u003e Cand un Review/Comentariu/Intrebare este semnalat de catre un Client ca avand un continut inadecvat, dintr-o perspectiva strict subiectiva, acest continut este examinat cu atentie de catre Vanzator pentru a determina daca incalca Termeni si Conditii Site. Textele, fotografiile sau videoclipurile introduse sunt eliminate din Site numai dupa examinarea acestora de catre Vanzator.\u003cbr\u003e\n    \u003cstrong\u003e15.6.\u003c/strong\u003e In cazul in care Vivre Homes constata incalcarea Termenelor si Conditiilor in mod repetat, isi rezerva dreptul de a suspenda posibilitatea Clientului de a inscrie Review-uri/Comentarii/Intrebari in sectiunea „Review-urile mele”. Pentru sesizari, reclamatii sau solicitari legate de Bunul si/sau Serviciul achizitionat, Cumparatorii pot contacta Vivre Homes la adresa contact@vivre.eu sau pot lua legatura direct cu Vanzatorul (Partenerul Marketplace) din Contul lor, accesand sectiunea „Comenzile mele” → detalii comanda → rubrica „Conversatie cu vanzatorul”. Termenul maxim de solutionare a reclamatiilor sau sesizarilor este de 30 de zile calendaristice de la primirea acestora.\u003cbr\u003e\n    \u003cstrong\u003e15.7 Moderarea conținutului\u003c/strong\u003e Vivre Homes poate utiliza procese automate și/sau verificare umană pentru moderarea Review-urilor, Comentariilor și Întrebărilor, în scopul detectării conținutului ilegal, înșelător, ofensator, spam sau care încalcă prezentul Document. În cazul eliminării sau restricționării unui Review, Clientul poate fi informat asupra motivelor și are dreptul de a formula contestație conform art. 3A.\n\u003c/p\u003e\n\n\u003ch3\u003e16. Dispozitii finale\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e16.1.\u003c/strong\u003e Vivre Homes isi rezerva dreptul de a putea efectua orice modificari ale acestor prevederi, precum si orice modificari ale site-ului/structurii acestuia/serviciului precum si orice continut fara notificare prealabila a Membrului sau Clientului.\u003cbr\u003e\n    \u003cstrong\u003e16.2.\u003c/strong\u003e In limita prevederilor Termeni si Conditii, Vivre Homes nu va putea fi facuta responsabila pentru eventualele erori aparute pe site din orice cauza, inclusiv din cauza unor modificari, setari, etc., care nu sunt facute de catre administratorul site-ului.\u003cbr\u003e\n    \u003cstrong\u003e16.3.\u003c/strong\u003e Vivre Homes isi rezerva dreptul de a introduce bannere publicitare de orice natura si/sau legaturi pe oricare pagina a site-ului, cu respectarea legislatiei in vigoare.\u003cbr\u003e\n\u003c/p\u003e    \n    \n    \u003ch3\u003e16A. Accesibilitate (Legea nr. 232/2022 / European Accessibility Act)\u003c/h3\u003e\n\u003cp\u003e    \n    \u003cstrong\u003e16A.1.\u003c/strong\u003e Vivre Homes depune eforturi rezonabile pentru a asigura accesibilitatea SITE-ului și a serviciilor digitale oferite, inclusiv pentru persoanele cu dizabilități, în conformitate cu cerințele legale aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e16A.2.\u003c/strong\u003e Platforma este dezvoltată având în vedere standarde recunoscute de accesibilitate (ex. WCAG), în măsura aplicabilității și proporționalității.\u003cbr\u003e\n    \u003cstrong\u003e16A.3.\u003c/strong\u003e Dacă întâmpinați dificultăți de accesibilitate (navigare, contrast, formulare, cititoare de ecran etc.), ne puteți contacta la contact@vivre.eu (subiect: „Accesibilitate”), pentru suport sau furnizarea informațiilor într-un format alternativ.\n\u003c/p\u003e\n\n\u003ch3\u003e17. Contact si alte informatii\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e17.1.\u003c/strong\u003e In cazul in care exista intrebari sau sugestii in legatura cu Vivre Homes, va rugam sa ne contactati prin e-mail la contact@vivre.eu, de Luni pana Vineri, program 09:00-18:00 sau să discutați oricând cu asistentul AI VIA disponibil pe site-ul Vivre.\u003cbr\u003e\n    \u003cstrong\u003e17.2.\u003c/strong\u003e Orice comentarii, intrebari, feedback, idei, sugestii sau alte comunicari sau informatii despre sau referitoare la site-ul ro.Vivre.eu, functionalitatea sau imbunatatirea acestuia vor ramane proprietatea VIVRE HOMES S.R.L.. Prelucrare date cu caracter personal: VIVRE HOMES S.R.L.. este inregistrata in registrul de evidenta a prelucrarilor de date cu caracter personal sub numarul 22845.\u003cbr\u003e\n    \u003cstrong\u003e17.3.\u003c/strong\u003e Responsabilul cu protectia datelor cu caracter personal poate fi contactat la adresa de e-mail dedicata: dpo@Vivre.eu.\n\u003c/p\u003e\n\n\u003ch3\u003e18. Politica de stergere a datelor\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e18.1.\u003c/strong\u003e Utilizatorul sau Clientul isi poate retrage in orice moment consimtamantul exprimat intelegand sa renunte la: accesul la Serviciu, alte servicii oferite de Vivre Homes prin intermediul Site-ului, in acest sens Utilizatorul sau Clientul va trimite un e-mail pe adresa dpo@Vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e18.2.\u003c/strong\u003e In situatia in care Utilizatorul sau Clientul nu doreste a mai primi din partea companiei Vivre newslettere/alerte si/sau comunicari efectuate in scop de marketing si publicitate/promotional prin intermediul oricarui canal de comunicare (electronic, telefonic, etc) poate efectua solicitarea de DEZABONARE disponibila in cuprinsul oricarei comunicari via e-mail sau prin trimiterea unei solicitari scrise pe adresa si catre responsabilul cu protectia datelor cu caracter personal dpo@Vivre.eu.\u003cbr\u003e\n    \u003cstrong\u003e18.3.\u003c/strong\u003e Utilizatorul sau Clientul, in conformitate cu dispozitiile si normele privind protectia datelor cu caracter personal, are dreptul de a solicita STERGEREA datelor sale personale prelucrate in scop comercial de catre compania Vivre in baza contractului agreat de parti, iar in acest sens poate formula solicitarea scrisa pe adresa si catre responsabilul cu protectia datelor cu caracter personal dpo@Vivre.eu.\n\u003c/p\u003e\n\n\u003ch3\u003e19. Neuro – Sistem de puncte de loialitate\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e19.1.\u003c/strong\u003e Vivre Homes poate pune la dispoziția Clientilor un sistem sub formă de puncte de loialitate denumit „Neuro”, care poate fi utilizat pentru obținerea de reduceri și rambursări exclusive la achizițiile efectuate pe platforma Vivre, precum și, după caz, pe alte platforme partenere.\u003cbr\u003e\n    \u003cstrong\u003e19.2.\u003c/strong\u003e Conversia Neuro este următoarea: 1 Neuro = 1 Euro = 5 RON.\u003cbr\u003e\n    \u003cstrong\u003e19.3.\u003c/strong\u003e Neuro poate fi aplicat ca discount la achiziționarea produselor, însă valoarea maximă care poate fi acoperită prin Neuro nu poate depăși 15% din valoarea totală a produselor din coșul de cumpărături.\u003cbr\u003e\n    \u003cstrong\u003e19.4.\u003c/strong\u003e Dacă Clientul are Neuro disponibil, acesta se poate aplica automat în coșul de cumpărături, până la plafonul maxim eligibil. Clientul are posibilitatea de a ajusta manual suma aplicată, putând opta pentru utilizarea unei valori mai mici sau pentru neutilizarea Neuro.\u003cbr\u003e\n    \u003cstrong\u003e19.5.\u003c/strong\u003e Neuro se aplică peste reducerile existente, însă nu poate depăși în niciun caz limita de 15% din valoarea produselor din coș.\u003cbr\u003e\n    \u003cstrong\u003e19.6.\u003c/strong\u003e Neuro poate fi acumulat prin diverse modalități, incluzând, dar fără a se limita la:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) bonus la activarea Wallet-ului;\u003c/li\u003e\n    \u003cli\u003eb) cumpărături efectuate pe Vivre;\u003c/li\u003e\n    \u003cli\u003ec) lăsarea de recenzii pentru produse;\u003c/li\u003e\n    \u003cli\u003ed) crearea primului design;\u003c/li\u003e\n    \u003cli\u003ee) concursuri și campanii speciale.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e19.7. Exemple de utilizare:\u003c/strong\u003e Comandă de 1.000 RON → discount maxim 124 RON = 25 Neuro; Comandă de 2.000 RON → discount maxim 248 RON = 50 Neuro; Comandă de 5.000 RON → discount maxim 620 RON = 124 Neuro. În cazul în care valoarea coșului este mai mică, sistemul aplică automat numărul exact de Neuro eligibili, până la plafonul maxim de -15%.\u003cbr\u003e\n    \u003cstrong\u003e19.8.\u003c/strong\u003e Vivre Homes își rezervă dreptul de a modifica, suspenda sau înceta programul Neuro, condițiile de acordare sau utilizare, precum și regulile campaniilor asociate, cu respectarea comenzilor deja plasate și a legislației aplicabile.\n\u003c/p\u003e\n\n\u003ch3\u003e20. Vivre Design – Instrument de design interior cu AI\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e20.1.\u003c/strong\u003e Vivre Homes pune la dispoziția Utilizatorilor un instrument digital de design interior asistat de inteligență artificială care permite generarea de propuneri vizuale pentru amenajarea spațiilor interioare, în funcție de preferințele Clientului.\u003cbr\u003e\n    \u003cstrong\u003e20.2.\u003c/strong\u003e Prin utilizarea Vivre Design, Clientul poate încărca o fotografie a unei camere proprii și poate genera sugestii de decor și amenajare, cu scop orientativ și inspirațional, înainte de achiziționarea produselor disponibile pe platforma Vivre.\u003cbr\u003e\n    \u003cstrong\u003e20.3.\u003c/strong\u003e Funcționalitatea Vivre Design poate include următoarele tipuri de experiențe:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) Redecorare – modificarea stilului camerei utilizând mobilierul existent și adăugarea unor elemente decorative noi;\u003c/li\u003e\n    \u003cli\u003eb) Transformare – reamenajarea completă a spațiului, cu propuneri noi de mobilier, culori și stil;\u003c/li\u003e\n    \u003cli\u003ec) Evaluare – sugestii și recomandări pentru îmbunătățirea camerei existente, fără modificări majore.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e20.4.\u003c/strong\u003e Clientul poate furniza detalii suplimentare privind spațiul său, inclusiv:\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003ea) tipul produselor dorite;\u003c/li\u003e\n    \u003cli\u003eb) culorile preferate;\u003c/li\u003e\n    \u003cli\u003ec) persoanele care vor utiliza camera.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\n    \u003cstrong\u003e20.5.\u003c/strong\u003e Rezultatul utilizării Vivre Design constă într-o imagine generată cu ajutorul AI, care poate include produse disponibile în magazinul online Vivre, împreună cu linkuri directe către acestea.\u003cbr\u003e\n    \u003cstrong\u003e20.6.\u003c/strong\u003e Clientul poate personaliza designul generat prin funcția „Remix”, având posibilitatea de a adăuga sau elimina piese de mobilier, de a modifica culorile și de a ajusta propunerea vizuală în funcție de preferințele proprii.\u003cbr\u003e\n    \u003cstrong\u003e20.7.\u003c/strong\u003e În cadrul secțiunii „Shop the Look”, Clientul poate primi recomandări de produse generate de AI și poate achiziționa direct produsele selectate, în condițiile prevăzute de prezentul Document și de contractele aplicabile.\u003cbr\u003e\n    \u003cstrong\u003e20.8.\u003c/strong\u003e Designurile generate prin Vivre Design vor fi salvate în contul Clientului, în secțiunea „Spațiul meu”, de unde pot fi vizualizate și șterse oricând de către Client.\u003cbr\u003e\n    \u003cstrong\u003e20.9.\u003c/strong\u003e Clientul înțelege și acceptă că imaginile și sugestiile generate prin Vivre Design au caracter orientativ și nu constituie o garanție privind aspectul final al produselor în spațiul real, rezultatul putând varia în funcție de condițiile concrete ale încăperii și de modul de utilizare a produselor achiziționate.\u003cbr\u003e\n    \u003cstrong\u003e20.10 Limitări\u003c/strong\u003e Rezultatele generate prin Vivre Design au caracter orientativ și inspirațional și nu constituie consultanță profesională (design interior/arhitectură). Vivre Homes nu garantează acuratețea absolută a imaginilor generate (dimensiuni, culori, proporții, compatibilitate produse). Clientul rămâne responsabil pentru verificarea caracteristicilor produselor înainte de achiziție.\n\u003c/p\u003e\n\u003ch3\u003e21. Vivre Services – Servicii pentru locuinta\u003c/h3\u003e\n\u003cp\u003e\n    \u003cstrong\u003e21.1.\u003c/strong\u003e Vivre Homes poate pune la dispozitia Utilizatorilor serviciul „Vivre Services”, reprezentand o platforma online de intermediere intre Clienti si Mesteri Parteneri care furnizeaza servicii pentru locuinta, inclusiv dar fara a se limita la servicii de montaj, reparatii, renovare, amenajari interioare si alte servicii conexe.\u003cbr\u003e\n    \u003cstrong\u003e21.2.\u003c/strong\u003e Prin utilizarea Vivre Services, Clientul poate transmite solicitari privind anumite servicii, inclusiv informatii referitoare la tipul serviciului solicitat, zona geografica si datele de contact necesare pentru procesarea solicitarii.\u003cbr\u003e\n    \u003cstrong\u003e21.3.\u003c/strong\u003e Vivre Homes actioneaza exclusiv ca intermediar tehnologic intre Client si Mesterul Partener si nu executa direct serviciile solicitate prin intermediul platformei.\u003cbr\u003e\n    \u003cstrong\u003e21.4.\u003c/strong\u003e Contractul privind executarea serviciilor se incheie direct intre Client si Mesterul Partener. Vivre Homes nu este parte in raportul contractual dintre acestia si nu raspunde pentru:\u003cbr\u003e\n\u003cul\u003e\n\u003cli\u003eexecutarea serviciilor;\u003c/li\u003e\n\u003cli\u003ecalitatea lucrarilor;\u003c/li\u003e\n\u003cli\u003etermenele de executare;\u003c/li\u003e\n\u003cli\u003epreturile practicate;\u003c/li\u003e\n\u003cli\u003eeventualele prejudicii rezultate din executarea sau neexecutarea serviciilor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cstrong\u003e21.5.\u003c/strong\u003e Prin transmiterea solicitarii, Clientul intelege si accepta ca datele sale de contact si informatiile necesare procesarii solicitarii sa fie transmise catre unul sau mai multi Mesteri Parteneri, in scopul procesarii solicitarii si facilitarii executarii serviciilor solicitate. \u003cbr\u003e\n\u003cstrong\u003e21.6.\u003c/strong\u003e Mesterii Parteneri au obligatia de a utiliza datele primite exclusiv in scopul furnizarii serviciilor solicitate si cu respectarea legislatiei aplicabile privind protectia datelor cu caracter personal.\u003cbr\u003e\n\u003cstrong\u003e21.7.\u003c/strong\u003e Vivre Homes isi rezerva dreptul de a selecta, suspenda sau elimina Mesteri Parteneri de pe platforma, fara obligatia de a furniza justificari suplimentare.\u003cbr\u003e\nVivre Homes poate efectua verificari minimale administrative privind identitatea Mesterilor Parteneri, insa nu garanteaza autorizarea profesionala, licentierea, experienta sau calificarea acestora, cu exceptia cazului in care se mentioneaza expres contrariul. \u003cbr\u003e\n\u003cstrong\u003e21.8.\u003c/strong\u003e Vivre Homes nu garanteaza disponibilitatea permanenta a Mesterilor Parteneri si nici preluarea tuturor solicitarilor transmise prin intermediul platformei.\u003cbr\u003e\nVivre Homes nu raspunde pentru anularea, reprogramarea sau neexecutarea serviciilor convenite intre Client si Mesterul Partener. \u003cbr\u003e\n\u003cstrong\u003e21.9.\u003c/strong\u003e Clientul este responsabil pentru corectitudinea si completitudinea informatiilor furnizate prin formularul de solicitare servicii.\u003cbr\u003e\n\u003c/p\u003e"])</script>
